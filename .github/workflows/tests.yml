name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep the service version aligned with pgtest's embedded PostgreSQL 17 and
# queryplans' golden plan shapes. Different planner majors can choose different
# valid index trees for the same seeded query.

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

  go:
    name: Go tests (legacy src/blocks/go)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/blocks/go/go.mod
          cache: false

      - name: Run Go tests
        working-directory: src/blocks/go
        run: go test ./...

  go-core-quality:
    name: Go root quality and policy gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # PostgreSQL runs as an explicit step container rather than a
    # `services:` entry on purpose: service containers start before
    # `actions/checkout`, so a workspace mount source does not exist yet
    # and Docker creates it root-owned, which fails checkout with EACCES.
    # Starting it here keeps checkout, the tuning mount below, and
    # teardown in a visible, ordered sequence.
    env:
      HCMNEXT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      HCMNEXT_PG_CONTAINER: hcmnext-pg-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start PostgreSQL (tuned per .github/postgres/init-tuning.sql)
        run: |
          docker run -d --name "$HCMNEXT_PG_CONTAINER" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --health-cmd "pg_isready -U postgres -d postgres" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            -v "${GITHUB_WORKSPACE}/.github/postgres:/docker-entrypoint-initdb.d:ro" \
            postgres:17
          for _ in $(seq 1 45); do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$HCMNEXT_PG_CONTAINER")"
            if [ "$status" = "healthy" ]; then
              echo "postgres is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became healthy; container logs:"
          docker logs "$HCMNEXT_PG_CONTAINER"
          exit 1

      - name: Build root module
        run: go build ./...

      # TOOL-002 pins buf in gen/TOOLS.lock and the generator tests shell
      # out to it; keep this version identical to the lock file.
      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          # Resolving the release download is a GitHub API call; unauthenticated
          # it shares the runner IP's anonymous rate limit and fails the job
          # before any test runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Build outputs live under .artifacts and enter the executable through
      # a Go build overlay; the checked-in asset tree stays source-only.
      - name: Build embedded frontend assets
        run: bash scripts/build.sh hcmnext

      - name: Run the quality gate (gofmt, go vet, staticcheck)
        run: go run ./tools/quality

      - name: Workflow conformance promotion gate (REV-048-01)
        run: npm run check:workflowconformance

      - name: Workflow maturity catalog baseline gate (REV-053-01)
        run: go run ./tools/planning/cmd/workflowmaturity -root .

      - name: Test hygiene gate (REV-103-03)
        run: go run ./tools/quality testhygiene -root .

      - name: Ticked todo traceability gate (REV-103-02)
        run: go run ./tools/planning/cmd/plancheck traceability .

      - name: Ticked runtime reachability gate (REV-103-01)
        run: npm run check:reachability

      - name: Per-file Go test coverage inventory gate (REV-103-04)
        run: npm run check:testcoverage

      - name: Require evidence for new module, process and service boundaries
        run: go run ./tools/quality decomposition -root . -index definitions/architecture/decomposition-boundaries.json

      # Wall-clock interaction budgets are intentionally measured outside the
      # race detector, whose instrumentation changes timing and allocations.
      - name: UI interaction latency gate
        run: go test -count=1 -run '^TestInteractionLatencyGate$' -v ./internal/humanwork/productui ./tools/uxqual/render/journey

      - name: Drift gate (MSRC-010)
        run: go run ./tools/policy/driftgate/cmd/driftgate -root .
      - name: API compatibility gate (PROTO-008)
        run: go run ./tools/policy/apigate/cmd/apigate -root .
      - name: Substrate coverage (SUBSTRATE-COVERAGE-001)
        run: go run ./tools/policy/substratecoverage/cmd/substratecoverage -root .
      - name: Clean-checkout gate (CICD-001)
        run: go run ./tools/policy/cleancheckout/cmd/cleancheckout -root .
      - name: Migration rehearsal gate (CICD-002, REV-034-01)
        run: go run ./tools/policy/migrationci/cmd/migrationci -root . -manifest migrations/manifest.json -rehearse -database-url "$HCMNEXT_TEST_DATABASE_URL"
      # `decide` exits successfully only for a signed PROCEED decision, so
      # every refusal verdict and every input/tool error fails this gate.
      - name: Release decision admission gate (REV-034-02)
        run: go run ./tools/policy/release/cmd/release decide -id ci-admission-proof -evidence tools/policy/release/testdata/rev034_decide_proceed_evidence.json -policy tools/policy/release/testdata/rev034_decide_policy.json -now 2026-09-12T12:00:00Z
      - name: Engine coverage (ENGINE-COVERAGE-001)
        run: go run ./tools/policy/enginecoverage/cmd/enginecoverage -root .
      - name: Verify concurrent-package race coverage policy (TOOL-012)
        run: go run ./tools/policy/racepolicy/cmd/racepolicy -root .
      - name: Injected-clock gate (REV-101-07)
        run: go run ./tools/policy/clockinject/cmd/clockinject -root .
      - name: Ignored-error lint (REV-103-06)
        run: go run ./tools/policy/errlint/cmd/errlint internal/data/operationstore/store.go internal/intent/app/pgstore/pgstore.go internal/trust/session/store.go internal/intent/app/journey_intervention.go internal/transport/evidence/server.go
      - name: Library firewall gate (REV-101-05)
        run: go run ./tools/policy/libfirewall/cmd/libfirewall -root .

      - name: Stop PostgreSQL
        if: always()
        run: docker rm --force "$HCMNEXT_PG_CONTAINER" || true

  # Race and coverage answer different questions and together sweep hundreds
  # of packages. Give four deterministic shards their own runners and isolated
  # PostgreSQL instances; the fan-in below requires every shard to succeed.
  go-core-race:
    name: Go race detector (TOOL-012, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HCMNEXT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      HCMNEXT_PG_CONTAINER: hcmnext-pg-race-${{ matrix.shard }}
      HCMNEXT_CI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start PostgreSQL
        run: |
          docker run -d --name "$HCMNEXT_PG_CONTAINER" -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p 5432:5432 --shm-size=512m --health-cmd "pg_isready -U postgres -d postgres" --health-interval 10s --health-timeout 5s --health-retries 5 -v "${GITHUB_WORKSPACE}/.github/postgres:/docker-entrypoint-initdb.d:ro" postgres:17
          for _ in $(seq 1 45); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' "$HCMNEXT_PG_CONTAINER")" = healthy ] && exit 0
            sleep 2
          done
          docker logs "$HCMNEXT_PG_CONTAINER"
          exit 1
      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build embedded frontend assets
        run: bash scripts/build.sh hcmnext
      - name: Run the race detector over every concurrent package (TOOL-012)
        run: |
          mkdir -p .artifacts
          go run ./tools/policy/racepolicy/cmd/racepolicy -root . -list > .artifacts/race-packages.txt
          awk -v shard="$HCMNEXT_CI_SHARD" '((NR - 1) % 4) == shard' .artifacts/race-packages.txt > .artifacts/race-shard.txt
          echo "racing shard $HCMNEXT_CI_SHARD: $(wc -l < .artifacts/race-shard.txt) concurrent package(s)"
          xargs -a .artifacts/race-shard.txt go test -race -count=1 -p=2 -timeout=30m
      - name: PostgreSQL diagnostics on race failure
        if: failure()
        run: docker logs --tail 200 "$HCMNEXT_PG_CONTAINER" || true
      - name: Stop PostgreSQL
        if: always()
        run: docker rm --force "$HCMNEXT_PG_CONTAINER" || true

  go-core-coverage:
    name: Go coverage gate (70%, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      HCMNEXT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      HCMNEXT_PG_CONTAINER: hcmnext-pg-coverage-${{ matrix.shard }}
      HCMNEXT_CI_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start PostgreSQL
        run: |
          docker run -d --name "$HCMNEXT_PG_CONTAINER" -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres -p 5432:5432 --shm-size=512m --health-cmd "pg_isready -U postgres -d postgres" --health-interval 10s --health-timeout 5s --health-retries 5 -v "${GITHUB_WORKSPACE}/.github/postgres:/docker-entrypoint-initdb.d:ro" postgres:17
          for _ in $(seq 1 45); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' "$HCMNEXT_PG_CONTAINER")" = healthy ] && exit 0
            sleep 2
          done
          docker logs "$HCMNEXT_PG_CONTAINER"
          exit 1
      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build embedded frontend assets
        run: bash scripts/build.sh hcmnext
      - name: Unit-test and coverage floor gate (70%)
        run: go run ./tools/quality/covergate/cmd/covergate -root . -all -shard-index "$HCMNEXT_CI_SHARD" -shard-count 4
      - name: PostgreSQL diagnostics on coverage failure
        if: failure()
        run: docker logs --tail 200 "$HCMNEXT_PG_CONTAINER" || true
      - name: Stop PostgreSQL
        if: always()
        run: docker rm --force "$HCMNEXT_PG_CONTAINER" || true

  # Preserve the existing required check name. Branch protection continues to
  # require "Tests / Go tests (root module)", which now passes only when all
  # three independently required root-module lanes succeeded.
  go-core:
    name: Go tests (root module)
    if: always()
    needs:
      - go-core-quality
      - go-core-race
      - go-core-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every root-module lane
        env:
          QUALITY_RESULT: ${{ needs.go-core-quality.result }}
          RACE_RESULT: ${{ needs.go-core-race.result }}
          COVERAGE_RESULT: ${{ needs.go-core-coverage.result }}
        run: |
          printf 'quality=%s race=%s coverage=%s\n' "$QUALITY_RESULT" "$RACE_RESULT" "$COVERAGE_RESULT"
          [ "$QUALITY_RESULT" = success ]
          [ "$RACE_RESULT" = success ]
          [ "$COVERAGE_RESULT" = success ]

  go-core-ephemeral-pg:
    name: Go tests (ephemeral embedded PostgreSQL, TOOL-014)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No postgres service container here, and HCMNEXT_TEST_DATABASE_URL is
    # deliberately left unset: this job proves the OTHER supported path
    # through internal/data/pgtest, where each `go test` process downloads
    # (once, from cache) and starts its own throwaway PostgreSQL server on
    # a free port, and tears it down when the process exits. That is the
    # TOOL-014 "ephemeral integration-test environment" contract; the
    # go-core job's shared service container plus per-test schema
    # isolation (see internal/data/pgtest's own package doc) is the other
    # supported path, and is what every other Postgres-backed suite in
    # this repository runs against for speed.
    env:
      HCMNEXT_TEST_PG_CACHE: ${{ github.workspace }}/.cache/embedded-postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Keyed on the pinned PostgreSQL version (internal/data/pgtest's own
      # versionString), so a future version bump downloads fresh instead of
      # silently reusing a stale archive under a name embedded-postgres no
      # longer looks for.
      - name: Cache the embedded PostgreSQL binary archive
        uses: actions/cache@v6
        with:
          path: ${{ env.HCMNEXT_TEST_PG_CACHE }}
          key: embedded-postgres-linux-amd64-17.5.0

      - name: Run the ephemeral-PostgreSQL harness itself
        run: go test -count=1 ./internal/data/pgtest/...

  dependency-admission:
    name: Dependency license & vulnerability admission (TOOL-019/TOOL-024)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # govulncheck needs golang.org/x/vuln/cmd/govulncheck, which is not
      # in go.mod's tool block (it is not a build-time dependency, and the
      # offline development machine cannot reach its vulnerability
      # database), and it needs network access to that database. Both are
      # true here and only here: this step never runs on a developer
      # machine. A nonzero exit here means "found something" (or, rarely,
      # a scan failure); either way the JSON stream it already wrote is
      # what tools/policy/depadmission evaluates, so the step's own exit
      # code is deliberately not fatal to the job.
      - name: Run govulncheck (network required; CI-only)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -json ./... > govulncheck.json || true

      # TOOL-019/TOOL-024: classify every go.mod-required module's license
      # against definitions/architecture/dependency-admission.yaml, join
      # dependency-roles.yaml's ownership/SLA/replacement governance via
      # tools/policy/depmanifest, and classify govulncheck's findings as
      # reachable (blocks admission unless a governed exception covers the
      # exact module/version/vulnerability triple) or unreachable (always
      # recorded). -require-vuln-evidence turns missing or incomplete
      # govulncheck evidence into a hard failure here, where network access
      # makes "missing" a real problem rather than the offline default.
      - name: Evaluate dependency admission
        run: go run ./tools/policy/depadmission/cmd/depadmission -govulncheck-json govulncheck.json -require-vuln-evidence -out dependency-admission-report.json

      - name: Upload admission report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-admission-report
          path: |
            dependency-admission-report.json
            govulncheck.json
          retention-days: 30
