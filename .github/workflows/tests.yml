name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node tests
        run: npm test

  go:
    name: Go tests (legacy src/blocks/go)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/blocks/go/go.mod
          cache: false

      - name: Run Go tests
        working-directory: src/blocks/go
        run: go test ./...

  go-core:
    name: Go tests (root module)
    runs-on: ubuntu-latest
    # This job runs the root module's suite TWICE and has to budget for both:
    # once under the race detector (narrowed to the concurrent packages, see
    # the TOOL-012 step) and once in full under covergate, which shells out to
    # `go test -count=1 -cover` over every measurable package to compute the
    # 70% floor. They are separate sweeps because they answer separate
    # questions, and neither can be dropped.
    #
    # Measured on run 34548568659 (ubuntu-latest, 4 cores): the unnarrowed
    # `-race ./...` sweep burned 11,080 package-seconds over 530 of the 776
    # packages in 55 minutes of wall clock before the 60-minute wall cancelled
    # it with ~200 packages still unrun. internal/data alone was 6,803 of those
    # seconds (101 PostgreSQL-backed packages), and internal/operations/
    # reliability contributed 600 of them by hanging in an infinite directory
    # walk until the per-package test timeout fired (fixed in
    # reliability_test.go). Narrowing the race sweep to the 332 concurrent
    # packages leaves ~6,700 package-seconds there, and the coverage sweep is
    # ~7,900 without the detector, which is roughly 33 + 39 minutes of wall
    # clock at the observed 3.4x package parallelism. 120 leaves real headroom
    # over that ~80-minute budget; do not lower it without re-measuring.
    #
    # If this becomes too slow to live with, the next move is to split the
    # coverage sweep into its own job so the two run in parallel. That needs a
    # branch-protection change in the same breath, because "Tests / Go tests
    # (root module)" is a required status check and a gate moved into a job
    # that is not required stops being enforced.
    timeout-minutes: 120

    # PostgreSQL runs as an explicit step container rather than a
    # `services:` entry on purpose: service containers start before
    # `actions/checkout`, so a workspace mount source does not exist yet
    # and Docker creates it root-owned, which fails checkout with EACCES.
    # Starting it here keeps checkout, the tuning mount below, and
    # teardown in a visible, ordered sequence.
    env:
      HCMNEXT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      HCMNEXT_PG_CONTAINER: hcmnext-pg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Start PostgreSQL (tuned per .github/postgres/init-tuning.sql)
        run: |
          docker run -d --name "$HCMNEXT_PG_CONTAINER" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            --shm-size=512m \
            --health-cmd "pg_isready -U postgres -d postgres" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            -v "${GITHUB_WORKSPACE}/.github/postgres:/docker-entrypoint-initdb.d:ro" \
            postgres:16
          for _ in $(seq 1 45); do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$HCMNEXT_PG_CONTAINER")"
            if [ "$status" = "healthy" ]; then
              echo "postgres is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became healthy; container logs:"
          docker logs "$HCMNEXT_PG_CONTAINER"
          exit 1

      - name: Build root module
        run: go build ./...

      # TOOL-002 pins buf in gen/TOOLS.lock and the generator tests shell
      # out to it; keep this version identical to the lock file.
      - name: Set up buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.72.0
          # Resolving the release download is a GitHub API call; unauthenticated
          # it shares the runner IP's anonymous rate limit and fails the job
          # before any test runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The workspace asset manifest (internal/humanwork/workspace) covers
      # the built wasm bundles, which are git-ignored build outputs, so a
      # clean checkout must build them before any test reads the manifest.
      # Order matters: journeywasm generates manifest.json from the files
      # present, and its packaging allowlist admits uxqual.wasm while the
      # runtime allowlist never serves it, so uxqual.wasm must land AFTER
      # the manifest is written. Reversing these two lines bakes a manifest
      # the validator rejects as stale.
      - name: Build embedded frontend assets
        run: |
          go run ./tools/uxqual/cmd/journeywasm -out internal/humanwork/workspace/assets
          GOOS=js GOARCH=wasm go build -o internal/humanwork/workspace/assets/uxqual.wasm ./tools/uxqual/cmd/uxqualwasm

      - name: Run the quality gate (gofmt, go vet, staticcheck)
        run: go run ./tools/quality

      - name: Require evidence for new module, process and service boundaries
        run: go run ./tools/quality decomposition -root . -index definitions/architecture/decomposition-boundaries.json

      # Wall-clock interaction budgets are intentionally measured outside the
      # race detector, whose instrumentation changes timing and allocations.
      - name: UI interaction latency gate
        run: go test -count=1 -run '^TestInteractionLatencyGate$' -v ./internal/humanwork/productui ./tools/uxqual/render/journey

      # TOOL-012: the race class only runs for real on Linux CI; the local
      # dev machine (windows/arm64) has no race detector support, so
      # tools/quality's TestTodo_TOOL_012 skips itself there. This is that
      # promised Linux run.
      #
      # The package set comes from tools/policy/racepolicy itself (-list),
      # which is the same scan the policy step below audits: every package
      # that imports sync/sync/atomic or starts a goroutine (transaction,
      # workflow, queue, cache, connector, ...). Racing that set instead of
      # ./... is not a narrowing of the TOOL-012 contract, it IS the contract
      # written down -- and because both steps read one scan, a package that
      # becomes concurrent starts being raced without anyone editing this
      # file, while one that cannot be raced for want of a resolving test file
      # still fails the policy step. The packages left out are not skipped:
      # the coverage sweep below runs every measurable package, detector off.
      #
      # What this buys is time. `-race ./...` re-ran all 101 PostgreSQL-backed
      # internal/data packages under the detector for no race-class signal,
      # and that is most of what blew the old 60-minute wall.
      #
      # tools/quality's TestTodo_TOOL_012 keeps its RED/GREEN proof either
      # way: it shells out to `go test -race` over
      # tools/quality/testdata/racefixture in a subprocess, so it needs a
      # race-capable platform (this one) rather than a race-instrumented
      # parent, and the coverage sweep runs it here.
      #
      # xargs, not $(cat ...), so a future list too long for one argv becomes
      # several `go test` invocations rather than a truncation; xargs still
      # exits nonzero if any of them fails.
      - name: Run the race detector over every concurrent package (TOOL-012)
        run: |
          mkdir -p .artifacts
          go run ./tools/policy/racepolicy/cmd/racepolicy -root . -list > .artifacts/race-packages.txt
          echo "racing $(wc -l < .artifacts/race-packages.txt) concurrent package(s)"
          xargs -a .artifacts/race-packages.txt go test -race -count=1
      # This is also the full-suite sweep with the detector off: covergate
      # -all shells out to `go test -count=1 -cover` over every measurable
      # package (everything except gen/, src/blocks/go, testdata and dot
      # directories), so a package outside the concurrent set above still has
      # to build and pass here.
      - name: Unit-test and coverage floor gate (70%)
        run: go run ./tools/quality/covergate/cmd/covergate -root . -all
      - name: Drift gate (MSRC-010)
        run: go run ./tools/policy/driftgate/cmd/driftgate -root .
      - name: API compatibility gate (PROTO-008)
        run: go run ./tools/policy/apigate/cmd/apigate -root .
      - name: Substrate coverage (SUBSTRATE-COVERAGE-001)
        run: go run ./tools/policy/substratecoverage/cmd/substratecoverage -root .
      - name: Engine coverage (ENGINE-COVERAGE-001)
        run: go run ./tools/policy/enginecoverage/cmd/enginecoverage -root .
      - name: Verify concurrent-package race coverage policy (TOOL-012)
        run: go run ./tools/policy/racepolicy/cmd/racepolicy -root .

      - name: Stop PostgreSQL
        if: always()
        run: docker rm --force "$HCMNEXT_PG_CONTAINER" || true

  go-core-ephemeral-pg:
    name: Go tests (ephemeral embedded PostgreSQL, TOOL-014)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # No postgres service container here, and HCMNEXT_TEST_DATABASE_URL is
    # deliberately left unset: this job proves the OTHER supported path
    # through internal/data/pgtest, where each `go test` process downloads
    # (once, from cache) and starts its own throwaway PostgreSQL server on
    # a free port, and tears it down when the process exits. That is the
    # TOOL-014 "ephemeral integration-test environment" contract; the
    # go-core job's shared service container plus per-test schema
    # isolation (see internal/data/pgtest's own package doc) is the other
    # supported path, and is what every other Postgres-backed suite in
    # this repository runs against for speed.
    env:
      HCMNEXT_TEST_PG_CACHE: ${{ github.workspace }}/.cache/embedded-postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Keyed on the pinned PostgreSQL version (internal/data/pgtest's own
      # versionString), so a future version bump downloads fresh instead of
      # silently reusing a stale archive under a name embedded-postgres no
      # longer looks for.
      - name: Cache the embedded PostgreSQL binary archive
        uses: actions/cache@v6
        with:
          path: ${{ env.HCMNEXT_TEST_PG_CACHE }}
          key: embedded-postgres-linux-amd64-17.5.0

      - name: Run the ephemeral-PostgreSQL harness itself
        run: go test -count=1 ./internal/data/pgtest/...

  dependency-admission:
    name: Dependency license & vulnerability admission (TOOL-019/TOOL-024)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      # govulncheck needs golang.org/x/vuln/cmd/govulncheck, which is not
      # in go.mod's tool block (it is not a build-time dependency, and the
      # offline development machine cannot reach its vulnerability
      # database), and it needs network access to that database. Both are
      # true here and only here: this step never runs on a developer
      # machine. A nonzero exit here means "found something" (or, rarely,
      # a scan failure); either way the JSON stream it already wrote is
      # what tools/policy/depadmission evaluates, so the step's own exit
      # code is deliberately not fatal to the job.
      - name: Run govulncheck (network required; CI-only)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -json ./... > govulncheck.json || true

      # TOOL-019/TOOL-024: classify every go.mod-required module's license
      # against definitions/architecture/dependency-admission.yaml, join
      # dependency-roles.yaml's ownership/SLA/replacement governance via
      # tools/policy/depmanifest, and classify govulncheck's findings as
      # reachable (blocks admission unless a governed exception covers the
      # exact module/version/vulnerability triple) or unreachable (always
      # recorded). -require-vuln-evidence turns missing or incomplete
      # govulncheck evidence into a hard failure here, where network access
      # makes "missing" a real problem rather than the offline default.
      - name: Evaluate dependency admission
        run: go run ./tools/policy/depadmission/cmd/depadmission -govulncheck-json govulncheck.json -require-vuln-evidence -out dependency-admission-report.json

      - name: Upload admission report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-admission-report
          path: |
            dependency-admission-report.json
            govulncheck.json
          retention-days: 30
