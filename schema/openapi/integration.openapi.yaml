webhooks:
  intent.status_changed:
    post:
      operationId: onIntentStatusChanged
      tags:
        - Webhooks
      summary: An intent's lifecycle dimensions changed.
      description: |-
        Delivered as an HTTP POST of one Event to the subscription's endpoint. Deliveries follow the Standard Webhooks convention:

        - webhook-id: the event id, stable across retries and replays, for deduplication.
        - webhook-timestamp: Unix seconds when the delivery was signed. Receivers should reject values more than five minutes from their clock.
        - webhook-signature: space-separated list of v1,<base64 HMAC-SHA256> signatures over "{webhook-id}.{webhook-timestamp}.{body}" with the subscription's signing secret. During secret rotation, deliveries carry one signature per active secret.

        Any 2xx response acknowledges the delivery. Other responses, timeouts over ten seconds and connection failures are retried with exponential backoff and jitter for up to 72 hours; after that the delivery is recorded as failed and can be replayed. Events for the same subject are delivered in order; a subscription that keeps failing is moved to FAILING and then paused. Deliveries carry only fields the subscribing client may read.
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Event id.
          schema:
            type: string
        - name: webhook-timestamp
          in: header
          required: true
          description: Unix seconds.
          schema:
            type: integer
        - name: webhook-signature
          in: header
          required: true
          description: One or more v1,<base64> HMAC-SHA256 signatures.
          schema:
            type: string
      requestBody:
        required: true
        description: An Event whose type is intent.status_changed.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
      responses:
        2XX:
          description: Delivery acknowledged.
        default:
          description: Not acknowledged; the delivery is retried.
