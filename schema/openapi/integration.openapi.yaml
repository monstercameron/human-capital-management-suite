# HCM Next Integration API design contract (DRAFT).
# Hand-maintained; see INTAPI-009 for the drift check. Protobuf remains canonical.
openapi: 3.1.0
info:
  title: HCM Next Integration API
  version: 0.1.0-draft
  description: |
    Status: DRAFT. This document is the design contract for the planned external HTTP integration layer of HCM Next. It is hand-authored and describes resource-style endpoints that are mostly not served yet.

    Protobuf remains the canonical contract. Every resource endpoint here is a projection of a governed capability and, where one exists, of a protobuf RPC. The generated document schema/openapi/rpcs.openapi.yaml lists every declared RPC at its Connect path. Each operation in this document carries these extensions:

    - x-hcmnext-todo: the backlog item in planning/todos.md that delivers the operation.
    - x-hcmnext-status: SERVED when an equivalent RPC is served today, otherwise PLANNED. SERVED does not mean the resource-style path is mounted; INTAPI-007 adds those aliases.
    - x-hcmnext-rpc: the backing protobuf RPC, when one exists.
    - x-hcmnext-write-model: which write model the operation belongs to.

    Write models:

    - a. Governed business facts (workers, persons, employments, assignments, organization units, positions, compensation, leave, access) are read with effective-dated, field-authorized GET operations. They are created, changed and ended only through action endpoints that create an intent and return 202 with it. Rescinding a change means cancelling or superseding its intent. There is no generic PATCH or DELETE on these facts.
    - b. Configuration and custom data use versioned CRUD: create, get, list, update with a required If-Match revision, and retire. Nothing is hard-deleted. High-impact changes return 202 with an approval intent.
    - c. Externally mastered data is observed and linked, never overwritten.
    - d. Append-only records are created, corrected or voided; corrections append and nothing is erased. Evidence is read and exported.
    - none. Operational resources such as operations, exports, the event feed and authentication.

    Common rules: every POST, PUT and PATCH takes an Idempotency-Key header (except the OAuth token endpoint and provider callbacks, which have their own replay protection); a replay with the same key and body returns the original result and a reuse with a different body returns 409. Revision-bearing resources return ETag. Stale revisions return 412. Lists use opaque signed cursors. Errors use application/problem+json carrying the canonical ErrorDetail from hcmnext.common.v1. Money is a decimal string plus an ISO 4217 currency. Timestamps are RFC 3339. Effective intervals are half-open [effective_from, effective_to). Tenant, organization scope, principal and purpose always come from the authenticated token and never from request fields.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
servers:
  - url: https://{cell_host}
    description: A served cell.
    variables:
      cell_host:
        default: api.example.invalid
security:
  - oauth2: []
tags:
  - name: Authentication
    description: Token issuance and signing keys for machine clients.
  - name: Machine clients
    description: Registration of machine clients, their grants and their public keys.
  - name: Registry
    description: Discovery of intent definitions and capabilities.
  - name: Intents
    description: The BusinessIntent lifecycle. Every change to a governed fact is an intent.
  - name: People
    description: "Workers, persons, employments and assignments: reads and intent-backed actions."
  - name: Organization
    description: "Organization units and positions: reads and intent-backed reorganization."
  - name: Compensation
    description: "Compensation packages: reads and intent-backed changes."
  - name: Leave
    description: "Leave requests: reads and intent-backed requests and cancellations."
  - name: Access
    description: "Access grants to named workers and clients: reads and intent-backed grants and revocations."
  - name: Workflow instances
    description: Inspection and governed control of running workflows.
  - name: Work items
    description: "Human work: queues, claims, completions and approval decisions."
  - name: Operations
    description: Long-running operations and their results.
  - name: Custom data
    description: Tenant-defined object types and their records.
  - name: Parameters and secrets
    description: Tenant parameters per scope and environment, and write-only secrets.
  - name: Workflow definitions
    description: Workflow definitions and their versions.
  - name: Roles
    description: Role templates and qualified role bindings.
  - name: Connectors
    description: Connector definitions and tenant connections.
  - name: Job architecture
    description: Job families, levels, grades and profiles.
  - name: Reports
    description: Governed report definitions and runs.
  - name: External data
    description: Observations from connected systems and links to their objects.
  - name: Records
    description: "Append-only records: attestations and intent notes."
  - name: Imports and exports
    description: Asynchronous bulk data movement.
  - name: Evidence
    description: Execution receipts and evidence exports.
  - name: Webhooks
    description: Outbound webhook subscriptions.
  - name: Events
    description: Pull feed of change events.
  - name: Inbound webhooks
    description: Callbacks from providers of configured connections.
paths:
  /v1/intent-definitions:
    get:
      operationId: listIntentDefinitions
      tags:
        - Registry
      summary: List intent definitions
      description: Lists the intent definitions the caller may use, filtered by phase and tenant availability. Definitions the caller is not authorized to see are omitted rather than reported as denied. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of intent definitions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentDefinitionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.read
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.registry.v1.RegistryService/ListIntentDefinitions
      x-hcmnext-write-model: none
  /v1/intent-definitions/{intent_definition_id}:
    get:
      operationId: getIntentDefinition
      tags:
        - Registry
      summary: Get an intent definition
      description: Returns one immutable intent definition, including its input schema reference, risk class and allowed execution modes. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - name: intent_definition_id
          in: path
          required: true
          description: Intent type identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The intent definition.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.read
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.registry.v1.RegistryService/GetIntentDefinition
      x-hcmnext-write-model: none
  /v1/capabilities:
    get:
      operationId: listCapabilities
      tags:
        - Registry
      summary: List capabilities
      description: Lists the semantic capabilities the caller may invoke. Each resource endpoint in this document maps to one or more governed capabilities. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: One page of capabilities.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.read
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.registry.v1.RegistryService/ListCapabilities
      x-hcmnext-write-model: none
  /v1/capabilities/{capability_id}:
    get:
      operationId: getCapability
      tags:
        - Registry
      summary: Get a capability
      description: Returns one immutable capability descriptor. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - name: capability_id
          in: path
          required: true
          description: Capability identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The capability.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.read
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.registry.v1.RegistryService/GetCapability
      x-hcmnext-write-model: none
  /v1/intents:
    get:
      operationId: listIntents
      tags:
        - Intents
      summary: List intents
      description: Lists intents visible to the caller as a stable snapshot. Filters narrow the snapshot; they never widen what the caller may see. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/page_size"
        - $ref: "#/components/parameters/cursor"
        - name: intent_type_id
          in: query
          required: false
          description: Only intents of this definition.
          schema:
            type: string
        - name: request_state
          in: query
          required: false
          description: Only intents in this request state.
          schema:
            $ref: "#/components/schemas/RequestState"
        - name: subject_id
          in: query
          required: false
          description: Only intents naming this subject.
          schema:
            type: string
      responses:
        "200":
          description: One page of intents.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.read
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.intents.v1.IntentService/ListIntents
      x-hcmnext-write-model: none
    post:
      operationId: createIntent
      tags:
        - Intents
      summary: Create an intent
      description: Creates one typed intent in draft. The initiator, tenant, organization scope and purpose are taken from the authenticated token and never from the body. Set submit to true to create and submit in one call. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DPoP"
      requestBody:
        required: true
        description: Request body.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentCreateRequest"
      responses:
        "201":
          description: The intent was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.write
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.intents.v1.IntentService/CreateIntent
      x-hcmnext-write-model: none
  /v1/intents:batch:
    post:
      operationId: batchCreateIntents
      tags:
        - Intents
      summary: Create intents in a batch
      description: Creates and optionally submits up to the declared maximum number of intents. Each item is processed independently and has its own result; the batch is not atomic. Each item carries its own idempotency key in addition to the batch key.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DPoP"
      requestBody:
        required: true
        description: Request body.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentBatchRequest"
      responses:
        "200":
          description: Per-item results in request order.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.write
      x-hcmnext-todo: INTAPI-011
      x-hcmnext-status: PLANNED
      x-hcmnext-write-model: a
  /v1/intents/{intent_id}:
    get:
      operationId: getIntent
      tags:
        - Intents
      summary: Get an intent
      description: Returns the current lifecycle projection of one intent across its request, execution, business, consistency and obligation dimensions. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - name: intent_id
          in: path
          required: true
          description: Opaque canonical intent identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: The intent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.read
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.intents.v1.IntentService/GetIntent
      x-hcmnext-write-model: none
  /v1/intents/{intent_id}:submit:
    post:
      operationId: submitIntent
      tags:
        - Intents
      summary: Submit an intent
      description: Binds and submits the exact proposal revision named in the body. The call fails with 412 when the intent has moved past the expected instance version. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DPoP"
        - $ref: "#/components/parameters/If-Match"
        - name: intent_id
          in: path
          required: true
          description: Opaque canonical intent identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        description: Request body.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentSubmitRequest"
      responses:
        "200":
          description: The updated intent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.write
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.intents.v1.IntentService/SubmitIntent
      x-hcmnext-write-model: none
  /v1/intents/{intent_id}:cancel:
    post:
      operationId: cancelIntent
      tags:
        - Intents
      summary: Cancel an intent
      description: Requests governed cancellation at the boundary the definition declares. This is how a pending create, change or end of a governed fact is rescinded. Effects that already committed are not reversed; the response reports the resulting lifecycle. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DPoP"
        - $ref: "#/components/parameters/If-Match"
        - name: intent_id
          in: path
          required: true
          description: Opaque canonical intent identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        description: Request body.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentCancelRequest"
      responses:
        "200":
          description: The updated intent.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.write
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.intents.v1.IntentService/CancelIntent
      x-hcmnext-write-model: none
  /v1/intents/{intent_id}:supersede:
    post:
      operationId: supersedeIntent
      tags:
        - Intents
      summary: Supersede an intent
      description: Creates a successor intent linked to the superseded one instead of editing history. Use it to correct a submitted or executed change. The equivalent RPC is served today at its Connect path; the resource-style alias shown here is delivered by INTAPI-007.
      parameters:
        - $ref: "#/components/parameters/X-Request-Id"
        - $ref: "#/components/parameters/Idempotency-Key"
        - $ref: "#/components/parameters/DPoP"
        - $ref: "#/components/parameters/If-Match"
        - name: intent_id
          in: path
          required: true
          description: Opaque canonical intent identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        description: Request body.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntentSupersedeRequest"
      responses:
        "201":
          description: The successor intent was created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            Deprecation:
              $ref: "#/components/headers/Deprecation"
            Sunset:
              $ref: "#/components/headers/Sunset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Default"
      security:
        - oauth2:
            - intents.write
      x-hcmnext-todo: INTAPI-007
      x-hcmnext-status: SERVED
      x-hcmnext-rpc: hcmnext.intents.v1.IntentService/SupersedeIntent
      x-hcmnext-write-model: none
  /v1/intents/{intent_id}:simulate:
    post:
      operationId: simulateIntent
      tags:
