components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: "OAuth 2.0 client credentials. Clients authenticate to the token endpoint with a private_key_jwt client assertion (RFC 7523) or a bound mutual TLS certificate (RFC 8705). Tokens live at most fifteen minutes and are signed by keys published at /.well-known/jwks.json. Effective authority is the intersection of the client's granted scopes, the capability's scope and the field policy. Write-capable clients must present a sender-constrained token: a DPoP proof (RFC 9449) in the DPoP header matching the token's cnf claim, or the mutual TLS certificate the token is bound to. Token identifiers are accepted once, and revoked clients, keys and sessions fail closed."
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            people.read: Read workers, persons, employments and assignments.
            people.intents.write: Create hire, assignment change and termination intents.
            org.read: Read organization units and positions.
            org.intents.write: Create organization change intents.
            compensation.read: Read compensation packages.
            compensation.intents.write: Create compensation change intents.
            leave.read: Read leave requests.
            leave.intents.write: Create and cancel leave request intents.
            access.read: Read access grants.
            access.intents.write: Create access grant and revocation intents.
            intents.read: Read intents, definitions, capabilities and operations.
            intents.write: Create and act on intents and operations.
            workflows.read: Read workflow instances.
            workflows.control: Pause, resume, cancel and retry workflow instances.
            work.read: Read work items.
            work.act: Claim, release, complete and decide work items.
            config.read: Read configuration resources.
            config.write: Create, update and retire configuration resources.
            custom.read: Read custom records.
            custom.write: Create, update and retire custom records.
            secrets.write: Create, rotate and retire secrets.
            clients.manage: Manage machine clients and their keys.
            webhooks.manage: Manage webhook subscriptions.
            events.read: Read the event feed.
            imports.write: Start and inspect imports.
            exports.read: Start exports and download results.
            evidence.read: Read receipts and export evidence.
            integrations.read: Read external observations and links.
            integrations.write: Create and end external links.
            records.read: Read append-only records.
            records.write: Create, correct and void append-only records.
            reports.run: Run reports.
    mutualTLS:
      type: mutualTLS
      description: Mutual TLS client certificate bound to a registered client. Used to authenticate to the token endpoint and to bind tokens to the certificate.
  parameters:
    X-Request-Id:
      name: X-Request-Id
      in: header
      required: false
      description: Caller-supplied request identifier echoed in the response and recorded as correlation. The server generates one when absent.
      schema:
        type: string
        maxLength: 128
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: true
      description: "Unique key for this write, at most 128 characters. It maps to the canonical request id. A replay with the same key and body returns the original result with Idempotent-Replayed: true; the same key with a different body returns 409. Keys are kept for a capability-specific period."
      schema:
        type: string
        minLength: 1
        maxLength: 128
    If-Match:
      name: If-Match
      in: header
      required: false
      description: Optional expected revision of the target, as returned in ETag. When present and stale the call fails with 412.
      schema:
        type: string
    If-Match-Required:
      name: If-Match
      in: header
      required: true
      description: Required expected revision of the target, as returned in ETag. A stale value fails with 412; a missing header fails with 428.
      schema:
        type: string
    DPoP:
      name: DPoP
      in: header
      required: false
      description: DPoP proof JWT (RFC 9449) bound to this request. Required for clients registered as write-capable with token_binding DPOP; such clients' tokens are refused on writes without a matching proof.
      schema:
        type: string
    as_of:
      name: as_of
      in: query
      required: false
      description: Business-effective point to read as of. A date reads the value effective on that date in the subject's governing time zone; a date-time reads the value effective at that instant. Defaults to now.
      schema:
        type: string
        anyOf:
          - format: date
          - format: date-time
    fields:
      name: fields
      in: query
      required: false
      description: Comma-separated field mask of response fields. A mask only narrows the response; it never grants access or reveals whether a withheld field has a value.
      schema:
        type: string
      example: worker_id,display_name,status
    page_size:
      name: page_size
      in: query
      required: false
      description: Maximum items per page. The server may return fewer.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's next_cursor. It is bound to the caller, tenant, filters and snapshot and expires.
      schema:
        type: string
  headers:
    X-Request-Id:
      description: Request identifier for support and correlation.
      schema:
        type: string
    ETag:
      description: Current revision of the returned resource as a strong entity tag.
      schema:
        type: string
    Location:
      description: URI of the created or accepted resource.
      schema:
        type: string
        format: uri-reference
    Deprecation:
      description: Present on deprecated operations (RFC 9745), giving the deprecation date.
      schema:
        type: string
    Sunset:
      description: Present on deprecated operations (RFC 8594), giving the date after which the operation may be removed. Removal follows a published notice period.
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    RateLimit:
      description: Remaining quota for the client in the current window, in the IETF RateLimit header format.
      schema:
        type: string
    RateLimit-Policy:
      description: Quota policy applied to the client, in the IETF RateLimit-Policy header format.
      schema:
        type: string
    WWW-Authenticate:
      description: Authentication challenge (Bearer or DPoP).
      schema:
        type: string
    Cache-Control-No-Store:
      description: Always no-store for token responses.
      schema:
        type: string
        const: no-store
    Cache-Control-Public:
      description: Cache lifetime for the key set.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed or structurally invalid (INVALID_ARGUMENT).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Authentication is missing, invalid, expired, revoked or replayed (UNAUTHENTICATED).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The caller is authenticated but lacks the scope, role, delegation or step-up needed, and disclosure of the resource is permitted (PERMISSION_DENIED).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or is hidden from the caller (NOT_FOUND).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The Idempotency-Key was reused with a different request, a request with the same key is still in flight, or the resource's current state conflicts with the action (ALREADY_EXISTS or ABORTED).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: The If-Match or expected revision is stale, or a business precondition is unmet (FAILED_PRECONDITION). current_revision is included when the caller may read it.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: The operation requires an If-Match header and none was sent (FAILED_PRECONDITION).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: The request is well-formed but fails domain validation, for example an effective date before the hire date; field_violations name the fields (INVALID_ARGUMENT with a domain reason_ref). It maps to the canonical ErrorDetail code INVALID_ARGUMENT with a domain-validation reason_ref, distinguishing it from structural 400 rejections.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The client's quota or the admission budget is exhausted (RESOURCE_EXHAUSTED).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Default:
      description: Any other error, including 503 UNAVAILABLE before a committed result is known and 504 DEADLINE_EXCEEDED.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
