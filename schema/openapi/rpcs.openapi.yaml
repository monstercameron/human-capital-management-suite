    post:
      tags:
        - JourneyService
      summary: ProposePromotion is the intent-only `promotion.propose` request contract (PROMO-007).
      description: |-
        ProposePromotion is the intent-only `promotion.propose` request contract (PROMO-007). It is the same governed act ProposeJourney performs - CapabilityGateway -> the application Promotion service -> IntentService -> preflight - stated as a closed contract rather than as a page form, so that a browser, a CLI, an agent and a partner connector all invoke one semantic capability and none of them can say anything the server owns.

        The difference from ProposeJourney is the request message, and it is the whole point. ProposePromotionRequest carries exactly the caller's intention: who the subject is, what is desired for them, when it takes effect, why, which subject revision the intention was formed against and which client request this is. It carries no current salary, no current manager, no position vacancy, no budget envelope and no authority assertion, because those are facts this cell resolves server-side through the governed reads; and it carries no principal, tenant, session, locale or legal-context selector, because those are derived from the verified credential by the trusted-request boundary and are not a caller's to choose. There is nowhere in this message to put such a fact, and a caller that appends one as an unknown or extension field is refused INVALID_ARGUMENT rather than having it ignored - a silently dropped assertion is indistinguishable, to the caller, from an accepted one. That refusal is the shared trusted-request boundary's own strict decoding (internal/transport.Validate, rule strict_decoding.unknown_field), so it is identical on both transports because it is the same code on both; the application service refuses the same bytes again for a caller that reaches it in-process.

        Effect class: governed write through the intent service, exactly as ProposeJourney's. Propose and its preflight simulation mutate no domain state: what they record is chronology (the intent) and what they compute is a proposal.
      operationId: JourneyService_ProposePromotion
      parameters:
        - $ref: '#/components/parameters/ConnectProtocolVersion'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
