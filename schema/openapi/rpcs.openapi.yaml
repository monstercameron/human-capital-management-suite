  /hcmnext.journey.v1.JourneyService/WatchJourney:
    post:
      tags:
        - JourneyService
      summary: WatchJourney is a server-streaming change feed over the same read InspectJourney performs.
      description: |-
        gRPC / gRPC-Web only; not callable as Connect unary JSON.

        WatchJourney is a server-streaming change feed over the same read InspectJourney performs. Effect class: READ_ONLY.

        The semantics are exactly these. The server emits the journey's current detail once immediately, unless since_digest equals the digest that current detail already carries, in which case the client is holding it and the initial emission is skipped. After that it emits one message per change: it re-reads the engine on a fixed short interval and sends only when JourneyDetail.detail_digest differs from the digest it last sent. An unchanged journey therefore produces no traffic at all - there is no heartbeat message and no "nothing changed" message to filter out.

        The stream ends in one of three ways. The client cancels, which is the ordinary case and is not an error. The server's fifteen-minute stream ceiling elapses, which ends the stream with OK - a client that still wants to watch simply opens another stream, carrying the digest it now holds as since_digest so it is not re-sent what it already has. Or the engine refuses the read, which ends the stream with that refusal projected through the owned error model exactly as InspectJourney's would be. The request's own gRPC deadline and the server's deadline cap still apply and still win whenever they are shorter than the ceiling.
      operationId: JourneyService_WatchJourney
      parameters:
        - $ref: '#/components/parameters/ConnectProtocolVersion'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hcmnext.journey.v1.WatchJourneyRequest'
      responses:
        "200":
          description: Each message of the response stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hcmnext.journey.v1.WatchJourneyResponse'
        default:
          description: Connect error. The HTTP status follows the edge's canonical error projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.Error'
      x-hcmnext-service: hcmnext.journey.v1.JourneyService
      x-hcmnext-rpc-kind: STREAM
      x-hcmnext-registered: true
      x-hcmnext-http-exposed: false
      x-hcmnext-streaming: server
  /hcmnext.journey.v1.JourneyService/WatchPromotionInvalidations:
    post:
      tags:
        - JourneyService
      summary: WatchPromotionInvalidations is a server-streaming feed of promotion invalidation hints for the caller's own authorized...
      description: |-
        gRPC / gRPC-Web only; not callable as Connect unary JSON.

        WatchPromotionInvalidations is a server-streaming feed of promotion invalidation hints for the caller's own authorized view (REV-091-03, PROMOUX-011). Effect class: READ_ONLY.

        Every committed promotion transition (propose, edit, execute, decide, acknowledge, withdraw or cancel, and a timer- or signal-driven completion) is filtered by the caller's own authority before anything is sent: the journey must be visible to the caller through the same engine read InspectJourney performs, and the hint must pass the product query invalidation authorization check. A transition the caller may not see is never sent and never consumes a sequence number, so the numbers a caller receives are contiguous and reveal nothing about what was filtered out. A hint carries no display data: the client re-reads the affected summaries through the ordinary authorized RPCs.

        The stream is refused PERMISSION_DENIED for a caller who may view neither Journeys nor My Work, ends with PERMISSION_DENIED if that access is withdrawn while it is open, ends with ABORTED when the caller stops reading for long enough that hints were dropped (the client reconnects and re-reads), and ends with OK at the same fifteen-minute ceiling WatchJourney uses.
      operationId: JourneyService_WatchPromotionInvalidations
      parameters:
        - $ref: '#/components/parameters/ConnectProtocolVersion'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hcmnext.journey.v1.WatchPromotionInvalidationsRequest'
      responses:
        "200":
          description: Each message of the response stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hcmnext.journey.v1.WatchPromotionInvalidationsResponse'
        default:
          description: Connect error. The HTTP status follows the edge's canonical error projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.Error'
      x-hcmnext-service: hcmnext.journey.v1.JourneyService
      x-hcmnext-rpc-kind: STREAM
      x-hcmnext-registered: true
      x-hcmnext-http-exposed: false
      x-hcmnext-streaming: server
