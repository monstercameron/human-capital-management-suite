openapi: 3.1.0
info:
  title: HCM Next RPC API
  version: 0.1.0
  description: |-
    Generated from the compiled Protobuf descriptors of schema/proto; the Protobuf sources are canonical. Do not edit this file: regenerate it with `go run ./tools/gen/openapi/cmd/openapigen`.

    Every RPC is listed as a POST to its Connect procedure path with a JSON body under the Protobuf JSON mapping. The edge rejects unknown request fields.

    x-hcmnext-registered says whether the service is registered on the cell's gRPC server. x-hcmnext-http-exposed says whether the procedure is mounted on the cell's Connect HTTP edge; procedures that are not are reachable over gRPC only, or not at all. x-hcmnext-streaming marks streaming RPCs, which are gRPC / gRPC-Web only.

    Authentication is a bearer token. Client-credentials OAuth2 for machine clients is planned under INTAPI-001.
servers:
  - url: /
    description: The cell's Connect edge, relative to the serving origin.
security:
  - bearer: []
tags:
  - name: AdminService
    description: |-
      AdminService is the SVC-011/ADMIN-001 governed operator surface: a distinct, operator-scoped gRPC service exposing read, simulate and already-approved-operation capabilities only.

      Every method here is READ_ONLY or PURE in the internal/capability.EffectClass sense (planning/specs/hris-admin-dataops.md "The toolkit follows three rules"). There is no Create/Submit/Cancel/Supersede/Update/Delete method in this service, in P1A or as a conformance placeholder: an operator that needs to change workforce data uses the same governed BusinessIntent lifecycle every other caller uses (hcmnext.intents.v1.IntentService), under the same authorization decisions - this service only ever reads, simulates or explains.

      AdminService is hosted by the same process as the ordinary hcmnext.intents.v1.IntentService (internal/operations/admin.Register adds it to the shared *grpc.Server the modular application already builds via internal/transport/grpcserver.NewServer) and reuses that server's whole trusted-request boundary unchanged: the same transport.Admit admission steps, the same envelope.Error projection, the same evidence-ID derivation. What is distinct is the additional per-method authorization predicate every handler runs after admission: the caller's authenticated trust.Principal must carry the reserved operator role (internal/operations/admin.OperatorRole), which an ordinary user or service credential is never issued. A caller admitted by the shared interceptor chain but lacking that role is refused PERMISSION_DENIED before any capability runs (planning/specs/hris-admin-dataops.md, planning/specs/go-only-technology-constitution.md).
    x-hcmnext-service: hcmnext.admin.v1.AdminService
    x-hcmnext-registered: true
  - name: OnboardingService
    description: 'OnboardingService is REV-036-01''s generated operator surface for the onboarding pipeline (internal/connectivity/onboarding). Unlike AdminService, which is READ_ONLY/PURE by charter, these methods advance a tenant-scoped onboarding run: they require the operator role and every transition is recorded on the run the application registry owns.'
    x-hcmnext-service: hcmnext.admin.v1.OnboardingService
    x-hcmnext-registered: false
  - name: DataOpsService
    description: |-
      DataOpsService is the P1A HRIS DataOps operator surface: cross-system diff, the effective-date debugger, and the repair recommendation/simulation pair (planning/specs/hris-admin-dataops.md "The P1A Slice and Its Product Test"; planning/next-steps.md "P1A").

      Total P1A disposition: every method below is IMPLEMENT. None of them writes a domain, employment, assignment, organization, position, compensation or budget fact, reserves anything, creates a WorkItem or timer, or causes a committed external effect (planning/next-steps.md "P1A" zero-effect ceiling); CreateRepairPlan produces a non-executable recommendation only and SimulateRepair performs a pure in-memory projection.
    x-hcmnext-service: hcmnext.dataops.v1.DataOpsService
    x-hcmnext-registered: false
  - name: EvidenceService
    description: |-
      EvidenceService is the immutable-receipt and transaction-explanation surface named in planning/specs/http-grpc-endpoint-contract.md#evidence-and-long-running-operations.

      Total P1A disposition: every method is IMPLEMENT. GetExecutionReceipt and ExplainTransaction are pure reads; ExportIntentEvidence starts a governed resumable export that writes only the export artifact and its own Operation record, never a domain, employment, assignment, organization, position, compensation or budget fact.
    x-hcmnext-service: hcmnext.evidence.v1.EvidenceService
    x-hcmnext-registered: false
  - name: OperationsService
    description: |-
      OperationsService is the generic long-running-operation surface named in planning/specs/http-grpc-endpoint-contract.md#evidence-and-long-running-operations.

      Total P1A disposition: both methods are IMPLEMENT. GetOperation is a pure read; CancelOperation requests cancellation under the owning operation's own policy and never forces an inconsistent state.
    x-hcmnext-service: hcmnext.evidence.v1.OperationsService
    x-hcmnext-registered: true
  - name: WorkService
    description: |-
      WorkService is the human work queue/task and approval surface named in planning/specs/http-grpc-endpoint-contract.md#human-work-and-approvals.

      Total P1A disposition: the six WorkItem/approval methods are P1B (planning/specs/human-work-forms-and-rules.md "Phase Classification" — "Approval WorkItem: create, claim, complete: OUT" for P1A); a P1A server must refuse each with ERROR_CODE_FAILED_PRECONDITION and create/claim/complete/decide nothing. GetThresholdTable is the one read P1A implements ("Threshold decision table from tenant config: IMPLEMENT (read-only)").
    x-hcmnext-service: hcmnext.humanwork.v1.WorkService
    x-hcmnext-registered: true
  - name: IntegrationService
    description: |-
      IntegrationService is the P1A Integration Platform read and diagnostic surface: connector/connection discovery, the connector test bench, and persisted external observations (planning/specs/integration-platform.md; planning/specs/hris-admin-dataops.md "Connector Operations: Test Bench and Redrive").

      Total P1A disposition: every method is IMPLEMENT and every one is read-only or non-mutating. There is no write, subscribe, reconcile or redrive method on this service in any phase shown here: WRITE/SUBSCRIBE/RECONCILE connector verbs and failed-operation redrive are P1B (planning/specs/hris-admin-dataops.md "Phasing" — "Connector test bench: IMPLEMENT read-only, first connector [P1A]; add redrive [P1B]") and are not named by any spec as public endpoints yet, so no such method is declared.
    x-hcmnext-service: hcmnext.integration.v1.IntegrationService
    x-hcmnext-registered: false
  - name: IntentService
    description: 'IntentService is the BusinessIntent lifecycle surface: create, read, simulate, submit, cancel, supersede, explain and inspect the timeline of one BusinessIntent instance, across all three kernel families. See planning/specs/http-grpc-endpoint-contract.md#initial-endpoint-inventory.'
    x-hcmnext-service: hcmnext.intents.v1.IntentService
    x-hcmnext-registered: true
  - name: JourneyService
    description: |-
      JourneyService is the wire form of the Promotion journey engine port (internal/humanwork/workspace.JourneyEngine): one governed promotion followed from the manager's proposal, through the P1B execution authority gate, to the routed approver's decision and the one ledger fact the workflow's END node records. It exists so the browser-resident GoWebComponents/WASM journey page can read and act through exactly the engine operations the workspace surface uses, over the gRPC-over-WebSocket tunnel, with no HTTP/JSON business surface in between: Protobuf/gRPC is the canonical contract for this page as it is for every other.

      Every message here mirrors a workspace port type field for field. This service invents no HCM meaning of its own: the stage is derived by the engine from durable state (the intent record, the workflow instance, its work items and the ledger), never asserted by the page, and every write is one of the engine's own governed operations rather than a table update.

      JourneyService is hosted by the same process as hcmnext.intents.v1.IntentService and hcmnext.admin.v1.AdminService (internal/transport/journey.Register adds it to the shared *grpc.Server the modular application already builds via internal/transport/grpcserver.NewServer) and reuses that server's whole trusted-request boundary unchanged: the same transport.Admit admission steps, the same deadline cap, the same envelope.Error projection. Unlike AdminService there is no additional per-method role predicate: the journey page is an ordinary authenticated surface, and every authorization decision is made by the engine behind the port, which refuses under the same policy the RPC surfaces would (workspace.ErrDenied projects to PERMISSION_DENIED).

      Fourteen methods are unary and WatchJourney is server-streaming. The stream is admitted exactly as the unary methods are: the shared trusted-request boundary is installed by grpcserver.NewServer as both grpc.ChainUnaryInterceptor(grpcserver.UnaryInterceptor) and grpc.ChainStreamInterceptor(grpcserver.StreamInterceptor), and the two interceptors run the same transport.Admit, the same deadline cap and the same envelope.Error projection over the same code. A streaming handler therefore sees an admitted trust.Principal and transport.Invocation in its context exactly as a unary one does.
    x-hcmnext-service: hcmnext.journey.v1.JourneyService
    x-hcmnext-registered: true
  - name: RegistryService
    description: RegistryService is the authorized, tenant/phase-filtered discovery surface for immutable IntentDefinition and CapabilityDefinition descriptors. See planning/specs/http-grpc-endpoint-contract.md#initial-endpoint-inventory.
    x-hcmnext-service: hcmnext.registry.v1.RegistryService
    x-hcmnext-registered: true
  - name: WorkflowService
    description: |-
      WorkflowService is the workflow instance/inspection and operational intervention surface named in planning/specs/http-grpc-endpoint-contract.md#workflow-operations.

      The inspector methods are read-only. The four operational-intervention methods are governed controls (EP-WF-002): each resolves a registered operational intent under current JIT authority, dual control or simulation where its kind demands, and an idempotency key, then applies the runtime's own transition fenced by the expected version or attempt. A server without governed control wiring refuses them with ERROR_CODE_FAILED_PRECONDITION and performs no transition. Governance refusals return a receipt whose outcome is DENIED, TOO_LATE or REPAIR_REQUIRED rather than an error.
    x-hcmnext-service: hcmnext.workflow.v1.WorkflowService
    x-hcmnext-registered: true
