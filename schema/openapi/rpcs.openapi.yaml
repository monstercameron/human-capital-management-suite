components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Bearer token in the Authorization header, verified by the cell's trust verifier. Client-credentials OAuth2 for machine clients is planned under INTAPI-001.
  parameters:
    ConnectProtocolVersion:
      name: Connect-Protocol-Version
      in: header
      required: false
      description: Connect protocol version. Connect clients send 1; the edge does not require it.
      schema:
        type: string
        enum:
          - "1"
    RequestID:
      name: X-Request-Id
      in: header
      required: false
      description: Caller-supplied request identifier. It correlates log and error records; it grants no authority.
      schema:
        type: string
  schemas:
    connect.Error:
      type: object
      description: Connect protocol error body.
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.ErrorDetail'
    connect.ErrorDetail:
      type: object
      description: Connect error detail. The edge attaches one hcmnext.common.v1.ErrorDetail.
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Fully qualified Protobuf message name of the detail.
        value:
          type: string
          format: byte
          description: Base64 of the binary-encoded detail message.
        debug:
          $ref: '#/components/schemas/hcmnext.common.v1.ErrorDetail'
          description: Optional JSON rendering of the detail, for debugging only.
    hcmnext.admin.v1.AbortOnboardingRunRequest:
      type: object
      description: Protobuf message `hcmnext.admin.v1.AbortOnboardingRunRequest`.
      properties:
        tenantId:
          type: string
        runId:
          type: string
        reason:
          type: string
    hcmnext.admin.v1.AbortOnboardingRunResponse:
      type: object
      description: Protobuf message `hcmnext.admin.v1.AbortOnboardingRunResponse`.
      properties:
        state:
          type: string
    hcmnext.admin.v1.CapabilityProfile:
      type: object
      description: Protobuf message `hcmnext.admin.v1.CapabilityProfile`.
      properties:
        capabilityId:
          type: string
        version:
          type: integer
          format: uint32
          minimum: 0
        ownerDomain:
          type: string
        effectClass:
          type: string
        riskClass:
          type: string
        status:
          type: string
        agentEligible:
          type: boolean
        digest:
          type: string
    hcmnext.admin.v1.ChainHeadProfile:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ChainHeadProfile`.
      properties:
        streamKey:
          type: string
        sequence:
          type: string
          format: int64
        chainHash:
          type: string
        algorithm:
          type: string
    hcmnext.admin.v1.ConfigBundle:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigBundle`.
      properties:
        bundleId:
          type: string
        manifestVersion:
          type: integer
          format: uint32
          minimum: 0
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/hcmnext.admin.v1.ConfigDependency'
        compatibilityRange:
          type: string
        signer:
          type: string
        provenance:
          type: string
        credentialRefs:
          type: array
          items:
            type: string
        targetScope:
          type: string
        minimumRuntimeVersion:
          type: string
    hcmnext.admin.v1.ConfigDependency:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigDependency`.
      properties:
        kind:
          type: string
        name:
          type: string
        version:
          type: string
        digest:
          type: string
    hcmnext.admin.v1.ConfigDiffChange:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigDiffChange`.
      properties:
        key:
          type: string
        kind:
          type: string
        compatibility:
          type: string
        beforeValue:
          type: string
        afterValue:
          type: string
        secretFingerprintChanged:
          type: boolean
        impactedCapabilities:
          type: array
          items:
            type: string
        impactedWorkflows:
          type: array
          items:
            type: string
        impactedTenants:
          type: array
          items:
            type: string
    hcmnext.admin.v1.ConfigDiffRequest:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigDiffRequest`.
      properties:
        before:
          $ref: '#/components/schemas/hcmnext.admin.v1.ConfigSnapshot'
        after:
          $ref: '#/components/schemas/hcmnext.admin.v1.ConfigSnapshot'
    hcmnext.admin.v1.ConfigDiffResponse:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigDiffResponse`.
      properties:
        added:
          type: array
          items:
            $ref: '#/components/schemas/hcmnext.admin.v1.ConfigDiffChange'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/hcmnext.admin.v1.ConfigDiffChange'
        changed:
          type: array
          items:
            $ref: '#/components/schemas/hcmnext.admin.v1.ConfigDiffChange'
        digest:
          type: string
        evidenceRef:
          $ref: '#/components/schemas/hcmnext.common.v1.EvidenceRef'
    hcmnext.admin.v1.ConfigInspectRequest:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigInspectRequest`.
      properties:
        id:
          type: string
        environment:
          type: string
    hcmnext.admin.v1.ConfigInspectResponse:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigInspectResponse`.
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/hcmnext.admin.v1.ConfigRecordProfile'
        evidenceRef:
          $ref: '#/components/schemas/hcmnext.common.v1.EvidenceRef'
    hcmnext.admin.v1.ConfigPackage:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigPackage`.
      properties:
        id:
          type: string
        environment:
          type: string
        bundle:
          $ref: '#/components/schemas/hcmnext.admin.v1.ConfigSignedBundle'
        publicKey:
          type: string
          format: byte
    hcmnext.admin.v1.ConfigPromoteRequest:
      type: object
      description: Protobuf message `hcmnext.admin.v1.ConfigPromoteRequest`.
      properties:
        id:
          type: string
        confirm:
          type: boolean
    hcmnext.admin.v1.ConfigPromoteResponse:
