  /hcmnext.admin.v1.AdminService/GetWorkflowInstance:
    post:
      tags:
        - AdminService
      summary: 'GetWorkflowInstance is ADMIN-008''s governed, read-only execution inspector: it composes internal/workflow/runtime''s...'
      description: 'GetWorkflowInstance is ADMIN-008''s governed, read-only execution inspector: it composes internal/workflow/runtime''s stored instance and node-execution rows with internal/humanwork/workitem''s stored work items and their transitions and renders internal/workflow/inspect''s declared traversal (definition -> instance -> node -> governance -> transaction -> connector -> observation -> trace), the instance''s five lifecycle dimensions, its frontier, and its work items with their transitions and evidence ids. It touches no runtime table directly - internal/transport/admin composes the two stores'' read ports and hands their already-loaded rows to inspect.Build/inspect.BuildWorkItems - and performs no write of any kind. Every reference that is a protected artifact, not operational metadata, is a RefValue carrying either the value or the reason it is withheld, and gap_kind additionally distinguishes a reference nothing ever recorded (UNRECORDED) from one correctly recorded as empty (ABSENT) from one this caller may not see (REDACTED), so an empty governance or work-item reference is never silently indistinguishable from an unrecorded one.'
      operationId: AdminService_GetWorkflowInstance
      parameters:
        - $ref: '#/components/parameters/ConnectProtocolVersion'
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hcmnext.admin.v1.GetWorkflowInstanceRequest'
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hcmnext.admin.v1.GetWorkflowInstanceResponse'
        default:
          description: Connect error. The HTTP status follows the edge's canonical error projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.Error'
      x-hcmnext-service: hcmnext.admin.v1.AdminService
      x-hcmnext-rpc-kind: READ
      x-hcmnext-registered: true
      x-hcmnext-http-exposed: false
