      description: 'EditProposal corrects an unstarted or not-yet-approved promotion proposal (PROMOUX-013). Effect class: governed write through the intent service - it is workspace.JourneyEngine.EditProposal, which is [CancelIntent] plus a fresh ProposeJourney, not SupersedeIntent: promote_worker''s own declared lifecycle transitions (definitions.simulateOnlyChangeTransitions) reach SUPERSEDED only from SIMULATED, SUBMITTED or APPROVED, and a journey''s stored intent never durably leaves DRAFT (SimulateIntent persists nothing), so SupersedeIntent is structurally unusable here. EditProposal instead cancels the original first - the same governed disposition CancelIntent already reports, safe-point-aware for a mid-flight journey exactly as RequestJourneyIntervention''s CANCEL kind is - and only once that disposition reports the original genuinely and cleanly stopped (CANCELLED) does it mint the edited successor through the ordinary ProposeJourney path. Any other disposition (CANCELLATION_PENDING, TOO_LATE, REPAIR_REQUIRED) refuses the edit outright rather than minting a successor next to an original that was not actually stopped. Because the original carries any recorded approval and the original is what is durably cancelled, the successor inherits nothing from it, including no approval - which is how an edit invalidates material approvals. A caller presenting a stale expected_instance_version, or naming an already-terminal original, is refused FAILED_PRECONDITION.'
      operationId: JourneyService_EditProposal
      parameters:
