syntax = "proto3";

package hcmnext.journey.v1;

option go_package = "github.com/monstercameron/human-capital-management-suite/gen/go/hcmnext/journey/v1;journeyv1";

import "google/protobuf/timestamp.proto";
import "hcmnext/common/v1/common.proto";

// JourneyService is the wire form of the Promotion journey engine port
// (internal/humanwork/workspace.JourneyEngine): one governed promotion
// followed from the manager's proposal, through the P1B execution authority
// gate, to the routed approver's decision and the one ledger fact the
// workflow's END node records. It exists so the browser-resident
// GoWebComponents/WASM journey page can read and act through exactly the
// engine operations the workspace surface uses, over the gRPC-over-WebSocket
// tunnel, with no HTTP/JSON business surface in between: Protobuf/gRPC is the
// canonical contract for this page as it is for every other.
//
// Every message here mirrors a workspace port type field for field. This
// service invents no HCM meaning of its own: the stage is derived by the
// engine from durable state (the intent record, the workflow instance, its
// work items and the ledger), never asserted by the page, and every write is
// one of the engine's own governed operations rather than a table update.
//
// JourneyService is hosted by the same process as
// hcmnext.intents.v1.IntentService and hcmnext.admin.v1.AdminService
// (internal/transport/journey.Register adds it to the shared *grpc.Server the
// modular application already builds via
// internal/transport/grpcserver.NewServer) and reuses that server's whole
// trusted-request boundary unchanged: the same transport.Admit admission
// steps, the same deadline cap, the same envelope.Error projection. Unlike
// AdminService there is no additional per-method role predicate: the journey
// page is an ordinary authenticated surface, and every authorization decision
// is made by the engine behind the port, which refuses under the same policy
// the RPC surfaces would (workspace.ErrDenied projects to PERMISSION_DENIED).
//
// Fourteen methods are unary and WatchJourney is server-streaming. The stream
// is admitted exactly as the unary methods are: the shared trusted-request
// boundary is installed by grpcserver.NewServer as both
// grpc.ChainUnaryInterceptor(grpcserver.UnaryInterceptor) and
// grpc.ChainStreamInterceptor(grpcserver.StreamInterceptor), and the two
// interceptors run the same transport.Admit, the same deadline cap and the
// same envelope.Error projection over the same code. A streaming handler
// therefore sees an admitted trust.Principal and transport.Invocation in
// its context exactly as a unary one does.
service JourneyService {
  // ListJourneys returns every promotion journey in the caller's tenant,
  // newest first. Effect class: READ_ONLY. It forwards to
  // workspace.JourneyEngine.ListJourneys, which reads the intent records and
  // derives each journey's stage from durable state; nothing is written and
  // no capability runs.
  rpc ListJourneys(ListJourneysRequest) returns (ListJourneysResponse);

  // ProposeJourney creates and simulates a new promotion intent from the
  // manager's input. Effect class: governed write through the intent service
  // - workspace.JourneyEngine.Propose runs the engine's own CreateIntent
  // followed by SimulateIntent, so the proposal is minted as an immutable
  // revision with a material digest exactly as any other intent is. It
  // returns the journey at JOURNEY_STAGE_PROPOSED, or
  // JOURNEY_STAGE_BLOCKED when the simulation produced no executable plan.
  // Nothing about the worker's current placement, pay or budget authority is
  // read from this request: the engine reads those through the governed
  // worker read.
  rpc ProposeJourney(ProposeJourneyRequest) returns (ProposeJourneyResponse);

  // ProposePromotion is the intent-only `promotion.propose` request contract
  // (PROMO-007). It is the same governed act ProposeJourney performs -
  // CapabilityGateway -> the application Promotion service -> IntentService ->
  // preflight - stated as a closed contract rather than as a page form, so
  // that a browser, a CLI, an agent and a partner connector all invoke one
  // semantic capability and none of them can say anything the server owns.
  //
  // The difference from ProposeJourney is the request message, and it is the
  // whole point. ProposePromotionRequest carries exactly the caller's
  // intention: who the subject is, what is desired for them, when it takes
  // effect, why, which subject revision the intention was formed against and
  // which client request this is. It carries no current salary, no current
  // manager, no position vacancy, no budget envelope and no authority
  // assertion, because those are facts this cell resolves server-side through
  // the governed reads; and it carries no principal, tenant, session, locale
  // or legal-context selector, because those are derived from the verified
  // credential by the trusted-request boundary and are not a caller's to
  // choose. There is nowhere in this message to put such a fact, and a caller
  // that appends one as an unknown or extension field is refused
  // INVALID_ARGUMENT rather than having it ignored - a silently dropped
  // assertion is indistinguishable, to the caller, from an accepted one. That
  // refusal is the shared trusted-request boundary's own strict decoding
  // (internal/transport.Validate, rule strict_decoding.unknown_field), so it
  // is identical on both transports because it is the same code on both; the
  // application service refuses the same bytes again for a caller that reaches
  // it in-process.
  //
  // Effect class: governed write through the intent service, exactly as
  // ProposeJourney's. Propose and its preflight simulation mutate no domain
  // state: what they record is chronology (the intent) and what they compute
  // is a proposal.
  rpc ProposePromotion(ProposePromotionRequest) returns (ProposePromotionResponse);

  // InspectJourney returns everything durable about one journey: the
  // summary, the simulation findings and planned writes, the workflow
  // instance and its node executions, the work items and their transitions,
  // the ledger fact, the recorded evidence identifiers and the
  // engine-composed timeline. Effect class: READ_ONLY. It forwards to
  // workspace.JourneyEngine.Inspect and writes nothing.
  rpc InspectJourney(InspectJourneyRequest) returns (InspectJourneyResponse);

  // ExecuteJourney runs the engine's ExecuteIntent for an approved,
  // re-simulated proposal. Effect class: governed write behind the P1B
  // execution authority gate - workspace.JourneyEngine.Execute is refused
  // with UNAVAILABLE when the cell was not composed with that authority
  // (cmd/hcmnext -execution-authority=true), and with FAILED_PRECONDITION
  // when the journey is not at a stage from which execution is available. On
  // success the workflow instance exists and is parked on its approval
  // WorkItem, and the returned detail carries it.
  rpc ExecuteJourney(ExecuteJourneyRequest) returns (ExecuteJourneyResponse);

  // DecideJourney records the routed approver's decision. Effect class:
  // governed write through the WorkItem store and the caller-driven
  // execution driver - workspace.JourneyEngine.Decide claims and completes
  // the approval WorkItem as the routed approver, then resumes the driver,
  // which runs the instance to its APPROVED or REJECTED terminal and, on
  // approval, records the one ledger fact the END node raises. A caller who
  // is not the routed approver is refused PERMISSION_DENIED by the engine,
  // not by this service.
  rpc DecideJourney(DecideJourneyRequest) returns (DecideJourneyResponse);

  // AcknowledgeJourney records the employee's verified promotion
  // acknowledgement against a journey parked on its acknowledgement gate.
  // Effect class: governed write through the durable signal store and the
  // caller-driven execution driver - workspace.JourneyEngine.Acknowledge
  // receives the correlated signal and resumes the driver from the matched
  // receipt, which runs the instance to its COMPLETE terminal and records
  // the one ledger fact the END node raises. The caller is the attester and
  // must not be the journey's initiator; a journey with no open
  // acknowledgement wait is refused FAILED_PRECONDITION.
  rpc AcknowledgeJourney(AcknowledgeJourneyRequest) returns (AcknowledgeJourneyResponse);

  // EditProposal corrects an unstarted or not-yet-approved promotion
  // proposal (PROMOUX-013). Effect class: governed write through the intent
  // service - it is workspace.JourneyEngine.EditProposal, which is
  // [CancelIntent] plus a fresh ProposeJourney, not SupersedeIntent:
  // promote_worker's own declared lifecycle transitions
  // (definitions.simulateOnlyChangeTransitions) reach SUPERSEDED only from
  // SIMULATED, SUBMITTED or APPROVED, and a journey's stored intent never
  // durably leaves DRAFT (SimulateIntent persists nothing), so
  // SupersedeIntent is structurally unusable here. EditProposal instead
  // cancels the original first - the same governed disposition CancelIntent
  // already reports, safe-point-aware for a mid-flight journey exactly as
  // RequestJourneyIntervention's CANCEL kind is - and only once that
  // disposition reports the original genuinely and cleanly stopped
  // (CANCELLED) does it mint the edited successor through the ordinary
  // ProposeJourney path. Any other disposition (CANCELLATION_PENDING,
  // TOO_LATE, REPAIR_REQUIRED) refuses the edit outright rather than minting
  // a successor next to an original that was not actually stopped. Because
  // the original carries any recorded approval and the original is what is
  // durably cancelled, the successor inherits nothing from it, including no
  // approval - which is how an edit invalidates material approvals. A
  // caller presenting a stale expected_instance_version, or naming an
  // already-terminal original, is refused FAILED_PRECONDITION.
  rpc EditProposal(EditProposalRequest) returns (EditProposalResponse);

  // PreviewJourneyIntervention answers, for one journey and one typed
  // intervention kind (WITHDRAW or CANCEL), whether the intervention is
  // available right now, and if not, why - by a stable reason reference
  // computed only from the journey's own durable stage. Effect class:
  // READ_ONLY. It mutates nothing and runs no capability; a caller not
  // authorized to read this journey at all is refused exactly as
  // InspectJourney would refuse them (NOT_FOUND or PERMISSION_DENIED),
  // before this method's own logic ever runs - so the presence or shape of
  // a preview answer never discloses more than InspectJourney already
  // would.
  rpc PreviewJourneyIntervention(PreviewJourneyInterventionRequest) returns (PreviewJourneyInterventionResponse);

  // RequestJourneyIntervention runs a typed WITHDRAW (before any approval)
  // or CANCEL (during an eligible wait) intervention. Effect class:
  // governed write through the intent service - it is
  // workspace.JourneyEngine.RequestIntervention, which is [CancelIntent]
  // scoped to journeys: both kinds are the same governed capability,
  // reporting the same four dispositions CancelIntent already reports
  // (CANCELLED, CANCELLATION_PENDING, TOO_LATE, REPAIR_REQUIRED) projected
  // onto the shared hcmnext.common.v1.InterventionOutcome vocabulary; Kind
  // only selects which stages [PreviewJourneyIntervention] offers the
  // action at. A caller who races this call against a concurrent approval,
  // timer fire or terminal commit is resolved to exactly one durable
  // outcome by the intent record's own optimistic instance-version
  // compare-and-swap - the same single serialization point CancelIntent and
  // SupersedeIntent already use - so no partial domain write is possible: a
  // losing caller's request never touches durable state at all.
  rpc RequestJourneyIntervention(RequestJourneyInterventionRequest) returns (RequestJourneyInterventionResponse);

  // AddJourneyNote appends one note to a journey. Effect class: append-only
  // experience write. Anyone the journey detail admits may add a note, at any
  // stage and after the journey has closed; a note is not a decision, carries
  // no authority and changes nothing about the journey. Notes are never
  // edited or removed. A retry with the same idempotency_key returns the note
  // the first call recorded; the same key with different content is refused.
  // The response carries the recorded note and the journey detail read in
  // the same call, with the new note in JourneyDetail.notes.
  rpc AddJourneyNote(AddJourneyNoteRequest) returns (AddJourneyNoteResponse);

  // WatchJourney is a server-streaming change feed over the same read
  // InspectJourney performs. Effect class: READ_ONLY.
  //
  // The semantics are exactly these. The server emits the journey's current
  // detail once immediately, unless since_digest equals the digest that
  // current detail already carries, in which case the client is holding it
  // and the initial emission is skipped. After that it emits one message per
  // change: it re-reads the engine on a fixed short interval and sends only
  // when JourneyDetail.detail_digest differs from the digest it last sent.
  // An unchanged journey therefore produces no traffic at all - there is no
  // heartbeat message and no "nothing changed" message to filter out.
  //
  // The stream ends in one of three ways. The client cancels, which is the
  // ordinary case and is not an error. The server's fifteen-minute stream
  // ceiling elapses, which ends the stream with OK - a client that still
  // wants to watch simply opens another stream, carrying the digest it now
  // holds as since_digest so it is not re-sent what it already has. Or the
  // engine refuses the read, which ends the stream with that refusal
  // projected through the owned error model exactly as InspectJourney's
  // would be. The request's own gRPC deadline and the server's deadline cap
  // still apply and still win whenever they are shorter than the ceiling.
  rpc WatchJourney(WatchJourneyRequest) returns (stream WatchJourneyResponse);

  // WatchPromotionInvalidations is a server-streaming feed of promotion
  // invalidation hints for the caller's own authorized view (REV-091-03,
  // PROMOUX-011). Effect class: READ_ONLY.
  //
  // Every committed promotion transition (propose, edit, execute, decide,
  // acknowledge, withdraw or cancel, and a timer- or signal-driven
  // completion) is filtered by the caller's own authority before anything
  // is sent: the journey must be visible to the caller through the same
  // engine read InspectJourney performs, and the hint must pass the product
  // query invalidation authorization check. A transition the caller may not
  // see is never sent and never consumes a sequence number, so the numbers a
  // caller receives are contiguous and reveal nothing about what was
  // filtered out. A hint carries no display data: the client re-reads the
  // affected summaries through the ordinary authorized RPCs.
  //
  // The stream is refused PERMISSION_DENIED for a caller who may view
  // neither Journeys nor My Work, ends with PERMISSION_DENIED if that access
  // is withdrawn while it is open, ends with ABORTED when the caller stops
  // reading for long enough that hints were dropped (the client reconnects
  // and re-reads), and ends with OK at the same fifteen-minute ceiling
  // WatchJourney uses.
  rpc WatchPromotionInvalidations(WatchPromotionInvalidationsRequest) returns (stream WatchPromotionInvalidationsResponse);

  // ListWorkers returns every employee a journey can be proposed for --
  // the release's fixed corpus population and the tenant's own created one,
  // newest created first -- together with the closed set of placements a new
  // employee may be given. Effect class: READ_ONLY. It forwards to
  // workspace.JourneyEngine.ListWorkers, which reads the corpus and the
  // durable journey_worker rows; nothing is written and no capability runs.
  //
  // The options travel in the same response as the list because they are what
  // makes the list actionable: a client holding one and not the other can
  // render a picker but not a form.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // CreateWorker records one new employee as a durable, append-only fact.
  // Effect class: governed demo-authority write - workspace.JourneyEngine
  // .CreateWorker is gated by the same P1B execution authority ExecuteJourney
  // and DecideJourney run behind, because creating the subject of a promotion
  // is a workforce change and a surface that could do it without that
  // authority would be a way around the gate rather than a step before it.
  //
  // It is refused UNAVAILABLE when this process was composed without the
  // engine, or when the composed cell has no execution database to record a
  // worker in; PERMISSION_DENIED when the caller does not carry the operator
  // role that authority names; and INVALID_ARGUMENT, naming the field, when a
  // name is missing, the base pay is not a positive decimal, the hire date is
  // not an ISO-8601 date, or the placement lands outside every pay band the
  // simulation knows -- which would otherwise produce a worker whose every
  // promotion is refused later for a reason that has nothing to do with the
  // promotion.
  rpc CreateWorker(CreateWorkerRequest) returns (CreateWorkerResponse);

  // GetProductPreferences returns the authenticated user's presentation
  // defaults together with the authenticated organization's shared
  // appearance. Tenant, organization scope, and principal are derived from
  // the admitted credential, never from fields in this request. Effect class:
  // READ_ONLY.
  rpc GetProductPreferences(GetProductPreferencesRequest) returns (GetProductPreferencesResponse);

  // SaveUserPreferences replaces the authenticated user's presentation
  // defaults under optimistic versioning. It cannot alter another user's
  // record because neither tenant nor principal is accepted on the wire.
  rpc SaveUserPreferences(SaveUserPreferencesRequest) returns (SaveUserPreferencesResponse);

  // SaveTenantAppearance replaces organization-wide branding under optimistic
  // versioning. The organization scope comes from the admitted credential and
  // the server additionally requires the comp_admin role. The RPC name is kept
  // for wire compatibility.
  rpc SaveTenantAppearance(SaveTenantAppearanceRequest) returns (SaveTenantAppearanceResponse);

  // SaveOrganizationVisibility replaces the organization-wide directory
  // visibility boundary under optimistic versioning. The organization scope
  // is derived from the admitted credential and comp_admin is required.
  rpc SaveOrganizationVisibility(SaveOrganizationVisibilityRequest) returns (SaveOrganizationVisibilityResponse);

  // GetRoleAccess returns the tenant role catalog, employee assignments, and
  // one organization-directory policy per role. Only HCM administrators can
  // read or mutate this administrative projection.
  rpc GetRoleAccess(GetRoleAccessRequest) returns (GetRoleAccessResponse);
  rpc SaveAccessRole(SaveAccessRoleRequest) returns (SaveAccessRoleResponse);
  rpc SaveWorkerRoleAssignment(SaveWorkerRoleAssignmentRequest) returns (SaveWorkerRoleAssignmentResponse);
  rpc SaveRoleOrganizationVisibility(SaveRoleOrganizationVisibilityRequest) returns (SaveRoleOrganizationVisibilityResponse);
  rpc SaveRolePagePermission(SaveRolePagePermissionRequest) returns (SaveRolePagePermissionResponse);
  rpc SaveRoleFeaturePermission(SaveRoleFeaturePermissionRequest) returns (SaveRoleFeaturePermissionResponse);

  // PreviewRoleAccess resolves, without saving anything, what a role would
  // reveal under a proposed organization visibility policy compared with
  // its saved policy. It reads the durable role store and the governed
  // workforce's unit names; it returns unit names and counts, never a worker
  // record. Administrator roles report their directory-wide override rather
  // than the stored policy. Only HCM administrators may call it. Effect
  // class: READ_ONLY.
  rpc PreviewRoleAccess(PreviewRoleAccessRequest) returns (PreviewRoleAccessResponse);

  // RecordWorkflowUse increments the authenticated user's usage count for a
  // workflow so launchers can rank real frequent actions rather than hardcode
  // a single action. It grants no authority to run the named workflow.
  rpc RecordWorkflowUse(RecordWorkflowUseRequest) returns (RecordWorkflowUseResponse);

  // GetWorkerIDPolicy returns the authenticated organization's formatting
  // and allocation state. It requires the compensation administrator role.
  rpc GetWorkerIDPolicy(GetWorkerIDPolicyRequest) returns (GetWorkerIDPolicyResponse);

  // SaveWorkerIDPolicy replaces configurable formatting rules under
  // optimistic versioning. Allocation state can never be moved backwards.
  rpc SaveWorkerIDPolicy(SaveWorkerIDPolicyRequest) returns (SaveWorkerIDPolicyResponse);
}

// JourneyStage is where one promotion journey currently stands
// (workspace.JourneyStage). It is derived by the engine from durable state,
// never asserted by the page.
enum JourneyStage {
  // JOURNEY_STAGE_UNSPECIFIED is the proto3 zero value. The engine never
  // reports it; a journey carrying it means the server saw a stage token it
  // does not know, which is a schema drift to investigate, not a stage.
  JOURNEY_STAGE_UNSPECIFIED = 0;
  // JOURNEY_STAGE_PROPOSED: the intent exists and has been simulated; no
  // execution has been requested.
  JOURNEY_STAGE_PROPOSED = 1;
  // JOURNEY_STAGE_BLOCKED: the simulation produced no executable plan, so
  // ExecuteJourney would be refused with p1b.no_executable_plan.
  JOURNEY_STAGE_BLOCKED = 2;
  // JOURNEY_STAGE_AWAITING_APPROVAL: a workflow instance exists and is
  // parked on its approval WorkItem.
  JOURNEY_STAGE_AWAITING_APPROVAL = 3;
  // JOURNEY_STAGE_COMPLETED: the instance reached its APPROVED terminal and
  // the promotion outcome is a recorded ledger fact.
  JOURNEY_STAGE_COMPLETED = 4;
  // JOURNEY_STAGE_REJECTED: the approver rejected; the instance reached its
  // REJECTED terminal.
  JOURNEY_STAGE_REJECTED = 5;
  // JOURNEY_STAGE_FAILED: the instance ended in some other terminal
  // (cancelled, superseded, failed).
  JOURNEY_STAGE_FAILED = 6;
  // JOURNEY_STAGE_FINANCE_APPROVAL: the workflow is parked on finance's
  // approval decision.
  JOURNEY_STAGE_FINANCE_APPROVAL = 7;
  // JOURNEY_STAGE_MANAGER_APPROVAL: the workflow is parked on the manager's
  // approval decision.
  JOURNEY_STAGE_MANAGER_APPROVAL = 8;
  // JOURNEY_STAGE_WAITING_EFFECTIVE_DATE: approvals are complete and the
  // workflow is waiting for the effective date safe point.
  JOURNEY_STAGE_WAITING_EFFECTIVE_DATE = 9;
  // JOURNEY_STAGE_REVALIDATION: the workflow is rechecking its pinned facts
  // before continuing.
  JOURNEY_STAGE_REVALIDATION = 10;
  // JOURNEY_STAGE_REAPPROVAL: a material change requires an approval
  // decision again.
  JOURNEY_STAGE_REAPPROVAL = 11;
  // JOURNEY_STAGE_EXECUTED: the governed execution has completed its
  // business operation and observation has not yet closed.
  JOURNEY_STAGE_EXECUTED = 12;
  // JOURNEY_STAGE_OBSERVING_EFFECTS: the workflow is checking the effects of
  // its execution.
  JOURNEY_STAGE_OBSERVING_EFFECTS = 13;
  // JOURNEY_STAGE_RECORDED: the terminal promotion fact has been recorded.
  JOURNEY_STAGE_RECORDED = 14;
  // JOURNEY_STAGE_REPAIR_REQUIRED: the workflow requires governed repair
  // before it can reach a consistent terminal state.
  JOURNEY_STAGE_REPAIR_REQUIRED = 15;
  // JOURNEY_STAGE_AWAITING_ACKNOWLEDGEMENT: downstream effects reconciled
  // and the workflow is parked on the employee acknowledgement gate before
  // the promotion may complete.
  JOURNEY_STAGE_AWAITING_ACKNOWLEDGEMENT = 16;
}

// Placement is one side (current or target) of the placement change
// (workspace.JourneyPlacement).
message Placement {
  string job_code = 1;
  string grade = 2;
  string position_id = 3;
  string org_unit = 4;
  string pay_zone = 5;
}

// Journey is one promotion journey as the list and the detail header show it
// (workspace.JourneySummary).
message Journey {
  string intent_id = 1;
  string correlation_id = 2;
  // worker_ref is the canonical text encoding of the worker's tenant-scoped
  // entity reference (internal/kernel/values.EntityRef.String), so a client
  // that echoes it back is naming exactly the entity the engine named.
  string worker_ref = 3;
  string worker_name = 4;
  Placement current = 5;
  Placement target = 6;
  // current_base and proposed_base are decimal strings in currency, as the
  // domain carries them. They are strings and not
  // hcmnext.common.v1.Decimal because the port itself carries the decimal
  // text the domain minted; re-encoding it here would make this service the
  // author of a money value it only forwards.
  string current_base = 7;
  string proposed_base = 8;
  string currency = 9;
  // effective_date is ISO-8601 (YYYY-MM-DD).
  string effective_date = 10;
  string business_reason = 11;
  JourneyStage stage = 12;
  // proposal_revision_id and material_digest identify the immutable proposal
  // the simulation minted; both are empty until simulated.
  string proposal_revision_id = 13;
  string material_digest = 14;
  // instance_id and instance_version name the workflow instance once
  // executed; empty/zero before.
  string instance_id = 15;
  int64 instance_version = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp updated_at = 18;
  // governance_version is the underlying intent record's own optimistic-
  // concurrency version (hcmnext.intents.v1.IntentInstance.instance_version)
  // -- unrelated to instance_version above, which names the *workflow*
  // instance once executed. It is required as expected_instance_version on
  // EditProposal and RequestJourneyIntervention (PROMOUX-013): those two
  // calls act on the intent record itself, not on the workflow instance.
  uint64 governance_version = 19;
  // current_work_item summarizes the journey's one open human work item as
  // the calling viewer is entitled to see it (UXAUDIT-017). It is unset when
  // the journey has no open work item, or when the internal/humanwork/workitem
  // visibility rules do not admit this viewer to that item at all -- never a
  // partially guessed value.
  JourneyWorkItemSummary current_work_item = 20;
  // viewer is the calling viewer's relationship to this journey and the
  // journey's next transition, resolved by the engine (PROMOUX-012). Every
  // surface -- My Work, tracked requests, Journeys and the person profile --
  // reads responsibility, next step and lifecycle closure from here rather
  // than re-deriving them from stage. It is unset only on a response the
  // engine did not resolve for a viewer.
  JourneyViewerProjection viewer = 21;
}

// JourneyViewerProjection is one journey as it stands for the calling viewer
// (workspace.JourneyViewerProjection). It discloses nothing about any other
// principal: relationships name only how the viewer themself stands, so a
// viewer with no relationship receives the same projection whoever
// initiated the journey or holds its work item.
message JourneyViewerProjection {
  // relationships is how the viewer stands to the journey, sorted and
  // unique. Empty means the viewer has no relationship beyond visibility.
  repeated JourneyViewerRelationship relationships = 1;
  // responsibility is what the journey asks of the viewer right now.
  JourneyViewerResponsibility responsibility = 2;
  // next_step is the journey's single next transition, unset when the
  // journey is closed or its stage is unknown.
  JourneyNextStep next_step = 3;
  // next_step_owner is the role class that holds next_step.
  JourneyStepOwner next_step_owner = 4;
  // awaits_person is true when a person rather than the workflow or the
  // calendar holds next_step. A journey whose next step no person holds is
  // a passive wait.
  bool awaits_person = 5;
  // closed is true when the journey reached a terminal stage (COMPLETED,
  // REJECTED, FAILED or RECORDED) and will not move again.
  bool closed = 6;
}

// JourneyViewerRelationship is one way the calling viewer stands to a
// journey. There is no follower relationship: nothing records followers.
enum JourneyViewerRelationship {
  // JOURNEY_VIEWER_RELATIONSHIP_UNSPECIFIED is the proto3 zero value and is
  // never reported.
  JOURNEY_VIEWER_RELATIONSHIP_UNSPECIFIED = 0;
  // JOURNEY_VIEWER_RELATIONSHIP_INITIATOR: the viewer is the principal the
  // intent records as its initiator.
  JOURNEY_VIEWER_RELATIONSHIP_INITIATOR = 1;
  // JOURNEY_VIEWER_RELATIONSHIP_ASSIGNEE: the viewer holds the current work
  // item (routed assignee or claimant).
  JOURNEY_VIEWER_RELATIONSHIP_ASSIGNEE = 2;
  // JOURNEY_VIEWER_RELATIONSHIP_CANDIDATE: the viewer may claim the current
  // work item.
  JOURNEY_VIEWER_RELATIONSHIP_CANDIDATE = 3;
}

// JourneyViewerResponsibility is what a journey asks of the calling viewer.
enum JourneyViewerResponsibility {
  // JOURNEY_VIEWER_RESPONSIBILITY_UNSPECIFIED means the engine did not
  // resolve a responsibility; clients treat it as nothing to act on.
  JOURNEY_VIEWER_RESPONSIBILITY_UNSPECIFIED = 0;
  // JOURNEY_VIEWER_RESPONSIBILITY_ACTION_REQUIRED: the viewer holds or may
  // claim the current work item, or initiated the journey and its next step
  // is the proposer's.
  JOURNEY_VIEWER_RESPONSIBILITY_ACTION_REQUIRED = 1;
  // JOURNEY_VIEWER_RESPONSIBILITY_TRACKING: the viewer initiated the journey
  // and its next step belongs to someone else or to the workflow.
  JOURNEY_VIEWER_RESPONSIBILITY_TRACKING = 2;
  // JOURNEY_VIEWER_RESPONSIBILITY_OBSERVING: the journey is open and visible
  // to the viewer, who has no relationship to it.
  JOURNEY_VIEWER_RESPONSIBILITY_OBSERVING = 3;
  // JOURNEY_VIEWER_RESPONSIBILITY_CLOSED: the journey is closed.
  JOURNEY_VIEWER_RESPONSIBILITY_CLOSED = 4;
}

// JourneyNextStep is the closed vocabulary of a journey's next transition.
enum JourneyNextStep {
  // JOURNEY_NEXT_STEP_UNSPECIFIED: no next step (closed or unknown stage).
  JOURNEY_NEXT_STEP_UNSPECIFIED = 0;
  // JOURNEY_NEXT_STEP_START_APPROVAL: the proposal is ready for approval.
  JOURNEY_NEXT_STEP_START_APPROVAL = 1;
  // JOURNEY_NEXT_STEP_CORRECT_PROPOSAL: the proposal is blocked and must be
  // corrected.
  JOURNEY_NEXT_STEP_CORRECT_PROPOSAL = 2;
  // JOURNEY_NEXT_STEP_APPROVAL_DECISION: an approval decision.
  JOURNEY_NEXT_STEP_APPROVAL_DECISION = 3;
  // JOURNEY_NEXT_STEP_MANAGER_DECISION: the manager's approval decision.
  JOURNEY_NEXT_STEP_MANAGER_DECISION = 4;
  // JOURNEY_NEXT_STEP_FINANCE_DECISION: finance's approval decision.
  JOURNEY_NEXT_STEP_FINANCE_DECISION = 5;
  // JOURNEY_NEXT_STEP_REAPPROVAL_DECISION: an approval decision required
  // again after a material change.
  JOURNEY_NEXT_STEP_REAPPROVAL_DECISION = 6;
  // JOURNEY_NEXT_STEP_REPAIR: governed repair.
  JOURNEY_NEXT_STEP_REPAIR = 7;
  // JOURNEY_NEXT_STEP_AWAIT_EFFECTIVE_DATE: the workflow waits for the
  // effective date safe point.
  JOURNEY_NEXT_STEP_AWAIT_EFFECTIVE_DATE = 8;
  // JOURNEY_NEXT_STEP_SYSTEM_PROCESSING: the workflow is processing.
  JOURNEY_NEXT_STEP_SYSTEM_PROCESSING = 9;
  // JOURNEY_NEXT_STEP_AWAIT_ACKNOWLEDGEMENT: the workflow is parked on the
  // employee acknowledgement gate; a person must record the verified
  // acknowledgement, but no role class on the journey names whose job it is.
  JOURNEY_NEXT_STEP_AWAIT_ACKNOWLEDGEMENT = 10;
}

// JourneyStepOwner is the role class that holds a journey's next step.
enum JourneyStepOwner {
  // JOURNEY_STEP_OWNER_UNSPECIFIED: no owner is stated.
  JOURNEY_STEP_OWNER_UNSPECIFIED = 0;
  // JOURNEY_STEP_OWNER_PROPOSER: the journey's proposer.
  JOURNEY_STEP_OWNER_PROPOSER = 1;
  // JOURNEY_STEP_OWNER_APPROVER: an approver.
  JOURNEY_STEP_OWNER_APPROVER = 2;
  // JOURNEY_STEP_OWNER_MANAGER: the manager.
  JOURNEY_STEP_OWNER_MANAGER = 3;
  // JOURNEY_STEP_OWNER_FINANCE: finance.
  JOURNEY_STEP_OWNER_FINANCE = 4;
  // JOURNEY_STEP_OWNER_SYSTEM: the workflow or the calendar.
  JOURNEY_STEP_OWNER_SYSTEM = 5;
}

// JourneyWorkItemSummary is the list-level view of a journey's current open
// WorkItem, disclosed under the same rules WorkService applies
// (internal/humanwork/workitem: MembershipOf, Visible, ContextVisible,
// PermittedActions). It deliberately carries no work item id: raw identifiers
// on the list are diagnostics-only (PROMOUX-008).
message JourneyWorkItemSummary {
  // kind is one of APPROVAL, TASK (workitem.Kind).
  string kind = 1;
  // status is the workitem.Status token, e.g. ASSIGNED, AVAILABLE, CLAIMED.
  string status = 2;
  // assignee_principal_id is the principal the item is routed to directly.
  // It is empty when the item is owned by a candidate set, and empty whenever
  // workitem.ContextVisible does not admit this viewer.
  string assignee_principal_id = 3;
  // assignee_display_name is the assignee's worker display name when the
  // principal id is a stable worker identifier this cell resolves; empty
  // otherwise. It is never derived from anything but that identity join.
  string assignee_display_name = 4;
  // due_at is the item's deadline, unset when it has none.
  google.protobuf.Timestamp due_at = 5;
  // viewer_permitted_actions is workitem.PermittedActions for this viewer:
  // the action tokens ("claim", "release", "complete", "decide_approval")
  // the viewer could exercise on the item right now, sorted.
  repeated string viewer_permitted_actions = 6;
  // viewer_membership is how the viewer stands to the item: one of NONE,
  // CANDIDATE, ASSIGNEE, CLAIMANT (workitem.Membership).
  string viewer_membership = 7;
}

// Finding is one simulation finding, as the artifact reports it
// (workspace.JourneyFinding).
message Finding {
  string severity = 1;
  string code = 2;
  string message = 3;
}

// Instance is the workflow instance the journey is running as
// (workspace.JourneyInstance). It is unset on a JourneyDetail until the
// journey has been executed.
message Instance {
  string instance_id = 1;
  int64 instance_version = 2;
  string workflow_id = 3;
  uint32 workflow_version = 4;
  string plan_digest = 5;
  string status = 6;
  repeated string current_node_ids = 7;
  string correlation_id = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp completed_at = 11;
}

// NodeExecution is one durable node-execution row
// (workspace.JourneyNode).
message NodeExecution {
  string node_id = 1;
  int32 attempt = 2;
  string step_type = 3;
  string status = 4;
  string trace_id = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp completed_at = 7;
  google.protobuf.Timestamp recorded_at = 8;
}

// WorkItem is one durable human-work row the instance's frontier raised
// (internal/humanwork/workitem.WorkItem), projected down to what the journey
// page shows. It is deliberately narrower than
// hcmnext.admin.v1.WorkItemProfile: the operator inspector renders the whole
// governance frame with redaction states, whereas this page shows who owes
// the decision and where the item stands.
message WorkItem {
  string work_item_id = 1;
  // kind is one of APPROVAL, TASK (workitem.Kind).
  string kind = 2;
  // status is the workitem.Status token, e.g. CREATED, ROUTED, CLAIMED,
  // COMPLETED.
  string status = 3;
  string work_type = 4;
  string node_id = 5;
  string owner_ref = 6;
  // chosen_owner is the principal routing named directly
  // (workitem.Assignment.ChosenOwner), set only when resolution produced
  // exactly one candidate. Empty means the item was left open as a
  // candidate set, or resolution found nobody at all.
  string chosen_owner = 7;
  string claimed_by = 8;
  google.protobuf.Timestamp claimed_at = 9;
  google.protobuf.Timestamp claim_expires_at = 10;
  string completed_by = 11;
  google.protobuf.Timestamp completed_at = 12;
  google.protobuf.Timestamp deadline_at = 13;
  google.protobuf.Timestamp created_at = 14;
  int64 item_version = 15;
}

// WorkItemTransition is one immutable WorkItem transition, for the audit
// trail (workspace.JourneyTransition).
message WorkItemTransition {
  string work_item_id = 1;
  string from = 2;
  string to = 3;
  string actor = 4;
  string reason = 5;
  google.protobuf.Timestamp at = 6;
}

// LedgerEvent is the one governed business write the END node raised
// (workspace.JourneyLedgerEvent). It is unset until that terminal write has
// been recorded.
message LedgerEvent {
  string stream_key = 1;
  int64 sequence = 2;
  string schema_ref = 3;
  string digest = 4;
  string idempotency_key = 5;
  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp effective_at = 7;
  google.protobuf.Timestamp recorded_at = 8;
}

// TimelineEvent is one entry of the engine-composed chronological timeline
// (workspace.JourneyEvent): intent created, simulated, gate admitted,
// instance started, work item routed/claimed/completed, node completed,
// ledger fact recorded.
message TimelineEvent {
  google.protobuf.Timestamp at = 1;
  string actor = 2;
  string kind = 3;
  string title = 4;
  string detail = 5;
  string ref = 6;
}

// JourneyDetail is everything the detail page shows for one journey
// (workspace.JourneyDetail).
message JourneyDetail {
  Journey journey = 1;
  repeated Finding findings = 2;
  repeated string planned_writes = 3;
  // instance, nodes, work_items and transitions are unset/empty until the
  // journey has been executed.
  Instance instance = 4;
  repeated NodeExecution nodes = 5;
  repeated WorkItem work_items = 6;
  repeated WorkItemTransition transitions = 7;
  LedgerEvent ledger = 8;
  // evidence_ids are every capability-gateway and execution evidence
  // identifier the engine recorded for this journey, in order.
  repeated string evidence_ids = 9;
  repeated TimelineEvent timeline = 10;
  // approver is the principal the approval WorkItem is routed to. The page
  // shows who will decide; the engine decides as that principal.
  string approver = 11;
  // detail_digest is "sha256:" followed by the lowercase hex SHA-256 of the
  // deterministically marshalled canonical Protobuf bytes of this very
  // message with detail_digest itself cleared. It exists so a client can
  // decide "has anything I display changed" with one comparison rather than
  // a deep diff, and so WatchJourney can answer the same question on the
  // server without the page describing what it considers a change. It is
  // computed by internal/transport/journey, not by the engine, and is not a
  // governance artifact: the material proposal digest on Journey is.
  string detail_digest = 12;
  // These are server-authorized, viewer-relative presentation capabilities.
  // Clients must not infer them from locally held role strings.
  bool diagnostics_available = 13;
  bool can_decide = 14;
  // notes are the journey's free-standing notes, oldest first.
  repeated JourneyNote notes = 15;
  // promotion_review is the reviewer's view of what the promotion changes
  // in the reporting line and the compensation guardrail it must respect
  // (REV-091-02). It is unset when the engine produced no review for this
  // viewer. Pay figures inside it are populated only when the engine's own
  // compensation authorization admitted this viewer.
  JourneyPromotionReview promotion_review = 16;
}

// JourneyPromotionReview is PROMOUX-005's management impact and PROMOUX-006's
// compensation guardrail for one journey, as server-computed facts. Clients
// localize and render them; they never recompute a range or a cycle verdict.
message JourneyPromotionReview {
  // target_manager_evaluated is true when a target manager was resolved,
  // disclosed to this viewer and checked for reporting cycles. When false,
  // the three manager fields below are empty/zero.
  bool target_manager_evaluated = 1;
  // target_manager_display_name is the manager's display name.
  string target_manager_display_name = 2;
  // affected_direct_reports counts the workers who would newly report to
  // the promoted worker.
  int32 affected_direct_reports = 3;
  // cycle_safe is true only when every proposed reporting edge was
  // certified free of a cycle.
  bool cycle_safe = 4;
  JourneyCompensationGuardrail compensation_guardrail = 5;
  // manager_unchanged is true when the request names no new manager, so the
  // worker keeps their current reporting line.
  bool manager_unchanged = 6;
  // The position titles and organization name are presentation labels
  // resolved from the position directory; empty when unresolved. Clients
  // never fall back to printing a position identifier.
  string current_position_title = 7;
  string target_position_title = 8;
  string target_organization_name = 9;
}

// JourneyCompensationGuardrail is promotion.CompensationGuardrail on the wire.
// When status is UNAVAILABLE every amount field is empty: an unauthorized or
// unresolved guardrail never carries a figure a viewer could infer pay from.
message JourneyCompensationGuardrail {
  enum Status {
    // STATUS_UNSPECIFIED is never sent.
    STATUS_UNSPECIFIED = 0;
    STATUS_AVAILABLE = 1;
    STATUS_UNAVAILABLE = 2;
  }
  Status status = 1;
  // unavailable_reason is NOT_AUTHORIZED or BAND_UNRESOLVED when status is
  // UNAVAILABLE; empty means an unspecified reason.
  string unavailable_reason = 2;
  // The amounts are exact decimal strings in currency, annualized.
  string current_annualized = 3;
  string minimum_annualized = 4;
  string maximum_annualized = 5;
  // permitted_increase_fraction is an exact decimal fraction (0.18 = 18%).
  string permitted_increase_fraction = 6;
  // band_position is BELOW_MINIMUM, IN_BAND or ABOVE_MAXIMUM.
  string band_position = 7;
  string currency = 8;
  // effective_date_basis is the ISO-8601 date the band was resolved as of.
  string effective_date_basis = 9;
}

// JourneyNote is one append-only note on a journey. The author is disclosed
// by display name only; the principal identifier stays on the server.
message JourneyNote {
  string note_id = 1;
  // author_display is the author's display name, empty when it cannot be
  // resolved for this viewer.
  string author_display = 2;
  // authored_by_viewer is true when the calling principal wrote the note.
  bool authored_by_viewer = 3;
  string body = 4;
  // stage is the journey stage when the note was written.
  JourneyStage stage = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AddJourneyNoteRequest {
  string intent_id = 1;
  // body is 1 to 2000 characters after trimming surrounding whitespace.
  string body = 2;
  // idempotency_key identifies this one submission; required, at most 128
  // characters.
  string idempotency_key = 3;
}

message AddJourneyNoteResponse {
  JourneyNote note = 1;
  JourneyDetail detail = 2;
}

message ListJourneysRequest {
  hcmnext.common.v1.PageRequest page = 1;
  string worker_ref = 2;
  string query = 3;
  string sort = 4;
  string direction = 5;
  int32 page_number = 6;
  string outcome = 7;
  string year = 8;
  bool terminal_only = 9;
}

message ListJourneysResponse {
  repeated Journey journeys = 1;
  hcmnext.common.v1.PageResponse page = 2;
  int32 total_count = 3;
  // population is the server's one count of the caller's authorized journey
  // set, computed from exactly the journeys in this response (UXLIVE-027).
  // Every summary surface (Home, Insights, Journeys) reads its totals here
  // instead of recounting the collection.
  JourneyPopulationSummary population = 4;
  // Recipient-owned secure inbox notices, filtered by current journey access.
  repeated WorkflowNotification notifications = 5;
  // An inbox failure must not prevent users from reading or deciding work.
  bool notifications_unavailable = 6;
}

message WorkflowNotification {
  string notification_id = 1;
  string journey_id = 2;
  string work_item_id = 3;
  string worker_name = 4;
  string purpose = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  bool read = 8;
}

// JourneyPopulationSummary is the authorization-filtered journey summary
// projection: totals, status buckets and freshness, computed once by the
// server over the viewer's visible journeys.
message JourneyPopulationSummary {
  // total is every visible journey; total = active + closed.
  int32 total = 1;
  int32 active = 2;
  int32 closed = 3;
  // needs_action counts open journeys whose next step the viewer holds.
  int32 needs_action = 4;
  // tracking counts open journeys the viewer initiated, whoever holds the
  // next step.
  int32 tracking = 5;
  // exceptions counts journeys stopped on an exception: blocked, failed or
  // requiring repair.
  int32 exceptions = 6;
  // stages is one bucket per stage present, in stage order.
  repeated JourneyStageCount stages = 7;
  // latest_update is the most recent durable change across the set; unset
  // when the set is empty.
  google.protobuf.Timestamp latest_update = 8;
  // computed_at is when the server computed this summary.
  google.protobuf.Timestamp computed_at = 9;
}

message JourneyStageCount {
  JourneyStage stage = 1;
  int32 count = 2;
}

// ProposeJourneyRequest is what the manager fills in
// (workspace.ProposalInput). Everything else the intent needs - the worker's
// current placement and pay, the budget authority - the engine reads through
// the governed worker read, never from this message.
message ProposeJourneyRequest {
  string worker_ref = 1;
  Placement target = 2;
  // proposed_base is a decimal string in the worker's current currency.
  string proposed_base = 3;
  // effective_date is ISO-8601 (YYYY-MM-DD).
  string effective_date = 4;
  string business_reason = 5;
}

message ProposeJourneyResponse {
  Journey journey = 1;
}

// ProposePromotionRequest is the intent-only `promotion.propose` contract
// (PROMO-007): everything a caller is entitled to say about a promotion, and
// nothing else.
//
// The field set is closed and is mirrored by a closed allowlist in
// internal/intent/app, which refuses to serve at all if the two ever disagree.
// Read the absences as deliberately as the fields: there is no current base
// pay, no current manager, no current placement, no position vacancy or
// headcount, no budget envelope or remaining pool, and no approval-authority
// assertion, because every one of those is a server-resolved fact and a
// request that could state one would be a request that could lie about one.
// There is likewise no principal, tenant, organization scope, session,
// delegation, purpose, locale or legal-context selector: the trusted-request
// boundary derives all of those from the verified credential
// (internal/transport.ApplyTrustedContext and internal/intent/app's own
// origin derivation), and admission already refuses a caller that tries to
// choose them.
//
// Every field is a string because every one of them is either a reference, a
// vocabulary token, a decimal in text as the domain carries it, or an
// ISO-8601 date. This message re-encodes none of them; it forwards what the
// caller said and lets the domain parse it.
message ProposePromotionRequest {
  // subject_worker_ref names the employee being promoted. It is the stable
  // reference the journey's own worker list shows
  // (ListWorkersResponse.workers[].worker_ref), never a raw internal id the
  // caller happens to have seen. Required.
  string subject_worker_ref = 1;

  // The desired end state. desired_job_code, desired_grade and
  // desired_position_id are required: a promotion that names no target job,
  // no target grade and no target position is not a promotion.
  string desired_job_code = 2;
  string desired_grade = 3;
  string desired_position_id = 4;
  // desired_org_unit may be empty, meaning "the organizational unit the
  // subject is in today", which the server reads rather than the caller
  // asserting it.
  string desired_org_unit = 5;
  // desired_manager_ref may be empty, meaning "unchanged". It is the desired
  // manager, not a claim about the current one: the current manager is a
  // governed read.
  string desired_manager_ref = 6;
  // desired_base_pay is the proposed base pay, a decimal in text. Required.
  // It is the only money figure in this message, and it is a proposal, not a
  // baseline: the subject's current pay, the pay band and the budget
  // authority are all resolved server-side.
  string desired_base_pay = 7;
  // desired_pay_currency may be empty, meaning the subject's own currency.
  // When it is set it must equal that currency; this contract proposes a
  // promotion, not a redenomination, and accepting a different one would be
  // accepting a currency assertion.
  string desired_pay_currency = 8;

  // effective_date is ISO-8601 (YYYY-MM-DD). Required.
  string effective_date = 9;
  // reason is the business reason the requester gives. Required.
  string reason = 10;

  // expected_subject_revision is the revision of the subject the intention
  // was formed against, and it is required: a promotion proposed against a
  // view of the employee that has since moved on is a proposal about
  // somebody who no longer exists in that state, and accepting it silently
  // is how a lost update happens. Its form is the subject's compensation
  // revision coordinate, "<revision_stream>@<revision_sequence>" - see
  // internal/intent/app.PromotionSubjectRevision, which is the one
  // implementation the server compares against.
  string expected_subject_revision = 11;

  // client_request_id is the caller's own identifier for this request and is
  // required. It is the idempotency coordinate: two calls carrying the same
  // one are one intent, whichever transport each arrived on. It is
  // deliberately excluded from ProposePromotionResponse.request_digest,
  // because it says which call this is and nothing about what is being
  // proposed.
  string client_request_id = 12;
}

// ProposePromotionResponse is what the server did. Every field is
// server-derived; none of it echoes the request.
message ProposePromotionResponse {
  // intent_id and correlation_id identify the recorded intent. A replayed
  // client_request_id returns the intent that was actually recorded first.
  string intent_id = 1;
  string correlation_id = 2;
  // proposal_revision_id and material_digest identify the immutable proposal
  // the preflight simulation minted. They are empty when the simulation
  // produced no executable plan, which is what stage = BLOCKED reports.
  string proposal_revision_id = 3;
  string material_digest = 4;
  // canonical_request_digest is the intent's own IDEMPOTENT_REQUEST digest as
  // the kernel minted it. It binds the idempotency key, so two proposals of
  // the same promotion under different client_request_ids carry different
  // values here and the same request_digest.
  string canonical_request_digest = 5;
  // request_digest is the canonical digest of this very request contract:
  // "sha256:" followed by lowercase hex over the length-prefixed, allowlist-
  // ordered encoding of every field above except client_request_id. Two
  // callers proposing the same promotion produce the same value on either
  // transport, which is what makes "the browser, the CLI and the connector
  // invoke one capability" a checkable claim rather than a description.
  string request_digest = 6;
  // stage is where the journey stands after propose and preflight:
  // PROPOSED, or BLOCKED when the simulation produced no executable plan.
  JourneyStage stage = 7;
}

message InspectJourneyRequest {
  string intent_id = 1;
}

message InspectJourneyResponse {
  JourneyDetail detail = 1;
}

message ExecuteJourneyRequest {
  string intent_id = 1;
}

message ExecuteJourneyResponse {
  JourneyDetail detail = 1;
}

message DecideJourneyRequest {
  string intent_id = 1;
  bool approve = 2;
  string reason = 3;
}

message DecideJourneyResponse {
  JourneyDetail detail = 1;
}

message AcknowledgeJourneyRequest {
  string intent_id = 1;
  // evidence_ref points at the verified artifact (signed document or HRIS
  // record) when there is one; note carries anything else the attester
  // states. Both travel verbatim into the signal payload.
  string evidence_ref = 2;
  string note = 3;
}

message AcknowledgeJourneyResponse {
  JourneyDetail detail = 1;
}

// JourneyInterventionKind is the closed set of typed interventions
// PROMOUX-013 adds beyond Execute and Decide. Both kinds run the same
// underlying governed capability (CancelIntent); the kind exists so the
// page can offer the right affordance at the right stage and so the
// consequence preview can speak to what the caller is actually about to
// do.
enum JourneyInterventionKind {
  JOURNEY_INTERVENTION_KIND_UNSPECIFIED = 0;
  // JOURNEY_INTERVENTION_KIND_WITHDRAW: stop a proposal before any approval
  // has been recorded against it.
  JOURNEY_INTERVENTION_KIND_WITHDRAW = 1;
  // JOURNEY_INTERVENTION_KIND_CANCEL: request cancellation while the
  // journey is in an eligible wait (for example, waiting on approval or on
  // its effective-date safe point).
  JOURNEY_INTERVENTION_KIND_CANCEL = 2;
  // JOURNEY_INTERVENTION_KIND_REPAIR: the governed repair a journey stopped
  // in REPAIR_REQUIRED names as its next step. Unlike the two above it is
  // not a CancelIntent composition: it is the operator repair door
  // (internal/intent/operator/workflowcontrol.RepairController), with its
  // own JIT authority, dual control and simulation requirements. Previewing
  // it is what this service offers; the corrective effect itself is driven
  // through that door against an authored repair plan.
  JOURNEY_INTERVENTION_KIND_REPAIR = 3;
}

// EditProposalRequest carries the corrected fields for an unstarted or
// not-yet-approved proposal. The worker is not editable here: an edit
// changes the promotion being proposed, never who it is for.
message EditProposalRequest {
  string intent_id = 1;
  uint64 expected_instance_version = 2;
  string idempotency_key = 3;
  // reason is the business reason for the edit and is required: it becomes
  // the successor intent's own SupersedeIntent reason_ref, retained as
  // evidence.
  string reason = 4;
  Placement target = 5;
  // proposed_base is a decimal string in the worker's current currency.
  string proposed_base = 6;
  // effective_date is ISO-8601 (YYYY-MM-DD).
  string effective_date = 7;
  string business_reason = 8;
}

message EditProposalResponse {
  // journey is the new successor proposal, at JOURNEY_STAGE_PROPOSED or
  // JOURNEY_STAGE_BLOCKED.
  Journey journey = 1;
  // superseded_intent_id names the original, now at RequestState CANCELLED
  // (see EditProposal's own doc comment for why CANCELLED, not SUPERSEDED).
  string superseded_intent_id = 2;
}

message PreviewJourneyInterventionRequest {
  string intent_id = 1;
  JourneyInterventionKind kind = 2;
}

message PreviewJourneyInterventionResponse {
  bool available = 1;
  // unavailable_reason_ref names, by stable reference, why the intervention
  // is not offered at this stage. It is present whenever available is
  // false and absent otherwise; its value never varies by anything other
  // than the journey's own durable stage.
  string unavailable_reason_ref = 2;
  // consequence_summary is a server-composed, human-readable explanation of
  // what confirming this intervention right now would do. Empty when
  // available is false.
  string consequence_summary = 3;
  // likely_outcome is the outcome this intervention would most likely
  // resolve to if confirmed right now. It is advisory: the actual call to
  // RequestJourneyIntervention re-evaluates durable state at that instant
  // and may resolve differently if the journey's state changed in between.
  hcmnext.common.v1.InterventionOutcome likely_outcome = 4;
  // current_governance_version is the journey's current
  // Journey.governance_version, present whenever available is true, so a
  // client can confirm the intervention with RequestJourneyIntervention
  // without a second read.
  uint64 current_governance_version = 5;
  // requires_dual_control and requires_simulation are the governed door's
  // own requirements for this kind, read from the operator policy rather
  // than restated by a client. A page that named a governed action without
  // them would be describing a lighter action than the one that exists.
  bool requires_dual_control = 6;
  bool requires_simulation = 7;
  // authority_role_refs names the JIT roles whose grant may authorize this
  // kind. It is the "who can act" half of a refusal: a viewer who may not
  // act is told which authority is needed, not merely that they lack it.
  // The roles a kind requires are policy, identical for every caller, so
  // naming them discloses nothing about who holds them.
  repeated string authority_role_refs = 8;
}

message RequestJourneyInterventionRequest {
  string intent_id = 1;
  JourneyInterventionKind kind = 2;
  uint64 expected_instance_version = 3;
  string idempotency_key = 4;
  string reason = 5;
}

message RequestJourneyInterventionResponse {
  Journey journey = 1;
  hcmnext.common.v1.InterventionOutcome outcome = 2;
  // retained_evidence_ref names the durable evidence record this
  // intervention retained (the same id CancelIntentResponse's own
  // CancellationDecision carries).
  string retained_evidence_ref = 3;
}

message WatchJourneyRequest {
  string intent_id = 1;
  // since_digest is the JourneyDetail.detail_digest the client already
  // holds. Empty means "I hold nothing", so the initial emission is always
  // sent. When it equals the digest of the journey's current detail, the
  // initial emission is skipped and the stream stays silent until the
  // journey actually changes.
  string since_digest = 2;
  // Field 3 held the long poll's timeout. The watch is a stream now: how
  // long it lasts is the client's decision (it cancels) bounded by the
  // server's ceiling, not a number the request carries.
  reserved 3;
  reserved "timeout";
  // resume_cursor is the opaque, signed cursor a prior
  // WatchJourneyResponse.cursor carried, presented back so a reconnect
  // continues the same resumable stream (internal/transport/streaming,
  // PROTO-007) rather than opening an unrelated one. It is unrelated to
  // since_digest: since_digest still governs which detail the initial
  // emission may skip, while resume_cursor authenticates and positions the
  // stream itself, tenant- and stream-bound and expiring. Empty means "no
  // stream to resume" and is always accepted; a forged, expired or
  // foreign-tenant cursor is refused before the stream opens. It has no
  // effect at all when the server was composed with no cursor signing key,
  // in which case the response's own cursor field is left empty too.
  string resume_cursor = 4;
}

message WatchJourneyResponse {
  JourneyDetail detail = 1;
  // Field 2 held the long poll's changed flag, which distinguished a real
  // change from a wait that elapsed. A stream emits only on change, so
  // every message on it is a change and the flag would be a constant true.
  reserved 2;
  reserved "changed";
  // cursor is the opaque, signed position of this message in the stream
  // (internal/transport/streaming.Cursor, PROTO-007): present it back as
  // WatchJourneyRequest.resume_cursor on a later stream for this same
  // journey to prove continuity to the server rather than merely to resume
  // content-wise, which since_digest already does on its own. It is empty
  // when the server was composed with no cursor signing key.
  string cursor = 3;
  // sequence is this message's position in the resumable stream, counting
  // from one: the first message a stream sends carries 1, the next 2, and a
  // stream resumed from a cursor naming sequence N carries N+1 next. It is
  // the plain form of what cursor names, carried so a client can check for
  // itself that a reconnect left no gap and delivered no duplicate
  // (internal/transport/streaming.OrderTracker performs exactly that
  // comparison) without ever parsing the opaque cursor, which it is not
  // entitled to read. It is zero, like cursor is empty, when the server was
  // composed with no cursor signing key: a stream that issues no cursor
  // numbers nothing, because a sequence a client cannot resume from would
  // be a number with no contract behind it.
  uint64 sequence = 4;
}

message WatchPromotionInvalidationsRequest {
  // region names the presentation region the hints are for: SHELL_COUNT,
  // JOURNEYS, MY_WORK, PERSON or DETAIL
  // (internal/domains/promotion.Region). Any other value is refused
  // INVALID_ARGUMENT.
  string region = 1;
  // after_sequence is the last sequence this client committed on a previous
  // stream. The new stream numbers its messages from the one after it, so
  // the client's own ordering continues across reconnects. It numbers the
  // caller's own hints only and grants nothing. Zero starts at one.
  uint64 after_sequence = 2;
}

message WatchPromotionInvalidationsResponse {
  // invalidation is one canonical product-query invalidation message
  // (internal/transport/productquery.InvalidationMessage, JSON): tenant,
  // projection, the caller's own contiguous source_sequence and watermark,
  // and the authorized subjects with their new revisions. Never display
  // data.
  bytes invalidation = 1;
}

// Worker is one employee as the worker list shows them
// (workspace.WorkerSummary).
//
// It is a listing row, not a worker record: it carries what somebody needs to
// recognise a person and choose them, and nothing that would make this service
// a second, ungoverned way to read worker state. The authoritative answer to
// "what is true about this worker" is the governed worker read the engine
// itself performs while proposing.
message Worker {
  // worker_ref is the stable reference the journey accepts: the corpus key for
  // a corpus worker, the created worker's own key otherwise. It is what
  // ProposeJourneyRequest.worker_ref is filled with.
  string worker_ref = 1;
  // worker_id is the entity id the governed read names the worker by.
  string worker_id = 2;
  string legal_name = 3;
  string preferred_name = 4;
  string worker_number = 5;
  string job_code = 6;
  string grade = 7;
  string org_unit = 8;
  string position_id = 9;
  string location = 10;
  string pay_zone = 11;
  // base_pay and bonus_target are decimal strings, in currency and as a
  // fraction respectively, as the domain carries them. They are empty on a
  // corpus worker, whose compensation baseline comes from the ported legacy
  // corpus rather than from a record of its own.
  string base_pay = 12;
  string currency = 13;
  string bonus_target = 14;
  // hire_date is ISO-8601 (YYYY-MM-DD).
  string hire_date = 15;
  // source is CORPUS or CREATED (workspace.WorkerSourceCorpus /
  // workspace.WorkerSourceCreated).
  string source = 16;
  // created_at is when a created worker was recorded. It is unset for a corpus
  // worker, which was not created at any moment this cell witnessed.
  google.protobuf.Timestamp created_at = 17;
  // manager_ref is the stable manager relationship reference. It may name a
  // worker or an external governance body such as the company board.
  string manager_ref = 18;
  // profile_photo_url is a same-origin display proxy. The retained original
  // upload reference is deliberately not exposed by this listing message.
  string profile_photo_url = 19;
  // job_title is the human-readable title; job_code remains the governed
  // classification used by workflows and compensation rules.
  string job_title = 20;
  // Authoritative compensation revision a canonical promotion proposal must
  // bind through expected_subject_revision.
  string subject_revision = 21;
  // Authorization-safe reporting relationship used by organization views.
  // It is always present in ListWorkers responses; UNSPECIFIED fails closed.
  ManagerRelationshipProjection manager_relationship = 22;
  // The employment facts the worker object page shows beside the placement
  // fields above. They are recorded facts about the worker's own employment,
  // the same class as org_unit and location, and are disclosed under the same
  // ruling; nothing here is compensation or identity.
  //
  // employment_type is REGULAR or FIXED_TERM -- a different question from
  // worker type, since a fixed-term worker is still an employee. time_type is
  // FULL_TIME or PART_TIME and always agrees with the worker's FTE.
  // work_arrangement is ON_SITE, HYBRID or REMOTE.
  //
  // Each is empty when nobody asserts it -- a corpus worker asserts none of
  // them -- so that the reader can tell an unreported fact from a blank one.
  string employment_type = 23;
  string time_type = 24;
  // company is the employing legal entity, business_unit the unit's parent
  // line, and cost_center the charge code the placement is booked to.
  string company = 25;
  string business_unit = 26;
  string cost_center = 27;
  string work_arrangement = 28;
  // pay_basis is the recorded basis of the baseline above -- ANNUAL_SALARY or
  // HOURLY_RATE -- and is what the pay frequency a reader sees is derived
  // from. It travels beside base_pay and currency because a rate without its
  // basis is not an amount anybody can interpret, and it is withheld with
  // them: a basis disclosed while the amount is not would still narrow the
  // amount.
  string pay_basis = 29;
  // lifecycle_status is the journey_worker lifecycle token for
  // this worker — ACTIVE, TERMINATED or ON_LEAVE — and
  // worker_type the employment worker-type token — EMPLOYEE,
  // CONTRACTOR, INTERN or TEMPORARY. Both travel beside the
  // employment facts above under the same disclosure ruling, and
  // both are empty when nobody asserted them: a corpus worker
  // asserts neither, and an unreported fact stays unreported.
  string lifecycle_status = 30;
  string worker_type = 31;
}

// WorkforceOptions is the closed set of placements a created worker may be
// given (workspace.WorkforceOptions), derived by the engine from the pay-band
// catalog and the corpus population.
//
// It exists so the form and the refusal agree: CreateWorker refuses a
// placement outside it with INVALID_ARGUMENT naming the field, and this is
// that same answer stated in advance.
message WorkforceOptions {
  repeated string job_codes = 1;
  repeated string grades = 2;
  repeated string org_units = 3;
  repeated string pay_zones = 4;
  repeated string positions = 5;
  // currency is the one currency the pay-band catalog is denominated in. A
  // created worker's baseline is carried in it.
  string currency = 6;
  // placements preserves the catalog's exact combinations. The parallel
  // string lists above remain useful for worker-creation controls, but they
  // cannot prove that an arbitrary job/grade/pay-zone cross-product exists.
  repeated WorkforcePlacementOption placements = 7;
  // promotion_paths are the published, source-specific job-architecture
  // edges. A pay band proves a target can be paid; only one of these edges
  // proves it is a permitted next role for a particular current profile.
  repeated PromotionPathOption promotion_paths = 8;
  // position_vacancies are the positions the cell has proved are real,
  // authorized and still open at the read coordinate. The parallel
  // positions list above is every position id the observed population
  // occupies, which is the opposite of a vacancy; it stays for
  // worker-creation controls. An empty list means "no vacancy this caller
  // may target", which is an answer, not an invitation to type one in.
  repeated PositionVacancyOption position_vacancies = 9;
}

// PositionVacancyOption is one position a promotion proposal may target.
//
// reference is the only field a proposal binds to: it is the server-issued
// position revision reference, never a raw position id, so a value that did
// not come from this list cannot be made to decode as one.
message PositionVacancyOption {
  string reference = 1;
  string title = 2;
  string organization = 3;
  string manager = 4;
  string location = 5;
  // job_code and org_unit are the position's own governed codes, published
  // so a form can narrow the list to the role being proposed. They narrow
  // what is shown; they never widen what may be chosen.
  string job_code = 6;
  string org_unit = 7;
  // vacancy_end is the earliest date the position is known to stop being
  // open, as yyyy-mm-dd, or empty when no end is known.
  string vacancy_end = 8;
  // reservation_state is the disclosed state of the position's capacity,
  // stated rather than implied by the option's mere presence.
  string reservation_state = 9;
}

// WorkforcePlacementOption is one exact compensation-catalog scope. It is
// the minimum governed target identity the current journey surface can offer;
// future job-architecture revisions may additionally pin a profile/path ref.
message WorkforcePlacementOption {
  string job_code = 1;
  string grade = 2;
  string pay_zone = 3;
  string currency = 4;
}

// PromotionPathOption is one immutable ladder edge projected for clients.
// Increase guardrails are exact decimal fractions (0.0500 is five percent),
// never floating-point numbers. Benefit rules trigger eligibility
// reevaluation; they do not directly mutate a worker's elections.
message PromotionPathOption {
  string path_ref = 1;
  string revision = 2;
  string source_profile_ref = 3;
  string source_job_code = 4;
  string source_grade = 5;
  string target_profile_ref = 6;
  string target_job_code = 7;
  string target_grade = 8;
  string target_title = 9;
  string kind = 10;
  string minimum_base_increase = 11;
  string maximum_base_increase = 12;
  string compensation_policy_ref = 13;
  repeated string benefit_rule_refs = 14;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated Worker workers = 1;
  WorkforceOptions options = 2;
}

// CreateWorkerRequest is what somebody fills in to add an employee
// (workspace.WorkerInput). Everything the record needs that is not asked for
// here -- the worker number, the employment and assignment identifiers, the
// lifecycle status, the revision stream position and the bitemporal
// coordinates -- the engine derives, because those are identity and evidence
// rather than choices a form gets to make.
message CreateWorkerRequest {
  string legal_name = 1;
  // preferred_name may be empty; the engine derives one from the legal name.
  string preferred_name = 2;
  string job_code = 3;
  string grade = 4;
  string org_unit = 5;
  string position_id = 6;
  // location may be empty; the engine falls back to the org unit, which is the
  // closest thing to a place this record actually knows.
  string location = 7;
  string pay_zone = 8;
  // base_pay is a decimal string in currency and must be greater than zero.
  string base_pay = 9;
  // currency may be empty, meaning WorkforceOptions.currency.
  string currency = 10;
  // bonus_target is a decimal fraction (0.0500 is five percent). Empty means
  // the engine's own default.
  string bonus_target = 11;
  // hire_date is ISO-8601 (YYYY-MM-DD).
  string hire_date = 12;
  // manager_ref may be empty; the engine derives a relationship reference.
  string manager_ref = 13;
}

message CreateWorkerResponse {
  Worker worker = 1;
}

