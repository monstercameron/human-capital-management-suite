syntax = "proto3";

package hcmnext.admin.v1;

option go_package = "github.com/monstercameron/human-capital-management-suite/gen/go/hcmnext/admin/v1;adminv1";

import "google/protobuf/timestamp.proto";
import "hcmnext/common/v1/common.proto";
import "hcmnext/intents/v1/business_intent.proto";
import "hcmnext/intents/v1/intent_service.proto";

// AdminService is the SVC-011/ADMIN-001 governed operator surface: a
// distinct, operator-scoped gRPC service exposing read, simulate and
// already-approved-operation capabilities only.
//
// Every method here is READ_ONLY or PURE in the
// internal/capability.EffectClass sense (planning/specs/hris-admin-dataops.md
// "The toolkit follows three rules"). There is no Create/Submit/Cancel/
// Supersede/Update/Delete method in this service, in P1A or as a
// conformance placeholder: an operator that needs to change workforce data
// uses the same governed BusinessIntent lifecycle every other caller uses
// (hcmnext.intents.v1.IntentService), under the same authorization
// decisions - this service only ever reads, simulates or explains.
//
// AdminService is hosted by the same process as the ordinary
// hcmnext.intents.v1.IntentService (internal/operations/admin.Register adds
// it to the shared *grpc.Server the modular application already builds via
// internal/transport/grpcserver.NewServer) and reuses that server's whole
// trusted-request boundary unchanged: the same transport.Admit admission
// steps, the same envelope.Error projection, the same evidence-ID
// derivation. What is distinct is the additional per-method authorization
// predicate every handler runs after admission: the caller's authenticated
// trust.Principal must carry the reserved operator role
// (internal/operations/admin.OperatorRole), which an ordinary user or
// service credential is never issued. A caller admitted by the shared
// interceptor chain but lacking that role is refused PERMISSION_DENIED
// before any capability runs (planning/specs/hris-admin-dataops.md,
// planning/specs/go-only-technology-constitution.md).
service AdminService {
  // ListIntents lists BusinessIntent instances for the operator's resolved
  // tenant/organization scope. Its request/response fields mirror
  // hcmnext.intents.v1.ListIntentsRequest/Response field for field (buf's
  // RPC_REQUEST_RESPONSE_UNIQUE lint rule forbids literally reusing one
  // message as the request or response of two RPCs), and the handler
  // forwards to the identical transport.IntentHandler.ListIntents port the
  // ordinary IntentService calls - the same generated hcmnext.intents.v1
  // types travel underneath, so the CLI, the operator console and the
  // ordinary API client agree on one schema for "what is an intent", per
  // ADMIN-001's REFACTOR ("GRPC/grpcbridge/CLI share generated contracts").
  // The admin surface never widens what a read may return beyond what the
  // reused handler port itself resolves for the caller's trusted scope.
  rpc ListIntents(ListIntentsRequest) returns (ListIntentsResponse);

  // GetReleaseManifest renders the current endpoint/capability/intent-
  // definition discovery document (internal/transport/manifest,
  // API-001/ENDPOINT-001) for operator inspection: which methods are
  // SERVED vs REFUSED_P1A vs NOT_EXPOSED, which capabilities exist and
  // their effect class, which intent definitions are registered. It is a
  // pure, no-I/O projection of the compiled-in manifest; two calls in the
  // same release return byte-identical content.
  rpc GetReleaseManifest(GetReleaseManifestRequest) returns (GetReleaseManifestResponse);

  // ListCapabilityProfiles lists every registered capability
  // (internal/capability) with its effect class, risk class, lifecycle
  // status and content digest, so an operator can audit what the running
  // release is willing to execute and under which side-effect declaration.
  rpc ListCapabilityProfiles(ListCapabilityProfilesRequest) returns (ListCapabilityProfilesResponse);

  // ExplainTransaction is a governed, read-only passthrough to
  // internal/domains/intelligence.ExplainTransaction: it reconstructs the
  // authorized chronology of a business transaction from recorded evidence
  // and writes nothing. A transaction the operator profile is not entitled
  // to see returns a WITHHELD explanation with no section detail, never a
  // distinguishable "not found".
  rpc ExplainTransaction(ExplainTransactionRequest) returns (ExplainTransactionResponse);

  // GetWorkerState is a governed, read-only passthrough to
  // internal/domains/people.ExplainWorkerState: it returns the authorized,
  // bitemporal worker/employment/assignment facts the operator profile may
  // see, with denied fields named and marked rather than dropped. It
  // performs no write of any kind.
  rpc GetWorkerState(GetWorkerStateRequest) returns (GetWorkerStateResponse);

  // GetWorkflowInstance is ADMIN-008's governed, read-only execution
  // inspector: it composes internal/workflow/runtime's stored instance and
  // node-execution rows with internal/humanwork/workitem's stored work
  // items and their transitions and renders internal/workflow/inspect's
  // declared traversal (definition -> instance -> node -> governance ->
  // transaction -> connector -> observation -> trace), the instance's five
  // lifecycle dimensions, its frontier, and its work items with their
  // transitions and evidence ids. It touches no runtime table directly -
  // internal/transport/admin composes the two stores' read ports and hands
  // their already-loaded rows to inspect.Build/inspect.BuildWorkItems - and
  // performs no write of any kind. Every reference that is a protected
  // artifact, not operational metadata, is a RefValue carrying either the
  // value or the reason it is withheld, and gap_kind additionally
  // distinguishes a reference nothing ever recorded (UNRECORDED) from one
  // correctly recorded as empty (ABSENT) from one this caller may not see
  // (REDACTED), so an empty governance or work-item reference is never
  // silently indistinguishable from an unrecorded one.
  rpc GetWorkflowInstance(GetWorkflowInstanceRequest) returns (GetWorkflowInstanceResponse);
  rpc ListLedgerEvents(ListLedgerEventsRequest) returns (ListLedgerEventsResponse);
  rpc GetChainVerification(GetChainVerificationRequest) returns (GetChainVerificationResponse);
  rpc SimulateAuthorization(SimulateAuthorizationRequest) returns (SimulateAuthorizationResponse);
  rpc ConfigInspect(ConfigInspectRequest) returns (ConfigInspectResponse);
  rpc ConfigTest(ConfigTestRequest) returns (ConfigTestResponse);
  rpc ConfigRedrive(ConfigRedriveRequest) returns (ConfigRedriveResponse);
  rpc ConfigReconcile(ConfigReconcileRequest) returns (ConfigReconcileResponse);
  rpc ConfigDiff(ConfigDiffRequest) returns (ConfigDiffResponse);
  rpc ConfigSimulate(ConfigSimulateRequest) returns (ConfigSimulateResponse);
  rpc ConfigPromote(ConfigPromoteRequest) returns (ConfigPromoteResponse);
  rpc ConfigRollback(ConfigRollbackRequest) returns (ConfigRollbackResponse);
}

// ListIntentsRequest mirrors hcmnext.intents.v1.ListIntentsRequest (see
// AdminService.ListIntents).
message ListIntentsRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  hcmnext.common.v1.PageRequest page = 2;
  hcmnext.intents.v1.ConsistencyFreshnessHint freshness = 3;
}

// ListIntentsResponse mirrors hcmnext.intents.v1.ListIntentsResponse (see
// AdminService.ListIntents).
message ListIntentsResponse {
  repeated hcmnext.intents.v1.IntentInstance intents = 1;
  hcmnext.common.v1.PageResponse page = 2;
  hcmnext.common.v1.EvidenceRef evidence_ref = 3;
}

// GetReleaseManifestRequest carries no filter: the manifest is one
// compiled-in document for the whole running release.
message GetReleaseManifestRequest {}

// EndpointProfile is one RPC method's discovery row
// (internal/transport/manifest.EndpointDescriptor).
message EndpointProfile {
  string endpoint_id = 1;
  string service_full_name = 2;
  string method_name = 3;
  string owner_domain = 4;
  repeated string capability_refs = 5;
  string request_type = 6;
  string response_type = 7;
  // disposition is one of SERVED, REFUSED_P1A, NOT_EXPOSED
  // (internal/transport/manifest.Disposition).
  string disposition = 8;
  string disposition_reason = 9;
}

// IntentDefinitionProfile is one catalog intent definition's discovery row
// (internal/transport/manifest.IntentDefinitionDescriptor).
message IntentDefinitionProfile {
  string definition_ref = 1;
  string display_name = 2;
  string owner_domain = 3;
}

message GetReleaseManifestResponse {
  // manifest_digest is the EndpointManifest digest this document was
  // rendered from, so a cached copy can detect staleness.
  string manifest_digest = 1;
  repeated EndpointProfile endpoints = 2;
  repeated CapabilityProfile capabilities = 3;
  repeated IntentDefinitionProfile intent_definitions = 4;
  hcmnext.common.v1.EvidenceRef evidence_ref = 5;
}

message ListCapabilityProfilesRequest {}

// CapabilityProfile is one registered capability's audit row
// (internal/capability.Record/Definition).
message CapabilityProfile {
  string capability_id = 1;
  uint32 version = 2;
  string owner_domain = 3;
  // effect_class is one of PURE, READ_ONLY, INTERNAL_MUTATION,
  // EXTERNAL_MUTATION, IRREVERSIBLE_EXTERNAL_MUTATION
  // (internal/capability.EffectClass).
  string effect_class = 4;
  string risk_class = 5;
  // status is one of ACTIVE, DEPRECATED, RETIRED (internal/capability.Status).
  string status = 6;
  bool agent_eligible = 7;
  string digest = 8;
}

message ListCapabilityProfilesResponse {
  repeated CapabilityProfile capabilities = 1;
  hcmnext.common.v1.EvidenceRef evidence_ref = 2;
}

// TransactionRef names one business transaction. The server always resolves
// it to the fixed internal/domains/intelligence.KindTransaction entity kind
// within the request's scoped tenant
// (internal/domains/intelligence.TransactionQuery.Transaction); the caller
// only ever supplies the opaque identifier.
message TransactionRef {
  string id = 1;
}

message ExplainTransactionRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  TransactionRef transaction = 2;
  // sections narrows the projection to the named
  // internal/domains/intelligence.Section tokens (e.g. "REQUEST",
  // "GOVERNANCE", "LIFECYCLE", "WRITE_SET", "EVENTS", "EFFECTS",
  // "OBSERVATIONS", "RECONCILIATION", "REPAIR", "PROJECTIONS", "EVIDENCE").
  // Empty means every section.
  repeated string sections = 3;
  // known_at is the knowledge cut-off; unset means the resolved server time.
  google.protobuf.Timestamp known_at = 4;
}

// SectionResult is one section's disclosure outcome
// (internal/domains/intelligence.SectionDisclosure). It deliberately never
// carries the section's recorded entries themselves - only how many there
// were - because a drift/audit surface travels to logs and tickets without
// the underlying evidence attached to it.
message SectionResult {
  string section = 1;
  // access is one of AUTHORIZED, DENIED (internal/domains/intelligence.Access).
  string access = 2;
  string denial_reason = 3;
  int32 entry_count = 4;
}

message ExplainTransactionResponse {
  bool disclosed = 1;
  // disclosure is one of FULL, PARTIAL, WITHHELD
  // (internal/domains/intelligence.Disclosure).
  string disclosure = 2;
  string withheld_reason = 3;
  // presence is one of PRESENT, ABSENT, or empty when disclosure is
  // WITHHELD (internal/domains/intelligence.Presence). A withheld
  // explanation never reports presence: "not found" and "not yours" must
  // stay indistinguishable.
  string presence = 12;
  repeated SectionResult sections = 4;
  repeated string narrative = 5;
  string policy_version = 6;
  string rule_pack_version = 7;
  string inputs_digest = 8;
  bool complete = 9;
  repeated string redactions = 10;
  hcmnext.common.v1.EvidenceRef evidence_ref = 11;
}

message GetWorkerStateRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string worker_id = 2;
  // effective_on is the business date the facts are asked about, as
  // YYYY-MM-DD (internal/kernel/values.LocalDate).
  string effective_on = 3;
  // known_at is the knowledge cut-off; unset means the resolved server time.
  google.protobuf.Timestamp known_at = 4;
  // fields narrows the projection to the named
  // internal/domains/people.FieldID tokens. Empty means every field.
  repeated string fields = 5;
}

// FieldResult is one field's disclosure outcome
// (internal/domains/people.ExplainedFact).
message FieldResult {
  string field = 1;
  // access is one of AUTHORIZED, DENIED (internal/domains/people.Access).
  string access = 2;
  string denial_reason = 3;
  // presence is one of VALUE, ABSENT, NULL, UNKNOWN, REDACTED, UNAVAILABLE,
  // NOT_APPLICABLE (internal/kernel/values.PresenceState). value is set only
  // when presence is VALUE; a denied field's presence is always REDACTED
  // with no value.
  string presence = 4;
  string value = 5;
}

message GetWorkerStateResponse {
  bool disclosed = 1;
  // disclosure is one of FULL, PARTIAL, WITHHELD
  // (internal/domains/people.Disclosure).
  string disclosure = 2;
  string withheld_reason = 3;
  // presence is one of PRESENT, ABSENT, or empty when disclosure is
  // WITHHELD (internal/domains/people.SubjectPresence). A withheld
  // explanation never reports presence: "not found" and "not yours" must
  // stay indistinguishable.
  string presence = 11;
  repeated FieldResult fields = 4;
  repeated string narrative = 5;
  string policy_version = 6;
  string rule_pack_version = 7;
  string inputs_digest = 8;
  string result_digest = 9;
  hcmnext.common.v1.EvidenceRef evidence_ref = 10;
}

// RefValue is one internal/workflow/inspect.Ref (or, for a list, a
// [RefListValue]) rendered on the wire: which presence state it carries,
// the value only when state is VALUE, the policy or storage reason when it
// is not, and the ADMIN-008 gap_kind classification that closes the "empty
// vs unrecorded vs redacted" ambiguity a bare state/value pair cannot.
message RefValue {
  // state is one of VALUE, ABSENT, REDACTED (internal/kernel/values.PresenceState).
  string state = 1;
  string value = 2;
  string reason = 3;
  // gap_kind is one of "", ABSENT, UNRECORDED, REDACTED
  // (internal/workflow/inspect.GapKind). Empty means state is VALUE.
  string gap_kind = 4;
}

// RefListValue is one internal/workflow/inspect.RefList rendered on the wire.
message RefListValue {
  string state = 1;
  repeated string values = 2;
  string reason = 3;
}

// WorkflowDefinitionProfile is inspect.DefinitionView.
message WorkflowDefinitionProfile {
  bool disclosed = 1;
  string denied_reason = 2;
  string workflow_id = 3;
  uint32 workflow_version = 4;
  string compiled_plan_hash = 5;
}

// LifecycleProfile is inspect.Lifecycle: the instance's five lifecycle
// dimensions, always rendered together and never collapsed into one status.
message LifecycleProfile {
  string request_state = 1;
  string execution_state = 2;
  string business_state = 3;
  string consistency_state = 4;
  string obligation_state = 5;
}

// WorkflowInstanceProfile is inspect.InstanceView.
message WorkflowInstanceProfile {
  bool disclosed = 1;
  string denied_reason = 2;
  string instance_id = 3;
  string cell_id = 4;
  string correlation_id = 5;
  string execution_mode = 6;
  string runtime_status = 7;
  int64 instance_version = 8;
  int64 variable_revision_head = 9;
  LifecycleProfile lifecycle = 10;
  RefValue input_ref = 11;
  RefValue effective_context_ref = 12;
  RefValue last_checkpoint_ref = 13;
  RefListValue business_subject_refs = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp started_at = 16;
  google.protobuf.Timestamp completed_at = 17;
}

// FrontierEntryProfile is inspect.FrontierEntry: one node the instance is
// currently at. attempt_recorded false means the frontier names a node no
// execution row covers - a gap, not a blank.
message FrontierEntryProfile {
  string node_id = 1;
  bool attempt_recorded = 2;
  int32 attempt = 3;
  string status = 4;
  string step_type = 5;
}

// GovernanceProfile is inspect.GovernanceView.
message GovernanceProfile {
  bool disclosed = 1;
  string denied_reason = 2;
  RefValue authorization_decision_id = 3;
  RefValue decision_id = 4;
  RefValue policy_ref = 5;
  RefValue proposal_ref = 6;
  RefValue baseline_ref = 7;
  RefValue human_task_id = 8;
  RefValue agent_execution_id = 9;
}

// TransactionProfile is inspect.TransactionView.
message TransactionProfile {
  bool disclosed = 1;
  string denied_reason = 2;
  RefValue business_transaction_id = 3;
}

// ConnectorProfile is inspect.ConnectorView.
message ConnectorProfile {
  bool disclosed = 1;
  string denied_reason = 2;
  RefValue capability_execution_id = 3;
  RefListValue effect_refs = 4;
}

// ObservationProfile is inspect.ObservationView.
message ObservationProfile {
  bool disclosed = 1;
  string denied_reason = 2;
  RefValue error_class = 3;
  RefValue repair_ref = 4;
}

// TraceProfile is inspect.TraceView.
message TraceProfile {
  bool disclosed = 1;
  string denied_reason = 2;
  RefValue trace_id = 3;
}

// NodeProfile is inspect.NodeView: one recorded node-execution attempt and
// the four stages that hang off it.
message NodeProfile {
  string node_id = 1;
  int32 attempt = 2;
  string step_type = 3;
  string status = 4;
  // current reports whether this attempt is on the instance's frontier.
  bool current = 5;
  RefValue retry_policy_ref = 6;
  RefValue input_snapshot_ref = 7;
  RefValue output_artifact_ref = 8;
  GovernanceProfile governance = 9;
  TransactionProfile transaction = 10;
  ConnectorProfile connector = 11;
  ObservationProfile observation = 12;
  TraceProfile trace = 13;
  google.protobuf.Timestamp started_at = 14;
  google.protobuf.Timestamp completed_at = 15;
  google.protobuf.Timestamp recorded_at = 16;
}

// WorkItemTransitionProfile is inspect.TransitionView: one immutable
// work_item_transition row.
message WorkItemTransitionProfile {
  string transition_id = 1;
  int64 item_version = 2;
  string from_status = 3;
  string to_status = 4;
  string actor_principal_id = 5;
  string reason = 6;
  string detail = 7;
  RefValue evidence_ref = 8;
  google.protobuf.Timestamp at = 9;
  google.protobuf.Timestamp recorded_at = 10;
}

// WorkItemProfile is inspect.WorkItemView: one work item the instance's
// frontier created, plus its whole transition chronology.
// transitions_recorded false means the item loaded with zero transitions,
// which internal/humanwork/workitem.Store.Create never allows to happen
// honestly - a gap, named in the response's own gaps list.
message WorkItemProfile {
  string work_item_id = 1;
  int64 item_version = 2;
  // kind is one of APPROVAL, TASK (internal/humanwork/workitem.Kind).
  string kind = 3;
  string work_type = 4;
  string status = 5;
  string correlation_id = 6;
  string node_id = 7;
  RefValue approval_requirement_ref = 8;
  RefValue proposal_ref = 9;
  RefListValue subject_refs = 10;
  string owner_kind = 11;
  string owner_ref = 12;
  string policy_route_ref = 13;
  string visibility = 14;
  google.protobuf.Timestamp deadline_at = 15;
  string claimed_by = 16;
  string completed_by = 17;
  RefValue completed_output_digest = 18;
  google.protobuf.Timestamp created_at = 19;
  repeated WorkItemTransitionProfile transitions = 20;
  bool transitions_recorded = 21;
}

message GetWorkflowInstanceRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string instance_id = 2;
}

message GetWorkflowInstanceResponse {
  // disclosed reports whether the caller may learn that this instance
  // exists at all (inspect.Authorization.InstanceDisclosable). False means
  // every other field below is unset: a caller who may not know the
  // instance exists must not be able to infer it from a pattern of
  // populated-but-denied sections.
  bool disclosed = 1;
  string denial_reason = 2;
  WorkflowDefinitionProfile definition = 3;
  WorkflowInstanceProfile instance = 4;
  repeated FrontierEntryProfile frontier = 5;
  repeated NodeProfile nodes = 6;
  bool work_items_disclosed = 7;
  string work_items_denied_reason = 8;
  repeated WorkItemProfile work_items = 9;
  // complete is true only when nothing was denied and nothing was missing
  // across both the traversal and the work-item section
  // (inspect.Completeness.Complete, conjoined).
  bool complete = 10;
  repeated string redactions = 11;
  repeated string gaps = 12;
  hcmnext.common.v1.EvidenceRef evidence_ref = 13;
  repeated DurableRecordFamilyProfile durable_records = 14;
}

// DurableRecordFamilyProfile is one durable-family manifest line returned by inspect.Load.
message DurableRecordFamilyProfile {
  string family = 1;
  string section = 2;
  string state = 3;
  int32 count = 4;
  string reason = 5;
}

// ListLedgerEventsRequest selects one tenant stream for the operator.
// tenant_id is the ledger tenant UUID string; stream_key names the stream.
message ListLedgerEventsRequest {
  string tenant_id = 1;
  string stream_key = 2;
}

// LedgerEventProfile is one ledger event as the operator may see it. The
// payload and authority fields are already redacted by
// internal/operations/explorer for the caller's decision: payload_withheld
// and subject_withheld carry the typed unavailable states, so an empty
// payload can never be mistaken for an event with no payload.
message LedgerEventProfile {
  string tenant_id = 1;
  string stream_key = 2;
  int64 sequence = 3;
  string event_id = 4;
  string assertion_class = 5;
  string schema_ref = 6;
  string digest = 7;
  string digest_algorithm = 8;
  google.protobuf.Timestamp occurred_at = 9;
  google.protobuf.Timestamp effective_at = 10;
  google.protobuf.Timestamp recorded_at = 11;
  string correlation_id = 12;
  string idempotency_key = 13;
  string authority = 14;
  string source_ref = 15;
  bytes payload = 16;
  string artifact_ref = 17;
  bool payload_withheld = 18;
  bool subject_withheld = 19;
}

message ListLedgerEventsResponse {
  repeated LedgerEventProfile events = 1;
  string digest = 2;
  hcmnext.common.v1.EvidenceRef evidence_ref = 3;
}

// GetChainVerificationRequest asks the explorer to replay one stream's
// hash chain from genesis to head.
message GetChainVerificationRequest {
  string tenant_id = 1;
  string stream_key = 2;
}

message ChainHeadProfile {
  string stream_key = 1;
  int64 sequence = 2;
  string chain_hash = 3;
  string algorithm = 4;
}

message GetChainVerificationResponse {
  string stream_key = 1;
  bool verified = 2;
  ChainHeadProfile head = 3;
  bool empty = 4;
  string broken_sequence = 5;
  string broken_reason = 6;
  hcmnext.common.v1.EvidenceRef evidence_ref = 7;
}

// SimulateAuthorizationRequest asks what the caller's own principal may do
// with one subject. The principal always comes from the caller's credential:
// the request only names the subject, the purpose, the fields and the policy
// version label it is simulated against.
message SimulateAuthorizationRequest {
  string subject_tenant_id = 1;
  string subject_kind = 2;
  string subject_id = 3;
  string purpose = 4;
  repeated string fields = 5;
  string policy_version = 6;
}

message SimulateAuthorizationResponse {
  bool subject_disclosable = 1;
  string denial_reason = 2;
  string tenant_effect = 3;
  string scope_effect = 4;
  map<string, string> field_rulings = 5;
  repeated string matched_rules = 6;
  bool policy_version_match = 7;
  string explanation = 8;
  string digest = 9;
  hcmnext.common.v1.EvidenceRef evidence_ref = 10;
}

// ConfigDependency pins one component a config bundle was compiled against.
message ConfigDependency {
  string kind = 1;
  string name = 2;
  string version = 3;
  string digest = 4;
}

// ConfigBundle is one immutable, scope-bound configuration bundle.
message ConfigBundle {
  string bundle_id = 1;
  uint32 manifest_version = 2;
  repeated ConfigDependency dependencies = 3;
  string compatibility_range = 4;
  string signer = 5;
  string provenance = 6;
  repeated string credential_refs = 7;
  string target_scope = 8;
  string minimum_runtime_version = 9;
}

message ConfigSignedBundle {
  ConfigBundle bundle = 1;
  string digest = 2;
  string signer_key_id = 3;
  string signature = 4;
}

// ConfigPackage is one promotable unit: a signed bundle for one
// environment plus the key that authorizes it.
message ConfigPackage {
  string id = 1;
  string environment = 2;
  ConfigSignedBundle bundle = 3;
  bytes public_key = 4;
}

// ConfigRecordProfile is one promotion record as the operator may see it.
message ConfigRecordProfile {
  string id = 1;
  string environment = 2;
  string status = 3;
  string digest = 4;
  bool validated = 5;
  bool simulated = 6;
  bool approved = 7;
  string approver = 8;
  string rollback_to = 9;
  string evidence_digest = 10;
}

message ConfigInspectRequest {
  string id = 1;
  string environment = 2;
}

message ConfigInspectResponse {
  repeated ConfigRecordProfile records = 1;
  hcmnext.common.v1.EvidenceRef evidence_ref = 2;
}

message ConfigTestRequest {
  ConfigPackage package = 1;
}

message ConfigTestResponse {
  string package_id = 1;
  string digest = 2;
  bool compatible = 3;
  hcmnext.common.v1.EvidenceRef evidence_ref = 4;
}

message ConfigRedriveRequest {
  string id = 1;
}

message ConfigRedriveResponse {
  string package_id = 1;
  string digest = 2;
  bool passed = 3;
  hcmnext.common.v1.EvidenceRef evidence_ref = 4;
}

// ConfigSnapshotEntry is one configuration entry. Secret entries carry a
// fingerprint instead of a value: raw secret material never crosses this
// surface.
message ConfigSnapshotEntry {
  string key = 1;
  string kind = 2;
  string value = 3;
  bool explicit = 4;
  string semantic = 5;
  string secret_fingerprint = 6;
  repeated string ref_capabilities = 7;
  repeated string ref_workflows = 8;
  repeated string ref_tenants = 9;
}

message ConfigSnapshot {
  string name = 1;
  string version = 2;
  repeated ConfigSnapshotEntry entries = 3;
}

message ConfigDiffRequest {
  ConfigSnapshot before = 1;
  ConfigSnapshot after = 2;
}

message ConfigDiffChange {
  string key = 1;
  string kind = 2;
  string compatibility = 3;
  string before_value = 4;
  string after_value = 5;
  bool secret_fingerprint_changed = 6;
  repeated string impacted_capabilities = 7;
  repeated string impacted_workflows = 8;
  repeated string impacted_tenants = 9;
}

message ConfigDiffResponse {
  repeated ConfigDiffChange added = 1;
  repeated ConfigDiffChange removed = 2;
  repeated ConfigDiffChange changed = 3;
  string digest = 4;
  hcmnext.common.v1.EvidenceRef evidence_ref = 5;
}

message ConfigReconcileRequest {
  string environment = 1;
  ConfigSnapshot live = 2;
  ConfigSnapshot desired = 3;
}

message ConfigReconcileResponse {
  string environment = 1;
  bool in_sync = 2;
