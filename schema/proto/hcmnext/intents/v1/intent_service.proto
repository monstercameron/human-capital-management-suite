syntax = "proto3";

package hcmnext.intents.v1;

option go_package = "github.com/monstercameron/human-capital-management-suite/gen/go/hcmnext/intents/v1;intentsv1";

import "google/protobuf/timestamp.proto";
import "hcmnext/common/v1/common.proto";
import "hcmnext/intents/v1/business_intent.proto";

// ConsistencyFreshnessHint lets a caller state its tolerance for reading a
// bounded-stale or eventually-consistent replica instead of the strongly
// consistent primary. It is a hint the server may ignore; it never grants
// authority the caller does not otherwise have.
enum ConsistencyFreshnessHint {
  CONSISTENCY_FRESHNESS_HINT_UNSPECIFIED = 0;
  CONSISTENCY_FRESHNESS_HINT_STRONG = 1;
  CONSISTENCY_FRESHNESS_HINT_BOUNDED_STALE = 2;
  CONSISTENCY_FRESHNESS_HINT_EVENTUAL = 3;
}

// PlannedWrite is one typed domain write a SimulateIntent call determined it
// would perform, without performing it.
message PlannedWrite {
  string target_ref = 1;
  string operation = 2;
  hcmnext.common.v1.EvidenceRef evidence_ref = 3;
}

// PlannedEffect is one typed external effect a SimulateIntent call
// determined it would cause, without causing it.
message PlannedEffect {
  string effect_kind = 1;
  string target_ref = 2;
  string description = 3;
}

// Finding is one simulation-time diagnostic (policy result, validation
// outcome, warning) surfaced to the caller.
message Finding {
  string code = 1;
  string message = 2;
  string severity = 3;
}

// UncertaintyNote records one dimension along which the simulation result is
// not fully certain (e.g. a dependency answered with stale data).
message UncertaintyNote {
  string dimension = 1;
  string description = 2;
}

// ZeroEffectReceipt is returned when simulation determines the proposal
// would cause no material write or effect, so the caller can distinguish
// "simulated and found to do nothing" from "not simulated".
message ZeroEffectReceipt {
  bool zero_effect = 1;
  string reason_ref = 2;
}

// SimulationArtifact is the immutable, no-effect result of SimulateIntent:
// the full set of planned writes/effects, findings, uncertainty and the
// material proposal digest that a subsequent SubmitIntent/approval binds.
message SimulationArtifact {
  string intent_id = 1;
  string proposal_revision_id = 2;
  CanonicalDigestReference material_proposal_digest = 3;
  repeated PlannedWrite planned_writes = 4;
  repeated PlannedEffect planned_effects = 5;
  repeated Finding findings = 6;
  repeated UncertaintyNote uncertainty = 7;
  ZeroEffectReceipt zero_effect_receipt = 8;
}

message CreateIntentRequest {
  string idempotency_key = 1;
  hcmnext.common.v1.ScopeContext scope = 2;
  DefinitionReference definition = 3;
  PrincipalReference initiator = 4;
  repeated SubjectReference subjects = 5;
  TypedPayload request = 6;
  ExecutionMode execution_mode = 7;
  optional string parent_intent_id = 8;
  optional string origin_event_ref = 9;
}

message CreateIntentResponse {
  IntentInstance intent = 1;
}

message GetIntentRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
  ConsistencyFreshnessHint freshness = 3;
}

message GetIntentResponse {
  IntentInstance intent = 1;
}

message ListIntentsRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  hcmnext.common.v1.PageRequest page = 2;
  ConsistencyFreshnessHint freshness = 3;
}

message ListIntentsResponse {
  repeated IntentInstance intents = 1;
  hcmnext.common.v1.PageResponse page = 2;
}

message SimulateIntentRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
  uint64 expected_instance_version = 3;
  TypedPayload proposal = 4;
}

message SimulateIntentResponse {
  SimulationArtifact simulation = 1;
}

// ProposalApproval names the immutable proposal revision an ExecuteIntent
// call presents as approved, and the evidence that approval rests on. It
// mirrors the caller-driven workflow driver's own ProposalBinding shape
// (revision plus approved/approval_ref) so a wire caller states the exact
// same three facts a Go caller of that driver states: which revision, that
// it was approved, and by what recorded decision. ExecuteIntent never
// derives approval from approved alone — it also requires proposal_revision_id
// and material_proposal_digest to match the revision this cell would itself
// (re)compute for the named intent right now, so a caller cannot assert
// approval over content the server never actually simulated.
message ProposalApproval {
  string proposal_revision_id = 1;
  CanonicalDigestReference material_proposal_digest = 2;
  bool approved = 3;
  string approval_ref = 4;
}

// ParkedContinuation names one durable scheduling record (a
// frontier.IntentKind persisted by internal/workflow/runtime) that a parked
// workflow instance is waiting to have satisfied: WORK_ITEM_REQUIRED,
// SIGNAL_SUBSCRIPTION_REQUIRED or TIMER_REQUIRED. It never names a work item
// (see ExecutionReceipt.work_items below): a continuation is the scheduling
// fact, a work item is the durable human-work row a WORK_ITEM_REQUIRED
// continuation may have raised, and WF-RUN-032 exists because those two
// facts were previously conflated on the wire.
message ParkedContinuation {
  string continuation_id = 1;
  string kind = 2;
  string target_node_id = 3;
}

// ParkedWorkItem names one durable WorkItem (internal/humanwork/workitem) a
// parked workflow instance raised, separately from the continuation record
// that raised it.
message ParkedWorkItem {
  string work_item_id = 1;
  string kind = 2;
  string node_id = 3;
}

// ExecutionReceiptStatus distinguishes execution from read-only START recovery.
enum ExecutionReceiptStatus {
  EXECUTION_RECEIPT_STATUS_UNSPECIFIED = 0;
  EXECUTION_RECEIPT_STATUS_PARKED = 1;
  EXECUTION_RECEIPT_STATUS_COMPLETE = 2;
  EXECUTION_RECEIPT_STATUS_RESOLVED = 3;
}

// ResolvedStartState proves a START committed and reports current durable
// state. It neither reconstructs the original receipt nor authorizes replay.
message ResolvedStartState {
  // Canonical runtime status ID. Kept separate from lifecycle dimensions;
  // importing the workflow package here would create a package import cycle.
  string runtime_status = 1;
  repeated string current_node_ids = 2;
  string workflow_id = 3;
  uint32 workflow_version = 4;
  string compiled_plan_digest = 5;
  string semantic_version = 6;
  // Lifecycle dimensions remain distinct from the runtime status.
  LifecycleDimensions lifecycle = 7;
}

// ExecutionReceipt reports execution or read-only recovery of a committed
// START. RESOLVED does not claim that this call ran nodes or completed work.
message ExecutionReceipt {
  string instance_id = 1;
  repeated string visited_nodes = 2;
  // parked_continuations is retained for wire compatibility but deprecated:
  // WF-RUN-032 found it named work-item ids under a continuation name.
  // parked_continuation_refs and work_items below are its typed replacement.
  repeated string parked_continuations = 3 [deprecated = true];
  uint64 instance_version = 4;
  string receipt_digest = 5;
  // parked_continuation_refs names the continuation(s) (kind, target node)
  // the instance is waiting on. Empty when the instance completed.
  repeated ParkedContinuation parked_continuation_refs = 6;
  // work_items names the durable WorkItem(s) a WORK_ITEM_REQUIRED
  // continuation raised. Empty when the instance completed or is parked on a
  // continuation kind that raises no work item.
  repeated ParkedWorkItem work_items = 7;
  ExecutionReceiptStatus status = 8;
  // Present only for RESOLVED; visited nodes and newly created work are empty.
  ResolvedStartState resolved_start = 9;
}

message ExecuteIntentRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
  uint64 expected_instance_version = 3;
  ProposalApproval approval = 4;
  string idempotency_key = 5;
}

message ExecuteIntentResponse {
  ExecutionReceipt execution = 1;
}

message SubmitIntentRequest {
  string idempotency_key = 1;
  hcmnext.common.v1.ScopeContext scope = 2;
  string intent_id = 3;
  string proposal_revision_id = 4;
  uint64 expected_instance_version = 5;
}

message SubmitIntentResponse {
  IntentInstance intent = 1;
}

message CancelIntentRequest {
  string idempotency_key = 1;
  hcmnext.common.v1.ScopeContext scope = 2;
  string intent_id = 3;
  uint64 expected_instance_version = 4;
  string reason_ref = 5;
}

message CancelIntentResponse {
  IntentInstance intent = 1;
}

message SupersedeIntentRequest {
  string idempotency_key = 1;
  hcmnext.common.v1.ScopeContext scope = 2;
  string superseded_intent_id = 3;
  uint64 expected_instance_version = 4;
  DefinitionReference definition = 5;
  TypedPayload request = 6;
  string reason_ref = 7;
}

message SupersedeIntentResponse {
  IntentInstance superseding_intent = 1;
}

message ExplainIntentRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
  string purpose = 3;
}

message ExplainIntentResponse {
  string intent_id = 1;
  repeated hcmnext.common.v1.EvidenceRef evidence_refs = 2;
  string explanation_text = 3;
}

// TimelineEvent is one stable, redacted entry in an intent's business
// chronology.
message TimelineEvent {
  string event_id = 1;
  string kind = 2;
  google.protobuf.Timestamp occurred_at = 3;
  string description = 4;
  hcmnext.common.v1.EvidenceRef evidence_ref = 5;
}

message ListIntentTimelineRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
  hcmnext.common.v1.PageRequest page = 3;
}

message ListIntentTimelineResponse {
  repeated TimelineEvent events = 1;
  hcmnext.common.v1.PageResponse page = 2;
}

// AnalysisWatermark pins one source release an analytical result cites. A
// version without a digest is not reproducible evidence.
message AnalysisWatermark {
  string source_ref = 1;
  string version = 2;
  string digest = 3;
  google.protobuf.Timestamp observed = 4;
}

// AnalysisEvidenceRef is a selected, redaction-safe reference to analytical
// evidence. It carries lineage metadata rather than a result value, so a
// recommendation cannot smuggle an unauthorized field into a proposed action.
message AnalysisEvidenceRef {
  string id = 1;
  string source_ref = 2;
  string transformation_ref = 3;
  string authority_ref = 4;
  string field_path = 5;
  string digest = 6;
  google.protobuf.Timestamp observed = 7;
  string required_authority_ref = 8;
  bool restricted = 9;
}

// AnalysisUncertainty makes a result's limitations explicit instead of
// allowing it to be mistaken for an authoritative fact.
message AnalysisUncertainty {
  string class = 1;
  string confidence = 2;
  repeated string limitations = 3;
}

// AnalyticalResult is the metadata-and-artifact envelope an analysis
// produces. It carries lineage, never raw values. The authorization digest
// is left empty on the wire: the server mints the authorization snapshot
// from the verified principal and binds it here, so a caller cannot assert
// its own authority past the route.
message AnalyticalResult {
  string result_id = 1;
  string request_id = 2;
  string tenant_id = 3;
  string organization_id = 4;
  string purpose = 5;
  string definition_ref = 6;
  string query_ref = 7;
  string query_version = 8;
  string query_digest = 9;
  string cohort_ref = 10;
  string cohort_version = 11;
  string cohort_digest = 12;
  string model_ref = 13;
  string model_version = 14;
  string model_digest = 15;
  string artifact_ref = 16;
  repeated AnalysisWatermark source_watermarks = 17;
  repeated AnalysisEvidenceRef evidence = 18;
  AnalysisUncertainty uncertainty = 19;
  google.protobuf.Timestamp generated_at = 20;
  google.protobuf.Timestamp valid_until = 21;
  string digest = 22;
  // authorization_digest must arrive empty: the route mints the
  // authorization snapshot from the verified principal and binds the
  // presented result to it (the wire analog of SourceResult's stamp), so a
  // client-sent citation is refused rather than honored — no served route
  // exposes the registry digest a caller would need to cite legitimately.
  string authorization_digest = 23;
}

// RecommendedActionSpec identifies the deterministic action capability a
// human or workflow may later decide to use. It is not an invocation and
// carries no effect payload.
message RecommendedActionSpec {
  string definition_ref = 1;
  string capability_ref = 2;
  string input_digest = 3;
}

// RecommendationPopulation is the immutable, authorized population snapshot
// for a proposed action. A count alone is not an authorization proof; the
// snapshot digest is required.
message RecommendationPopulation {
  string tenant_id = 1;
  string ref = 2;
  string version = 3;
  string digest = 4;
  bool authorized = 5;
}

// RecommendationCausalLink states how the analysis relates to the proposed
// action. It never upgrades descriptive or predictive evidence into a
// causal fact.
message RecommendationCausalLink {
  string kind = 1;
  string basis = 2;
  repeated string evidence_ids = 3;
  repeated string confounders = 4;
  repeated string limitations = 5;
}

// RecommendationGovernance is the fresh, scope-bound decision needed before
// a recommendation becomes a proposal.
message RecommendationGovernance {
  string decision_ref = 1;
  string decision_digest = 2;
  string state = 3;
  string scope_digest = 4;
  string purpose = 5;
  google.protobuf.Timestamp evaluated_at = 6;
  google.protobuf.Timestamp valid_until = 7;
}

// RecommendationSimulation is the fresh simulation result bound to the
// exact action input digest.
message RecommendationSimulation {
  string simulation_ref = 1;
  string simulation_digest = 2;
  string action_input_digest = 3;
  string status = 4;
  google.protobuf.Timestamp evaluated_at = 5;
  google.protobuf.Timestamp valid_until = 6;
}

message RecommendIntentActionRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string tenant_id = 2;
  string organization_id = 3;
  string purpose = 4;
  AnalyticalResult analysis = 5;
  RecommendedActionSpec action = 6;
  repeated string selected_evidence_ids = 7;
  RecommendationPopulation population = 8;
  RecommendationCausalLink causal_link = 9;
  RecommendationGovernance governance = 10;
  RecommendationSimulation simulation = 11;
}

// RecommendedActionEvidence is one lineage reference the proposal carries.
message RecommendedActionEvidence {
  string id = 1;
  string source_ref = 2;
  string transformation_ref = 3;
  string authority_ref = 4;
  string field_path = 5;
  string digest = 6;
  google.protobuf.Timestamp observed = 7;
}

message RecommendIntentActionResponse {
  string proposal_id = 1;
  string status = 2;
  string family = 3;
  string tenant_id = 4;
  string organization_id = 5;
  RecommendedActionSpec action = 6;
  string analysis_id = 7;
  string analysis_digest = 8;
  repeated RecommendedActionEvidence selected_evidence = 9;
  string governance_state = 10;
  string simulation_status = 11;
  bool execution_authority = 12;
  string digest = 13;
  string explanation = 14;
}

message GetIntentDeepLinkRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
}

message GetIntentDeepLinkResponse {
  string intent_id = 1;
  string link_token = 2;
}

message InspectIntentFieldsRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
}

message InspectedIntentField {
  string name = 1;
  string value = 2;
  bool restricted = 3;
}

message InspectIntentFieldsResponse {
  string intent_id = 1;
  uint64 revision = 2;
  repeated InspectedIntentField fields = 3;
  string revision_digest = 4;
}

message ExportIntentFieldsRequest {
  hcmnext.common.v1.ScopeContext scope = 1;
  string intent_id = 2;
  string purpose = 3;
}

message ExportIntentFieldsResponse {
  string intent_id = 1;
  string purpose = 2;
  uint64 revision = 3;
  map<string, string> fields = 4;
  string revision_digest = 5;
}

// IntentService is the BusinessIntent lifecycle surface: create, read,
// simulate, submit, cancel, supersede, explain and inspect the timeline of
// one BusinessIntent instance, across all three kernel families, plus the
// governed analysis-to-action and intent-inspection reads (recommend a draft
// action proposal from an analytical result; deep-link, inspect and export
// the authority-filtered field set). See
// planning/specs/http-grpc-endpoint-contract.md#initial-endpoint-inventory.
service IntentService {
  rpc CreateIntent(CreateIntentRequest) returns (CreateIntentResponse);
  rpc GetIntent(GetIntentRequest) returns (GetIntentResponse);
  rpc ListIntents(ListIntentsRequest) returns (ListIntentsResponse);
  rpc SimulateIntent(SimulateIntentRequest) returns (SimulateIntentResponse);
  rpc ExecuteIntent(ExecuteIntentRequest) returns (ExecuteIntentResponse);
  rpc SubmitIntent(SubmitIntentRequest) returns (SubmitIntentResponse);
  rpc CancelIntent(CancelIntentRequest) returns (CancelIntentResponse);
  rpc SupersedeIntent(SupersedeIntentRequest) returns (SupersedeIntentResponse);
  rpc ExplainIntent(ExplainIntentRequest) returns (ExplainIntentResponse);
  rpc ListIntentTimeline(ListIntentTimelineRequest) returns (ListIntentTimelineResponse);
  rpc RecommendIntentAction(RecommendIntentActionRequest) returns (RecommendIntentActionResponse);
  rpc GetIntentDeepLink(GetIntentDeepLinkRequest) returns (GetIntentDeepLinkResponse);
  rpc InspectIntentFields(InspectIntentFieldsRequest) returns (InspectIntentFieldsResponse);
  rpc ExportIntentFields(ExportIntentFieldsRequest) returns (ExportIntentFieldsResponse);
}
