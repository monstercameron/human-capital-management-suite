syntax = "proto3";

package hcmnext.common.v1;

option go_package = "github.com/monstercameron/human-capital-management-suite/gen/go/hcmnext/common/v1;commonv1";

import "google/protobuf/timestamp.proto";

// EntityRef identifies one entity of a declared kind within one tenant.
// Identifiers are opaque canonical IDs; display names are never used as keys.
message EntityRef {
  string tenant_id = 1;
  string kind = 2;
  string id = 3;
}

// ResourceKey identifies an addressable resource for revision, conflict and
// ordering purposes without exposing a display name as the key.
message ResourceKey {
  string resource_type = 1;
  string tenant_id = 2;
  string organization_scope_id = 3;
  bytes key_bytes = 4;
  string ordering_class = 5;
  uint32 ordering_version = 6;
}

// RevisionToken binds an entity to a monotonic revision or opaque
// compare-and-swap token issued by one source authority/epoch.
message RevisionToken {
  EntityRef entity = 1;
  uint64 revision = 2;
  bytes opaque_cas_bytes = 3;
  string source_authority_id = 4;
  uint64 epoch = 5;
  google.protobuf.Timestamp issued_at = 6;
}

// Presence distinguishes why a value is not a concrete VALUE. Zero is
// reserved for PRESENCE_UNSPECIFIED, which is never a valid wire assertion.
enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ABSENT = 1;
  PRESENCE_NULL = 2;
  PRESENCE_UNKNOWN = 3;
  PRESENCE_REDACTED = 4;
  PRESENCE_UNAVAILABLE = 5;
  PRESENCE_NOT_APPLICABLE = 6;
  PRESENCE_VALUE = 7;
}

// DecimalSign carries the sign of a Decimal separately from its unscaled
// magnitude so that zero never requires a spurious negative encoding.
enum DecimalSign {
  DECIMAL_SIGN_UNSPECIFIED = 0;
  DECIMAL_SIGN_ZERO = 1;
  DECIMAL_SIGN_POSITIVE = 2;
  DECIMAL_SIGN_NEGATIVE = 3;
}

// Decimal is a fixed-point value: sign, big-endian unsigned magnitude bytes,
// and a base-10 scale. There is no float/double representation anywhere in
// this schema; NaN, infinity and negative zero are not representable.
message Decimal {
  DecimalSign sign = 1;
  bytes unscaled_magnitude = 2;
  int32 scale = 3;
}

// Money is a Decimal amount plus an uppercase ISO-4217 currency code.
message Money {
  Decimal amount = 1;
  string currency_code = 2;
}

// LocalDate is a civil date with an explicit governing calendar. It never
// silently converts to a UTC instant.
message LocalDate {
  int32 year = 1;
  int32 month = 2;
  int32 day = 3;
  string calendar_ref = 4;
}

// DisambiguationRule resolves a local civil time that falls in a DST gap or
// fold when a LocalDate boundary is projected onto an instant.
enum DisambiguationRule {
  DISAMBIGUATION_RULE_UNSPECIFIED = 0;
  DISAMBIGUATION_RULE_EARLIER = 1;
  DISAMBIGUATION_RULE_LATER = 2;
  DISAMBIGUATION_RULE_REJECT = 3;
}

// TimePoint is either an absolute instant or a local civil date. Exactly one
// of the two fields is populated, matching the EffectiveTimeRange kind.
message TimePoint {
  oneof point {
    google.protobuf.Timestamp instant = 1;
    LocalDate local_date = 2;
  }
}

// EffectiveTimeRangeKind selects whether an EffectiveTimeRange boundary is an
// absolute instant or a local civil date.
enum EffectiveTimeRangeKind {
  EFFECTIVE_TIME_RANGE_KIND_UNSPECIFIED = 0;
  EFFECTIVE_TIME_RANGE_KIND_INSTANT = 1;
  EFFECTIVE_TIME_RANGE_KIND_LOCAL_DATE = 2;
}

// EffectiveTimeRange is the one shared temporal boundary primitive used by
// every domain that models authority, employment, compensation, eligibility,
// retention, conflict or reservation. Ranges are half-open [start, end) and
// may be open-ended only by omitting end_exclusive.
message EffectiveTimeRange {
  EffectiveTimeRangeKind kind = 1;
  TimePoint start_inclusive = 2;
  TimePoint end_exclusive = 3;
  string timezone = 4;
  string tzdb_version = 5;
  string calendar_ref = 6;
  DisambiguationRule disambiguation = 7;
}

// ScopeContext carries the trusted tenant/organization/purpose scope used to
// authorize and filter a request. It is never populated from an untrusted
// caller-controlled field of the same name.
message ScopeContext {
  string tenant_id = 1;
  string organization_scope_id = 2;
  string purpose = 3;
}

// PageRequest is a bounded page-size request paired with an opaque cursor.
// Offset pagination is not used for mutable authoritative collections.
message PageRequest {
  int32 page_size = 1;
  string cursor = 2;
}

// PageResponse returns the opaque cursor for the next page, empty when there
// is no further page. The cursor is an opaque signed string, never a raw
// offset or ordinal.
message PageResponse {
  string next_cursor = 1;
}

// VersionRef pins one version of a named schema, definition or profile.
message VersionRef {
  string schema_id = 1;
  uint32 version = 2;
}

// EvidenceRef points at one durable evidence record without embedding its
// content inline.
message EvidenceRef {
  string evidence_id = 1;
  string evidence_kind = 2;
  string digest = 3;
}

// InterventionOutcome is the shared, closed disposition a governed
// intent- or workflow-level intervention (edit, supersede, withdraw,
// cancel, pause, resume, retry, ...) resolves to. It exists so that
// different governed-write surfaces report the same finite outcome
// vocabulary rather than each inventing its own: PROMOUX-013's journey
// interventions use it today, and EP-WF-002's workflow interventions
// (pause/resume/cancel/retry) are designed to adopt it rather than publish
// a second, parallel vocabulary for the same four-way (plus denial)
// question of what an intervention actually did.
enum InterventionOutcome {
  INTERVENTION_OUTCOME_UNSPECIFIED = 0;
  // INTERVENTION_OUTCOME_APPLIED: the intervention's effect is durable now.
  INTERVENTION_OUTCOME_APPLIED = 1;
  // INTERVENTION_OUTCOME_PENDING_SAFE_POINT: nothing durable moved yet; the
  // runtime has not reached a point where this intervention can be decided.
  INTERVENTION_OUTCOME_PENDING_SAFE_POINT = 2;
  // INTERVENTION_OUTCOME_DENIED: the caller is not authorized to request
  // this intervention.
  INTERVENTION_OUTCOME_DENIED = 3;
  // INTERVENTION_OUTCOME_TOO_LATE: the underlying effect already committed;
  // the intervention cannot reverse it.
  INTERVENTION_OUTCOME_TOO_LATE = 4;
  // INTERVENTION_OUTCOME_REPAIR_REQUIRED: neither cleanly applied nor
  // cleanly refused; governed repair is required to reach a consistent
  // terminal state.
  INTERVENTION_OUTCOME_REPAIR_REQUIRED = 5;
}

// ErrorCode is the canonical owned error condition. Transport status codes
// (gRPC status, HTTP status) are projections of this value, never the source
// of truth. See planning/specs/http-grpc-endpoint-contract.md canonical error
// projection table.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_ALREADY_EXISTS = 5;
  ERROR_CODE_ABORTED = 6;
  ERROR_CODE_FAILED_PRECONDITION = 7;
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  ERROR_CODE_DEADLINE_EXCEEDED = 9;
  ERROR_CODE_UNAVAILABLE = 10;
}

// FieldViolation reports one safe, non-sensitive field-level rejection
// reason.
message FieldViolation {
  string field_path = 1;
  string description = 2;
  string rule_ref = 3;
}

// ErrorDetail is the canonical typed error payload carried alongside every
// transport failure. It never carries a raw stack trace, SQL, policy source
// or secret value.
message ErrorDetail {
  ErrorCode code = 1;
  repeated FieldViolation field_violations = 2;
  bool retryable = 3;
  string correlation_id = 4;
  EvidenceRef evidence_ref = 5;
  // reason_ref is the stable owned reason identifier (for example
  // `structural.request_rejected`); never free text.
  string reason_ref = 6;
}
