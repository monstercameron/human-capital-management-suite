<!DOCTYPE html>
<html lang="en-US" dir="ltr">
<head><meta charset="utf-8"><title>Guide</title><style>.doc-wrap{max-width:56rem;margin:0 auto;padding:1rem}.doc-field{display:block;margin:1rem 0}.doc-field textarea{width:100%;min-height:16rem}.doc-error{color:#7a1f1f}.doc-conflict{border:0.125rem solid #7a1f1f;padding:1rem;margin:1rem 0}.doc-compare{display:grid;grid-template-columns:1fr 1fr;gap:1rem}@media (max-width:40rem){.doc-compare{grid-template-columns:1fr}}label{font-weight:700}:focus-visible{outline:0.1875rem solid #1a56db;outline-offset:0.125rem}@media (prefers-reduced-motion:reduce){*{animation:none;transition:none}}</style></head>
<body><div class="doc-wrap">
<h1>Insert a document link: Guide</h1>
<form method="post" action="/docs/links">
<label class="doc-field" for="target-doc">Target document</label>
<p id="picker-help">Links use stable document ids shaped doc:id, with an optional #anchor. Titles are never stored in links.</p>
<select id="target-doc" name="target_doc" aria-describedby="picker-help">
<option value="doc-b">Bee</option>
<option value="doc-c">Sea</option>
</select>
<label class="doc-field" for="target-block">Anchor (optional)</label>
<input id="target-block" name="target_block" type="text" autocomplete="off">
<p><button type="submit">Insert link</button></p>
</form>
</div></body>
</html>
