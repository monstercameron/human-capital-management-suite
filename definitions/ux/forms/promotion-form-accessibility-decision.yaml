      planning/todos.md, 2026-09-02). Add one if a later phase reintroduces
      a form-backed human-work task for this request type.
    status: PENDING
    owner: TBD
  - item: >-
      200% text zoom and a real assistive-technology (NVDA/VoiceOver) pass
