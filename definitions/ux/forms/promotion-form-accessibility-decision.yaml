todo: FORM-004
workspace: Promotion request form accessibility and equivalent human route
decision_date: "2026-09-03"
review_by: "2026-10-03"

# accessible_route names which renderer this lane's own two form-specific
# criteria (required-field semantics, error association) are proven against
# unconditionally -- the renderer FORM-004's accessible route ships as
# today, independent of definitions/ux/workspace-renderer-decision.yaml's
# separate UX-QUAL-001 renderer pick (which covers the six criteria that
# renderer decision already scores GWC as passing).
accessible_route: ssr

summary: >-
  tools/uxqual/forms adds two FORM-004 criteria UX-QUAL-001's fixture
  (tools/uxqual/qual) does not define: CheckRequiredFieldSemantics (every
  required field renders both the native `required` attribute and
  aria-required="true") and CheckErrorAssociation (every field with a
  validation error carries aria-invalid="true" and an aria-describedby that
  resolves to a real element). Scored against the Promotion request fixture
  with one field's validation error populated
  (tools/uxqual/forms.FixtureWithValidationError), the Go SSR fallback
  (tools/uxqual/render/ssr) passes both; the GWC renderer
  (tools/uxqual/render/gwc) now passes both form-specific checks. SSR remains
  FORM-004's designated accessible route, while the interactive renderer has
  equivalent required-field and error-association semantics.

method: >-
  tools/uxqual/forms.TestTodo_FORM_004 renders
  tools/uxqual/forms.FixtureWithValidationError() through both renderers
  and scores tools/uxqual/qual's Keyboard/ScreenReader/Contrast/Reflow/
  Masking criteria plus this package's CheckRequiredFieldSemantics and
  CheckErrorAssociation against RequiredFieldIDs/ErroredFieldIDs. Re-run
  with `go test -count=1 ./tools/uxqual/forms/...`.

gwc_known_gaps:
  required_field_semantics: false
  error_association: false

candidates:
  ssr:
    package: github.com/monstercameron/human-capital-management-suite/tools/uxqual/render/ssr
    required_field_semantics: pass
    error_association: pass
    detail: >-
      tools/uxqual/render/ssr/ssr.go's inputTag sets both `required
      aria-required="true"` when Validation.Required, and both
      `aria-describedby="<id>-error" aria-invalid="true"` when
      Validation.Message is non-empty.
  gwc:
    package: github.com/monstercameron/human-capital-management-suite/tools/uxqual/render/gwc
    required_field_semantics: pass
    error_association: pass
    detail: >-
      tools/uxqual/render/gwc/renderer.go's fieldNode sets
      html.Props.Required so the native `required` attribute is emitted,
      sets `aria-required="true"` via html.Props.Aria and, when
      Validation.Message is non-empty, also sets `aria-invalid="true"` and
      `aria-describedby="<id>-error"` against the visible
      `<p id="<id>-error">` sibling.

equivalent_route:
  kind: CAPABILITY_CALL
  capability_id: people.promote
  capability_version: v1
  proof: >-
    tools/uxqual/forms.TestTodo_FORM_004_Integration extracts a real SSR (and
    GWC) rendered document's submitted answers
    (tools/uxqual/forms.ExtractFormAnswers), builds an IntentInstance via
    FromFormSubmission, independently builds the same typed
    PromotionRequestInputs and an IntentInstance via FromCapabilityCall, and
    asserts both routes' IntentInstance.Digest are equal -- and that
    changing any one typed input changes both.

pending:
