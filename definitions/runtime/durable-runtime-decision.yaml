# The four non-negotiables from planning/specs/workflow-runtime.md
# "Build or adopt". Every candidate is scored against every one by id with
# PASS, FAIL or PARTIAL. evidence_kind says how the result was obtained:
#   FIXTURE    - the named tests exist in this repository and were executed
#                (go test -count=1, windows/arm64, Go 1.26.3, 2026-09-15).
#   DOCUMENTED - assessed from the cited public documentation on
#                assessed_date. No SDK was installed, no server was run and
#                no fixture was executed against the candidate.
non_negotiables:
  - id: NN1
    description: "The business ledger stays outside the engine's own history store."
  - id: NN2
    description: "Tenant isolation, fencing tokens, and stable effect idempotency are preserved."
  - id: NN3
    description: "Node execution, timers, and leases are inspectable through the same typed projections this contract defines."
  - id: NN4
    description: "Safe-point pause and version pinning behave as specified here."

candidates:
  - name: "In-house PostgreSQL-backed Go runtime (internal/workflow/{runtime,execute,lease,timer,recover,inspect} over internal/data/runtimestate)"
    kind: BUILD
    selected: true
    summary: >
      The runtime that now exists in this repository: instance/node state and
      advancement receipts (internal/workflow/runtime, migration 00016),
      scheduling state with fenced leases, settle-once timers, ready work and
      checkpoints (internal/data/runtimestate, migration 00026), the lease
      manager (internal/workflow/lease), durable timers
      (internal/workflow/timer), orphan recovery (internal/workflow/recover),
      the caller-driven and served driver (internal/workflow/execute,
      internal/platform/execution/scheduler) and durable inspection
      (internal/workflow/inspect). No separate server and no non-Postgres
      dependency.
    evaluation:
      - non_negotiable: NN1
        result: PASS
        evidence_kind: FIXTURE
        reason: >
          The engine's state lives in workflow_* runtime tables; business
          facts are appended to ledger_event only through the
          execute.TerminalWriter port (effects.LedgerTerminalWriter), using
          the ledger's own append discipline. TestTodo_WF_RUN_000_Conformance
          proves no runtime-state package (runtime, lease, timer, recover,
          inspect, execute, data/runtimestate, platform/execution/scheduler)
          imports internal/ledger or internal/data/ledger and neither runtime
          migration references ledger_event. TestTodo_WF_RUN_003_Redelivery
          counts ledger_event facts separately from advancement receipts,
          idempotency records and outbox rows across three crash boundaries
          and finds exactly one ledger fact after recovery.
          TestTodo_LEDGER_002 proves the ledger's independent append
          (locked head, allocated sequence, digest, replay receipt), and
          TestTodo_TX_004_PromotionTerminalAdapter proves the terminal fact
          is written through the port without changing the runtime's
          continuation.
        tests:
          - name: TestTodo_WF_RUN_000_Conformance
            path: tools/policy/runtimedecision/runtimedecision_matrix_test.go
          - name: TestTodo_WF_RUN_003_Redelivery
            path: internal/workflow/execute/wfrun003_redelivery_test.go
          - name: TestTodo_LEDGER_002
            path: internal/data/ledger/append_test.go
          - name: TestTodo_TX_004_PromotionTerminalAdapter
            path: test/workflow/promotion_commit_terminal_adapter_test.go
          - name: TestTodo_WF_RUN_025
            path: internal/workflow/runtime/wfrun025_test.go
      - non_negotiable: NN2
        result: PASS
        evidence_kind: FIXTURE
        reason: >
          Tenant isolation: TestTodo_DB_017 (unscoped hcmnext_app sees
          nothing, a scoped transaction sees only its tenant) and
          TestTodo_WF_RUN_001_Security (cross-tenant read, write and insert
          on runtime tables refused by RLS). Fencing:
          TestTodo_WF_RUN_002/_Race/_Conformance (monotonic never-reused
          tokens, one winner among concurrent acquirers, no clock or
          goroutine in the lease package),
          TestScheduling_LeasesAreExclusiveAndFenced (database-level
          exclusivity), TestTodo_WF_RUN_036 (a served driver is refused
          LEASE_HELD while another replica holds the instance and refused
          under a stale fence with the version unchanged),
          TestFencedRunsVerifyBeforeStepsAndLeaseAroundTheRun and
          TestTodo_WF_RUN_003_RedeliveryFence. Effect idempotency:
          TestTodo_TX_006/_Race/_Security (same key and digest returns the
          stored identity, eight concurrent connections run the effect once,
          mismatch is IDEMPOTENCY_CONFLICT) and
          TestTodo_WF_RUN_003_GuardedStep (a redelivered activation replays
          the stored outcome instead of repeating the effect).
        tests:
          - name: TestTodo_DB_017
            path: internal/data/tenancy/isolation_test.go
          - name: TestTodo_WF_RUN_001_Security
            path: internal/workflow/runtime/wfrun001_test.go
          - name: TestTodo_WF_RUN_002
            path: internal/workflow/lease/wfrun002_test.go
          - name: TestTodo_WF_RUN_002_Race
            path: internal/workflow/lease/wfrun002_test.go
          - name: TestTodo_WF_RUN_002_Conformance
            path: internal/workflow/lease/wfrun002_test.go
          - name: TestScheduling_LeasesAreExclusiveAndFenced
            path: internal/data/runtimestate/scheduling_test.go
          - name: TestTodo_WF_RUN_036
            path: test/workflow/wfrun036_test.go
          - name: TestFencedRunsVerifyBeforeStepsAndLeaseAroundTheRun
            path: internal/workflow/execute/fence_test.go
          - name: TestTodo_WF_RUN_003_RedeliveryFence
            path: internal/workflow/execute/wfrun003_redelivery_test.go
          - name: TestTodo_TX_006
            path: internal/transaction/idempotency/tx006_test.go
          - name: TestTodo_TX_006_Race
            path: internal/transaction/idempotency/tx006_race_test.go
          - name: TestTodo_TX_006_Security
            path: internal/transaction/idempotency/tx006_security_test.go
          - name: TestTodo_WF_RUN_003_GuardedStep
            path: internal/workflow/recover/steps_test.go
      - non_negotiable: NN3
        result: PASS
        evidence_kind: FIXTURE
        reason: >
          inspect.Load traverses the durable records itself from PostgreSQL:
          instance and pinned compiled version, node executions with attempt
          history and retry timers, every timer, advancement receipts, lease
          history and checkpoints, under tenant scope.
          TestTodo_WF_RUN_019_DurableInspection proves it on a really
          started instance parked on a durable WAIT timer under the instance
          lease; TestTodo_WF_RUN_019_Integration proves the projection is
          over what the store persists; TestTodo_WF_RUN_019_Fault proves a
          non-disclosable instance leaks nothing.
          TestScheduler_HistoryKeepsSettledTimers proves settled timers stay
          queryable, and TestTodo_WF_RUN_038 proves node execution
          fingerprints are stored and answer which instances a version
          touched. Scope note: the inspector marks business_transaction and
          connector_operation UNAVAILABLE (no store links them to an
          instance); those are outside NN3, which names node execution,
          timers and leases.
        tests:
          - name: TestTodo_WF_RUN_019_DurableInspection
            path: test/workflow/wfrun019_test.go
          - name: TestTodo_WF_RUN_019_Integration
            path: internal/workflow/inspect/wfrun019_test.go
          - name: TestTodo_WF_RUN_019_Fault
            path: internal/workflow/inspect/wfrun019_test.go
          - name: TestScheduler_HistoryKeepsSettledTimers
            path: internal/workflow/timer/history_test.go
          - name: TestTodo_WF_RUN_038
            path: internal/workflow/runtime/fingerprint_test.go
      - non_negotiable: NN4
        result: PASS
        evidence_kind: FIXTURE
        reason: >
          Safe-point pause: TestTodo_WF_RUN_008/_Race/_Fault (pause at a
          safe point takes effect, a paused instance refuses to advance,
          resume revalidates context, malformed requests refused before any
          read), TestResumeAppliesAPendingPauseAtItsSafePoint (a pause
          requested mid-region stays PAUSE_REQUESTED and becomes PAUSED when
          the driver reaches the safe point),
          TestResumeRefusesWhileTheInstanceIsPaused and
          TestTodo_WF_RUN_009_LiveInstancePause (a quarantine PAUSE
          disposition pauses a live instance at its safe point). Version
          pinning: TestTodo_WF_RUN_023/_Fault (start binds the ACTIVE
          compiled version by exact pin; pin mismatch refused, nothing left
          behind), TestResolveStartOutcome_RefusesEveryMismatchedIdentityPin,
          TestTodo_WF_RUN_040 (execution context pinned at start, replayed
          unchanged, proven on every advancement), TestTodo_WF_COMP_006
          (Resolve never falls back to latest or active) and
          TestTodo_WF_COMP_006_Durable (a fresh connection resolves the same
          verified record). Scope note: WF-COMP-006 is reopened for
          publication-approval authority, which governs how a version
          becomes ACTIVE, not whether a running instance stays pinned to it.
        tests:
          - name: TestTodo_WF_RUN_008
            path: internal/workflow/runtime/wfrun008_test.go
          - name: TestTodo_WF_RUN_008_Race
            path: internal/workflow/runtime/wfrun008_test.go
          - name: TestTodo_WF_RUN_008_Fault
            path: internal/workflow/runtime/wfrun008_test.go
          - name: TestResumeAppliesAPendingPauseAtItsSafePoint
            path: internal/workflow/execute/wfrun008_test.go
          - name: TestResumeRefusesWhileTheInstanceIsPaused
            path: internal/workflow/execute/wfrun008_test.go
          - name: TestTodo_WF_RUN_009_LiveInstancePause
            path: internal/workflow/execute/quarantine_test.go
          - name: TestTodo_WF_RUN_023
            path: internal/workflow/runtime/wfrun023_test.go
          - name: TestTodo_WF_RUN_023_Fault
            path: internal/workflow/runtime/wfrun023_test.go
          - name: TestResolveStartOutcome_RefusesEveryMismatchedIdentityPin
            path: internal/workflow/runtime/start_resolution_test.go
          - name: TestTodo_WF_RUN_040
            path: internal/workflow/runtime/execution_context_test.go
          - name: TestTodo_WF_COMP_006
            path: internal/workflow/version/wfcomp006_test.go
          - name: TestTodo_WF_COMP_006_Durable
            path: internal/data/workflowversionstore/store_test.go
    evidence:
      - description: "WorkflowInstance/NodeExecution runtime tables"
        path: "migrations/00016_workflow_runtime.sql"
        status: EXISTS
      - description: "Scheduling state: fenced leases, settle-once timers, ready work, checkpoints"
        path: "migrations/00026_workflow_scheduling_state.sql"
        status: EXISTS
      - description: "Lease manager: acquire/renew/release/expire/verify with monotonic fence tokens"
