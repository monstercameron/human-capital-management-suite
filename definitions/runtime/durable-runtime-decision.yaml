  - name: "Temporal (Go SDK go.temporal.io/sdk)"
    kind: ADOPT
    module: "go.temporal.io/sdk"
    version: "not pinned (documentation assessment only; no SDK installed, no server run)"
    selected: false
    summary: >
      Durable-execution platform. Workflow and activity code is Go; the event
      history, task queues, timers and visibility live in the Temporal
      Service's persistence store (Cassandra, PostgreSQL, MySQL), a separately
      operated server the SDK reaches over gRPC.
    evaluation:
      - non_negotiable: NN1
        result: PASS
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Event History is the engine's own append-only store inside the
          Temporal Service persistence layer. Business ledger writes would be
          activities against this repository's PostgreSQL ledger, so the
          ledger structurally stays outside the engine history.
        sources:
          - "https://docs.temporal.io/temporal-service/persistence"
          - "https://docs.temporal.io/workflows"
      - non_negotiable: NN2
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          The Namespace is the isolation unit and the documentation states a
          single Namespace is still multi-tenant; there is no per-row tenant
          RLS equivalent. Activities are at-least-once ("may be executed
          multiple times"), with idempotency left to the called service
          (recommended key: workflow run id plus activity id). No fencing
          token is exposed for guarding writes against an external store; a
          zombie activity is detected only through heartbeat/timeout. Tenant
          isolation and fencing would have to be rebuilt above the SDK.
        sources:
          - "https://docs.temporal.io/namespaces"
          - "https://docs.temporal.io/activity-definition"
      - non_negotiable: NN3
        result: FAIL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Execution state is exposed through Event History and the Visibility
          list-filter/search-attribute API of the Temporal Service, not as
          typed tables in this repository's PostgreSQL. The reviewed
          Visibility documentation does not describe timers or activity
          leases as queryable records. Meeting NN3 would need a derived copy
          of engine state into this contract's projections, which is a
          second, non-authoritative source of truth.
        sources:
          - "https://docs.temporal.io/visibility"
          - "https://docs.temporal.io/workflow-execution"
      - non_negotiable: NN4
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Version pinning is documented: a Pinned workflow "is guaranteed to
          complete on a single Worker Deployment Version", and GetVersion
          patch markers are recorded in history. Workflow Pause is
          pre-release (self-hosted Server v1.30.0+ behind
          frontend.WorkflowPauseEnabled), is applied at any time rather than
          at a declared safe point, lets running activities finish and lets
          timers keep advancing; there is no PAUSE_REQUESTED-until-safe-point
          semantics as this spec requires.
        sources:
          - "https://docs.temporal.io/worker-versioning"
          - "https://docs.temporal.io/develop/go/versioning"
          - "https://docs.temporal.io/encyclopedia/workflow/workflow-pause"
    evidence:
      - description: "Executable conformance spike against go.temporal.io/sdk (not run: documentation-assessed only; it would only be needed if a future re-evaluation found an NN3 path)"
        status: PENDING
        pending_todo: WF-RUN-000
    rejection_reason: >
      Fails NN3 by its documented architecture (execution state lives in the
      Temporal Service, not in typed projections in this repository's
      PostgreSQL) and is PARTIAL on NN2 and NN4 (namespace-level isolation,
      no exposed fencing token, pre-release pause not bound to safe points),
      while adding a separately operated server. The in-house runtime passes
      all four with executed fixtures.

  - name: "Restate (Go SDK github.com/restatedev/sdk-go)"
    kind: ADOPT
    module: "github.com/restatedev/sdk-go"
    version: "not pinned (documentation assessment only; no SDK installed, no server run)"
    selected: false
    summary: >
      Durable-execution server with an official Go SDK. Journals, idempotency
      metadata, state and timer indices live in the restate-server process
      (Bifrost log, partition-processor RocksDB, snapshots to object storage).
    evaluation:
      - non_negotiable: NN1
        result: PASS
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          The journal is Restate's own log and partition store; Restate's
          database guidance keeps core business data, including transaction
          history, in the application's own database, so the ledger stays
          outside the engine history.
        sources:
          - "https://docs.restate.dev/references/architecture"
          - "https://docs.restate.dev/guides/databases"
      - non_negotiable: NN2
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Epoch fencing exists but inside the server ("the processor rejects
          any events from superseded epochs"); it is not exposed as a token
          for writes to an external PostgreSQL. Idempotency keys deduplicate
          invocations; exactly-once writes to an external database need
          user-built idempotency tables or two-phase commit. Tenant isolation
          is not described in the reviewed pages.
        sources:
          - "https://docs.restate.dev/references/architecture"
          - "https://docs.restate.dev/guides/databases"
      - non_negotiable: NN3
        result: FAIL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Introspection (sys_invocation, sys_journal, sys_idempotency, state)
          is served by Restate's own SQL API, not the application database,
          and the reviewed documentation does not describe timers as a
          queryable table. The typed node/timer/lease projections this
          contract defines would have to be a derived copy.
        sources:
          - "https://docs.restate.dev/services/introspection"
      - non_negotiable: NN4
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Pinning is documented: deployments are immutable and "requests
          start and end on the same version". Invocations can be paused and
          resumed (optionally on another deployment), but the reviewed pages
          do not bind pause to a declared safe point or describe a
          PAUSE_REQUESTED state for an atomic region.
        sources:
          - "https://docs.restate.dev/services/versioning"
    evidence:
      - description: "Executable conformance spike against the Restate Go SDK (not run: documentation-assessed only)"
        status: PENDING
        pending_todo: WF-RUN-000
    rejection_reason: >
      Fails NN3 (introspection only through the Restate server's SQL API) and
      is PARTIAL on NN2 and NN4, while requiring a separately operated
      non-Postgres durable log.

  - name: "DBOS Transact (Go library github.com/dbos-inc/dbos-transact-golang)"
    kind: ADOPT
    module: "github.com/dbos-inc/dbos-transact-golang"
    version: "not pinned (documentation assessment only; no library installed)"
    selected: false
    summary: >
      Embedded durable-workflow library that checkpoints workflow inputs and
      step outputs in a PostgreSQL system database, with no separate server.
      The 2026-09-03 record could not confirm a Go SDK; the official Go
      library is now confirmed at the module path above.
    evaluation:
      - non_negotiable: NN1
        result: PASS
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Checkpoints, step outputs and queue state live in the DBOS system
          database, which the architecture page describes as its own logical
          database; business data stays in the application's database.
        sources:
          - "https://docs.dbos.dev/architecture"
          - "https://github.com/dbos-inc/dbos-transact-golang"
      - non_negotiable: NN2
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Workflow IDs are idempotency keys ("executes only once"). Isolation
          is per application sharing a system database; per-tenant row
          isolation and a fencing token exposed to step writes are not
          described in the reviewed pages (recovery is coordinated by
          executor and application version, or DBOS Conductor).
        sources:
          - "https://docs.dbos.dev/golang/tutorials/workflow-tutorial"
          - "https://docs.dbos.dev/architecture"
      - non_negotiable: NN3
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          State is in PostgreSQL and listable (ListWorkflows, workflow steps),
          which is closer than server-held history, but the model is
          workflow status plus step outputs: it has no node-execution graph,
          no lease records and no timer projection in this contract's typed
          shape.
        sources:
          - "https://docs.dbos.dev/golang/tutorials/workflow-management"
          - "https://docs.dbos.dev/architecture"
      - non_negotiable: NN4
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Workflows are tagged with the application version they started on
          and recover only to compatible code, which is version pinning. There
          is no safe-point pause: cancel stops "at the start of its next
          durable operation" and resume restarts the function replaying
          checkpointed steps.
        sources:
          - "https://docs.dbos.dev/golang/tutorials/workflow-tutorial"
          - "https://docs.dbos.dev/golang/tutorials/workflow-management"
    evidence:
      - description: "Executable conformance spike against dbos-transact-golang (not run: documentation-assessed only)"
        status: PENDING
        pending_todo: WF-RUN-000
    rejection_reason: >
      The closest external shape (embedded, PostgreSQL), but PARTIAL on NN2,
      NN3 and NN4 by its documentation: no tenant row isolation or exposed
      fencing, no node/lease/timer projections, no safe-point pause. Adopting
      it now would mean replacing a runtime that passes all four with executed
      fixtures by one that would need those same pieces rebuilt above it.

  - name: "river (github.com/riverqueue/river) as a durable-execution foundation"
    kind: ADOPT
    module: "github.com/riverqueue/river"
    version: "not pinned (documentation assessment only; no library installed)"
    selected: false
    summary: >
      Go-native PostgreSQL job queue (transactional enqueue, retries, unique
      jobs, queue pause, no separate server). Multi-step DAG workflows are a
      commercial River Pro feature, not part of the open-source module.
    evaluation:
      - non_negotiable: NN1
        result: PASS
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          river stores jobs in the caller's PostgreSQL and enqueues in the
          caller's transaction; the ledger stays wherever the caller keeps
          it.
        sources:
          - "https://riverqueue.com/docs/transactional-enqueueing"
      - non_negotiable: NN2
        result: PARTIAL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Unique jobs guarantee single insertion only; execution is
          at-least-once ("can still execute more than once"). Tenant
          isolation and a fencing token for job execution are not described.
          Transactional enqueue does give effect-with-data atomicity.
        sources:
          - "https://riverqueue.com/docs/unique-jobs"
          - "https://riverqueue.com/docs/transactional-enqueueing"
      - non_negotiable: NN3
        result: FAIL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          The open-source module has jobs, not workflow instances or node
          executions; DAG workflows are River Pro only, and the reviewed page
          does not document their storage. There is nothing to project into
          this contract's node/timer/lease shape.
        sources:
          - "https://riverqueue.com/docs/pro/workflows"
      - non_negotiable: NN4
        result: FAIL
        evidence_kind: DOCUMENTED
        assessed_date: "2026-09-15"
        reason: >
          Pause is per queue ("a client will cease fetching additional jobs
          for that queue"), not per instance at a safe point, and no workflow
          version pinning is documented.
        sources:
          - "https://riverqueue.com/docs/pausing-queues"
          - "https://riverqueue.com/docs/pro/workflows"
    evidence:
      - description: "Executable comparison of river's job claim against runtimestate ready work and leases (not run: documentation-assessed only)"
        status: PENDING
        pending_todo: WF-RUN-000
    rejection_reason: >
      A job queue, not a workflow runtime: fails NN3 and NN4 by its
      documentation and would duplicate the fenced ready-work and lease
      primitives internal/data/runtimestate already provides.

non_candidate_note: >
  "goose" in the WF-RUN-000 todo text names the migration tool already used
  by this repo (go.mod: github.com/pressly/goose/v3), cited as an example of a
  Go-library-plus-Postgres tool with no separate server, not as a
  durable-execution engine to evaluate.

selected_option:
  candidate: "In-house PostgreSQL-backed Go runtime (internal/workflow/{runtime,execute,lease,timer,recover,inspect} over internal/data/runtimestate)"
  choice: "BUILD"
  rationale: >
    The in-house runtime is the only candidate with a PASS on all four
    non-negotiables, and every PASS names tests that exist in this repository
    and were executed on 2026-09-15 (34 of them in one go test -count=1 run
    over 13 packages, plus TestTodo_WF_RUN_000_Conformance; all PASS).
    No external candidate passes all four even on its own documentation:
    Temporal and Restate fail NN3 because execution state lives in their
    servers rather than in typed projections here; river fails NN3 and NN4;
    DBOS Transact, the closest shape, is PARTIAL on NN2, NN3 and NN4. The
    external results are documentation assessments, not fixture runs, so they
    rank candidates without proving them; they are sufficient to reject
    adoption because each named gap is architectural rather than a
    configuration choice. BUILD stands, with the caveat that the gated
    lease/timer/scheduler code landed before this re-evaluation was recorded
    (see reevaluations).
