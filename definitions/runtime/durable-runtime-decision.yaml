reevaluation_trigger:
  description: >
    Reopen this decision, with a new dated reevaluations entry recorded before
    the code lands, when any of these happen: (1) a change would move
    instance, node, timer or lease state out of the in-house PostgreSQL
    tables or make the ledger depend on an engine history; (2) any NN fixture
    named above is deleted, renamed or fails; (3) new scheduler, lease, timer
    or recovery packages are introduced (TestTodo_WF_RUN_000_Integration fails
    until a reevaluation names them); (4) a candidate's documentation changes
    an NN result from FAIL or PARTIAL to PASS, at which point an executable
    spike, not a documentation read, must produce FIXTURE evidence before any
    ADOPT.
  gating_todo: WF-RUN-000
  blocks: "New durable-runtime scheduler/timer/lease or recovery packages without a reevaluation entry, recorded before they land, that names them"

rollback_plan: >
  BUILD introduces no external dependency or operational surface. If a later
  re-evaluation selects an ADOPT candidate with FIXTURE PASS on all four
  non-negotiables, the in-house instance/node/timer/lease rows are migrated
  into the adopted engine behind the same typed projections (NN3), and the
  business ledger (internal/ledger, internal/data/ledger) is untouched
  throughout because NN1 already keeps it outside any engine history. No
  vendor integration has to be unwound.
