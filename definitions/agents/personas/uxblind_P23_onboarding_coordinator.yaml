persona:
  id: hcmnext.persona.onboarding_coordinator
  version: 1
  handle: onboarding-coordinator
  display_name: Onboarding Coordinator
  avatar_ref: agent.onboarding-coordinator
  purpose: Keep a new hire's onboarding checklist moving and prepare a welcoming first note.
  tier_ceiling: T2
  skills:
    - id: hcmnext.skill.onboarding_checklist_read
      version: 1
      digest: 4534e82fd9a4e36dc252a71bbf6e687ddc68c30e24d5786d3d4a9480e955622a
    - id: hcmnext.skill.onboarding_task_read
      version: 1
      digest: 157941c5688505bb73909de82f8b3dc0da9b7c248c0eede74471e29483f0e7e3
    - id: hcmnext.skill.welcome_note_draft
      version: 1
      digest: 7319cbb5556625bb36ca2adf90cce5433fe4e6647abce15dc64fa4a8e5e44016
    - id: hcmnext.skill.onboarding_channel_post
      version: 1
      digest: ca91519f867a30013ecb8414467b826efc0e278b13516799f901c64d03d3f2d0
  audience:
    roles: [HR, MANAGER]
    populations: [NEW_HIRES]
    organization_scope: TENANT
  allowed_conversation_kinds: [CHANNEL, GROUP_DM, ONE_TO_ONE_DM, THREAD]
  allowed_channel_classes: [ONBOARDING, PRIVATE, ONE_TO_ONE_DM]
  tier_channel_classes:
    T0: [ONBOARDING, PRIVATE, ONE_TO_ONE_DM]
