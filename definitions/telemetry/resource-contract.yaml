# Telemetry resource, context and privacy contract (OBS-001).
#
# Owned schema for the signal-neutral envelope implemented in
# internal/platform/telemetry. This file is the source of truth for the
# attribute allow-list: internal/platform/telemetry's DefaultAllowlist is
# tested (contract_test.go) against a load of this exact file, so the Go
# registry and the published contract can never silently drift apart.
#
# Telemetry diagnoses software. It is not a business ledger, audit log,
# billing source, authorization fact or proof that an external effect
# completed (planning/specs/structured-logging-and-opentelemetry.md,
# "Scope").

version: 1
schema_version: 1

# Resource identifies the process instance that produced a signal. It is
# service-and-build identity, never business or tenant identity: tenant_class
# is a bounded bucket below, never a tenant id, workspace name or org name.
resource_fields:
  - name: schema_version
    required: true
  - name: service_name
    required: true
  - name: service_version
    required: true
  - name: service_instance_id
    required: true
  - name: environment
    required: true
  - name: cell_id
    required: true
  - name: region
    required: false
  - name: process_role
    required: true
  - name: build_digest
    required: true
  - name: tenant_class
    required: false

# Context-propagation keys are the only identifiers a caller may attach
# in-process; each is a bounded, opaque token, never a structured payload.
context_propagation_keys:
  - name: correlation_id
    required: true
    max_length: 128
  - name: request_id
    required: false
    max_length: 128
  - name: evidence_ref
    required: false
    max_length: 256
  - name: principal_ref
    required: false
    max_length: 128

# Attribute allow-list. A key not listed here classifies as PROHIBITED
# everywhere internal/platform/telemetry checks it (fail closed by
# construction). max_cardinality is required (> 0) whenever "metric" is
# among signals.
attribute_allowlist:
  - key: cell_id
    class: OPERATIONAL_PUBLIC
    signals: [resource, log, span, metric]
    max_cardinality: 64
    description: Bounded cell identifier; never a tenant identity.
  - key: environment
    class: OPERATIONAL_PUBLIC
    signals: [resource, log, span, metric]
    max_cardinality: 8
    description: Deployment environment name.
  - key: process_role
    class: OPERATIONAL_PUBLIC
    signals: [resource, log, span, metric]
    max_cardinality: 16
    description: Runtime role of the emitting process.
  - key: tenant_class
    class: OPERATIONAL_PUBLIC
    signals: [resource, log, span, metric]
    max_cardinality: 8
    description: Bounded tenant tier bucket, never a tenant id.
  - key: outcome
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 8
    description: Typed operation outcome.
  - key: capability_id
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 128
    description: Registry-owned capability identifier.
  - key: workflow_node
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 128
    description: Registry-owned workflow node name.
  - key: edge
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 32
    description: Named replication/consistency edge for parity checks.
  - key: operation
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 256
    description: Bounded registry-named boundary operation (OBS-014 boundary instrumentation).
  - key: route
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 256
    description: Route template of a transport boundary, never a concrete path.
  - key: dependency
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 64
    description: Named external or storage dependency behind a boundary call.
  - key: status
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 32
    description: Bounded status class of a boundary call (HTTP or gRPC status family).
  - key: size_class
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 8
    description: Bucketed payload size class, never a raw byte count.
  - key: retry
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 2
    description: Whether the boundary call was a retry attempt.
  - key: error_type
    class: OPERATIONAL_RESTRICTED
    signals: [log, span]
    max_cardinality: 0
    description: Classified error type; unbounded on logs/traces only, never a metric label.
  - key: correlation_id
    class: OPERATIONAL_RESTRICTED
    signals: [log, span]
    max_cardinality: 0
    description: Business correlation identifier; never a metric label.
  - key: logical_operation_id
    class: OPERATIONAL_RESTRICTED
    signals: [span]
    max_cardinality: 0
    description: Bounded durable logical operation identifier; span context only, never authority or a metric label.
  - key: attempt_id
    class: OPERATIONAL_RESTRICTED
    signals: [span]
    max_cardinality: 0
    description: Bounded durable attempt identifier; span context only, never authority or a metric label.
  - key: node_id
    class: OPERATIONAL_RESTRICTED
    signals: [span]
    max_cardinality: 0
    description: Workflow node identifier for trace-to-inspector pivoting; span context only, never authority or a metric label.
  - key: terminal_code
    class: OPERATIONAL_RESTRICTED
    signals: [span]
    max_cardinality: 32
    description: Closed workflow terminal outcome vocabulary; span context only, never payload or authority.
  - key: timer_id
    class: OPERATIONAL_RESTRICTED
    signals: [span]
    max_cardinality: 0
    description: Durable timer identifier attributing a timer-fire or timer-resume span; span context only, never authority or a metric label.
  - key: message_kind
    class: OPERATIONAL_RESTRICTED
    signals: [span]
    max_cardinality: 16
    description: Closed asynchronous message-kind vocabulary; span context only, never payload, authority, or metric label.
  - key: provider
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 8
    description: Closed third-party provider vocabulary (payroll, iam); never a vendor account or tenant identity.
  - key: provider_operation
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 8
    description: Closed provider operation vocabulary (deliver, reverse, status, token, callback).
  - key: outcome_class
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 16
    description: Stable provider delivery failure class (providerdelivery Class values).
  - key: result
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 16
    description: Closed result vocabulary of a provider callback intake or token refresh.
  - key: to_state
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 4
    description: Circuit-breaker state entered by a transition (closed, open, half_open).
  - key: from_state
    class: OPERATIONAL_PUBLIC
    signals: [log, span]
    max_cardinality: 4
    description: Circuit-breaker state left by a transition; logs and traces only.
  - key: breaker_state
    class: OPERATIONAL_PUBLIC
    signals: [log, span]
    max_cardinality: 4
    description: Circuit-breaker state of a provider after a transition; logs and traces only.
  - key: secret_slot
    class: OPERATIONAL_PUBLIC
    signals: [log, span, metric]
    max_cardinality: 4
    description: Which configured callback-signing secret verified a receipt (current, previous, other); never the secret.
  - key: secret_index
    class: OPERATIONAL_PUBLIC
    signals: [log, span]
    max_cardinality: 8
    description: Small index of the callback-signing secret that verified a receipt; never the secret, never a metric label.
  - key: retry_delay_ms
    class: OPERATIONAL_PUBLIC
    signals: [log, span]
    max_cardinality: 0
    description: Scheduled provider retry delay in milliseconds; logs and traces only, never a metric label.
  - key: attempt
    class: OPERATIONAL_PUBLIC
    signals: [log]
    max_cardinality: 0
    description: 1-based provider delivery attempt number on log lines (spans carry it as attempt_id); never a metric label.
  - key: change_ref
    class: OPERATIONAL_RESTRICTED
    signals: [log, span]
    max_cardinality: 0
    description: Opaque outbox change reference (for example payroll:<uuid>); logs and traces only, never a metric label.
  - key: event_id
    class: OPERATIONAL_RESTRICTED
    signals: [log, span]
    max_cardinality: 0
    description: Provider callback event identifier (Webhook-Id); logs and traces only, never a metric label.
