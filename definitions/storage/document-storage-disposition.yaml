# Independent document-database storage disposition (HUB-001).
#
# Like definitions/storage/chat-storage-disposition.yaml, this registry
# describes the embedded migration tree used by the independent document
# database. It is intentionally explicit because the core storagemanifest
# generator scans only /migrations and cannot see this schema. Future
# document tables (versions, deployments, grants, links, search chunks)
# arrive with the todos that own them and extend this registry row by row.
# Backup and retention operations run against this database independently
# of chat and workflow storage; pruning that needs DELETE will narrow the
# forbid_mutation trigger the way chat 00008 did, never by editing history.

version: 1
module: github.com/monstercameron/human-capital-management-suite
database: documents
sources:
  - internal/data/documenthubstore/migrations/00001_documents.sql

defaults:
  plane: KNOWLEDGE_DATA
  data_role: CONTROL
  isolation_package: internal/data/tenancy
  rls_policy: tenant_isolation
  rls_required: true
  retention_class: OPERATIONAL
  encryption_class: PLATFORM_MANAGED

tables:
  - table: document
    plane: KNOWLEDGE_DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
    rls_policy: tenant_isolation
    rls_required: true
    retention_class: OPERATIONAL
    encryption_class: PLATFORM_MANAGED
    migration: internal/data/documenthubstore/migrations/00002_document_versions.sql
    owner_package: internal/data/documenthubstore
    tenant_scoping_column: tenant_id
    append_only: false
  - table: document_version
    plane: KNOWLEDGE_DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
    rls_policy: tenant_isolation
    rls_required: true
