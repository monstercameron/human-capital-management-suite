# Independent time-keeping database storage disposition (TCLOCK/WTIME).
#
# The time store is applied from internal/data/timestore/migrations into its
# own schema and credential. Every base table is listed exactly once here.
# The timestore registry tests compare these rows with the embedded migration
# tree and with PostgreSQL's live RLS and trigger metadata.

