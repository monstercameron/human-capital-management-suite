# Independent chat-database storage disposition (CHAT-003/004).
#
# Unlike definitions/storage/storage-disposition.yaml, this registry describes
# the embedded migration trees used by the independent chat database and the
# small core-owned route table. It is intentionally explicit because the core
# storagemanifest generator scans only /migrations and cannot see these
# schemas. CHAT-004 validation must apply the same tenant-isolation and
# append-only checks to every row here and to any future chat table.

version: 1
module: github.com/monstercameron/human-capital-management-suite
database: chat
sources:
  - internal/data/chatstore/migrations/00001_chat.sql
  - internal/data/chatstore/migrations/00002_chat_records.sql
  - internal/data/chatstore/migrations/00003_chat_authority.sql
  - internal/data/chatstore/migrations/00004_chatapps.sql
  - internal/data/chatstore/migrations/00005_chat_recipient_state.sql
  - internal/data/chatstore/migrations/00006_chat_event_sequence.sql
  - internal/data/chatstore/migrations/00007_chat_audit_immutable.sql
  - internal/data/chatstore/migrations/00008_chat_sequence_and_outbox_retention.sql
  - internal/data/chatroutestore/store.go

defaults:
  plane: CHAT_DATA
  data_role: CONTROL
  isolation_package: internal/data/tenancy
  rls_policy: tenant_isolation
  rls_required: true
  retention_class: OPERATIONAL
  encryption_class: PLATFORM_MANAGED

tables:
  - table: chat_conversation
    plane: CHAT_DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
    rls_policy: tenant_isolation
    rls_required: true
    retention_class: OPERATIONAL
    encryption_class: PLATFORM_MANAGED
    migration: internal/data/chatstore/migrations/00001_chat.sql
    owner_package: internal/data/chatstore
    tenant_scoping_column: tenant_id
    append_only: false
  - table: chat_membership
    plane: CHAT_DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
    rls_policy: tenant_isolation
    rls_required: true
    retention_class: OPERATIONAL
    encryption_class: PLATFORM_MANAGED
    migration: internal/data/chatstore/migrations/00001_chat.sql
    owner_package: internal/data/chatstore
    tenant_scoping_column: tenant_id
    append_only: false
  - table: chat_conversation_idempotency
    plane: CHAT_DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
    rls_policy: tenant_isolation
    rls_required: true
