    owner_package: internal/data/chatstore
    tenant_scoping_column: tenant_id
    append_only: false
  - table: chat_post_revision
    plane: CHAT_DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
    rls_policy: tenant_isolation
    rls_required: true
    retention_class: OPERATIONAL
    encryption_class: PLATFORM_MANAGED
    migration: internal/data/chatstore/migrations/00001_chat.sql
    owner_package: internal/data/chatstore
    tenant_scoping_column: tenant_id
