# Project-owned storage in a separate schema and bounded pool (PM-003).
# The core storage registry scans only root migrations and does not cover
# this package-local migration tree. Project tables have tenant RLS even
# though the first deployment shares the core PostgreSQL instance.
version: 1
module: github.com/monstercameron/human-capital-management-suite
database: projects
sources:
  - internal/data/projectstore/migrations/00001_projects.sql
  - internal/data/projectstore/migrations/00002_project_config.sql
  - internal/data/projectstore/migrations/00003_project_views.sql
  - internal/data/projectstore/migrations/00004_project_links.sql
  - internal/data/projectstore/migrations/00005_project_membership.sql
  - internal/data/projectstore/migrations/00006_project_comments.sql
  - internal/data/projectstore/migrations/00007_project_comment_idempotency.sql
  - internal/data/projectstore/migrations/00008_unified_task_activity.sql
  - internal/data/projectstore/migrations/00009_project_outbox_contract.sql
  - internal/data/projectstore/migrations/00010_project_task_link_tombstone.sql
  - internal/data/projectstore/migrations/00011_task_planning_fields.sql
  - internal/data/projectstore/migrations/00012_task_link_journey.sql
  - internal/data/projectstore/migrations/00013_task_link_target_index.sql
  - internal/data/projectstore/migrations/00014_work_order_links.sql

defaults:
  plane: DATA
  data_role: CONTROL
  isolation_package: internal/data/tenancy
  rls_policy: tenant_isolation
  rls_required: true
  retention_class: OPERATIONAL
  encryption_class: PLATFORM_MANAGED

tables:
  - table: project
    plane: DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
    rls_policy: tenant_isolation
    rls_required: true
    retention_class: OPERATIONAL
    encryption_class: PLATFORM_MANAGED
    migration: internal/data/projectstore/migrations/00001_projects.sql
    owner_package: internal/data/projectstore
    tenant_scoping_column: tenant_id
    append_only: false
  - table: project_task
    plane: DATA
    data_role: CONTROL
    isolation_package: internal/data/tenancy
