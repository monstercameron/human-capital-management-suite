# Unit-test and coverage floor gate (tools/quality/covergate).
#
# Every package holding staged Go files is tested with `go test -cover` before
# a commit (npm run check:coverage:staged); CI gates the whole root module
# (npm run check:coverage). A package fails the gate when any test fails, when
# it has no test files, or when it covers fewer statements than `threshold`.
# Per-file evidence is generated from `go test -coverprofile` by
# tools/planning/cmd/testcoverage -write. After both inventories are refreshed,
# `npm run check:testcoverage` validates file/test digests and rejects missing
# tests, failed test runs and stale rows. Keep this checker opt-in until the
# current inventory can be regenerated from a compiling checkout.
#
# An exception waives exactly one kind (`no_tests` or `below_floor`) for one
# exact package path until `expiry`; its owner must match the package team in
# repository-layout.yaml, service-ownership.yaml or tool-inventory.yaml. Each
# exception needs a reason and a dated remediation action before expiry; an
# expired exception waives nothing. Prefixes and wildcards are refused so a
# new package can never inherit a waiver.
threshold: 70

