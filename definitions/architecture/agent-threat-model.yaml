schema_version: 1
register_id: AGENT2-002
title: "Threat register for delegated long-horizon agents"
status: THREAT_MODELLED
decision_ref: AGENT2-001
persona_decision_ref: AGENTP-001
owner: agent-security-governance

# This is the agent register extension of the existing threat-register
# tooling. Threat identity is the stable tuple (register, asset,
# trust_boundary, attack_class); prose IDs are labels only.
tooling:
  family: tools/planning/threatregister
  representation: REGISTER_EXTENSION
  canonical_identity: "register_id|asset|trust_boundary|attack_class"

required_attack_classes:
  - GOAL_HIJACK
  - TOOL_MISUSE
  - IDENTITY_AND_PRIVILEGE_ABUSE
  - CONFUSED_DEPUTY_AND_TOKEN_PASSTHROUGH
  - MEMORY_AND_CONTEXT_POISONING
  - INSECURE_AGENT_TO_AGENT_DELEGATION
  - CASCADING_FAILURE
  - HUMAN_AGENT_TRUST_EXPLOITATION
  - ROGUE_AGENT_VERSION
  - PEER_MESSAGE_INJECTION
  - AUDIENCE_LEAKAGE
  - OUTPUT_EXFILTRATION
  - CROSS_INVOKER_CONTEXT_BLEED
  - APPROVAL_HIJACK_AND_FATIGUE
  - HANDLE_IMPERSONATION
  - PERSONA_RECRUITMENT_LOOP
  - STALE_MEMBERSHIP
  - SUSPENDED_PERSONA_RUN

required_control_todos:
  - AGENT2-003
  - AGENT2-004
  - AGENT2-005
  - AGENT2-006
  - AGENT2-007
  - AGENT2-008
  - AGENT2-009
  - AGENT2-010
  - AGENT2-011
  - AGENT2-012
  - AGENT2-013
  - AGENT2-014
  - AGENT2-015
  - AGENT2-016
  - AGENT2-017
  - AGENT2-018
  - AGENT2-019
  - AGENT2-020
  - AGENT2-021
  - AGENT2-022
  - AGENT-002
  - AGENT-003
  - AGENT-020
  - AGENT-039
  - AGENTP-005
  - AGENTP-006
  - AGENTP-007
  - AGENTP-008
  - AGENTP-009
  - AGENTP-010
  - AGENTP-011
  - AGENTP-012
  - AGENTP-013
  - AGENTP-014
  - AGENTP-015
  - AGENTP-016
  - AGENTP-017

red_team_cases:
  - AGENT2-023
  - AGENTP-022

threats:
  - id: ATH-001
    asset: agent_goal_and_plan
    trust_boundary: untrusted_content_to_planner
    attack_class: GOAL_HIJACK
    scenario: "A document, chat message, connector result, or memory item changes the user's goal or plan without a user-authorized instruction."
    severity: HIGH
    detection: "quarantine provenance, trusted-goal binding, plan-diff review, and a visible refusal reason"
    recovery: "discard tainted plan state, pause the task, and require the user to restate the goal"
    owner: agent-runtime-security
    control_todos: [AGENT2-013, AGENT2-015, AGENT2-017]
    red_team_case: AGENT2-023
    mitigations: [OBO-QUARANTINE, OBO-PLAN-BINDING]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-002
    asset: skill_and_connection_operations
    trust_boundary: typed_skill_to_tool_gateway
    attack_class: TOOL_MISUSE
    scenario: "A model-selected tool, argument, or connection operation exceeds the published skill schema, tier, data scope, or destination."
    severity: HIGH
    detection: "per-call skill admission, typed schemas, exact capability versions, argument digest, and destination checks"
    recovery: "refuse before the side effect, record the denial, and quarantine the task after repeated misuse"
    owner: agent-runtime-security
    control_todos: [AGENT2-004, AGENT2-005, AGENT2-008, AGENT2-009]
    red_team_case: AGENT2-023
    mitigations: [OBO-SKILL-GATE, OBO-TOOL-GATEWAY]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-003
    asset: delegated_user_authority
    trust_boundary: user_authority_to_agent_step
    attack_class: IDENTITY_AND_PRIVILEGE_ABUSE
    scenario: "A cached grant, stale role, deprovisioned user, or widened skill lets a task act beyond the signed-in user's current authority."
    severity: CRITICAL
    detection: "server-side current-authority decision, grant intersection, short-lived exchange, revocation epoch, and actor-chain audit"
    recovery: "pause the task, void unsubmitted approvals, revoke delegated credentials, and require a fresh user-started task"
    owner: delegated-authority-owner
    control_todos: [AGENT2-003, AGENT2-005, AGENT2-020, AGENT-003]
    red_team_case: AGENT2-023
    mitigations: [OBO-AUTHORITY-INTERSECTION, OBO-REVOCATION]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-004
    asset: delegated_tokens_and_external_credentials
    trust_boundary: agent_gateway_to_connection
    attack_class: CONFUSED_DEPUTY_AND_TOKEN_PASSTHROUGH
    scenario: "An agent forwards a user session token or an administrator credential to another connection, or a destination uses the agent as an ambient deputy."
    severity: CRITICAL
    detection: "audience-bound token exchange, sender constraint, destination-scoped lease, no raw credentials in arguments, and actor-chain audit"
    recovery: "revoke the connection lease and task grant, rotate the affected credential, and block the destination"
    owner: connection-security-owner
    control_todos: [AGENT2-003, AGENT2-007, AGENT2-008, AGENT-002, AGENT-020]
    red_team_case: AGENT2-023
    mitigations: [OBO-NO-TOKEN-PASSTHROUGH, OBO-CONNECTION-LEASE]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-005
    asset: task_ledger_and_context
    trust_boundary: external_result_to_future_step
    attack_class: MEMORY_AND_CONTEXT_POISONING
    scenario: "A hostile result, prompt injection, or stale transcript is retained as trusted task context and steers a later read or write."
    severity: HIGH
    detection: "structured task ledger, taint and provenance labels, context minimization, and verification before governed effects"
    recovery: "remove poisoned context, mark the task tainted, and resume only from a verified checkpoint"
    owner: agent-runtime-security
    control_todos: [AGENT2-010, AGENT2-013, AGENT2-014, AGENT2-015, AGENT2-021]
    red_team_case: AGENT2-023
    mitigations: [OBO-TAINTED-CONTEXT, OBO-VERIFY-BEFORE-EFFECT]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-006
    asset: delegated_agent_chain
    trust_boundary: agent_to_agent_delegation
    attack_class: INSECURE_AGENT_TO_AGENT_DELEGATION
    scenario: "A sub-agent receives a broader scope, longer lifetime, different tenant, or untraceable purpose than its parent run."
    severity: HIGH
    detection: "nested actor chain, authority intersection, bounded purpose and budget, and exact audience binding"
    recovery: "stop the child and parent tasks, revoke their grants, and retain the delegation evidence"
    owner: delegated-authority-owner
    control_todos: [AGENT2-003, AGENT2-010, AGENT2-012, AGENT-003]
    red_team_case: AGENT2-023
    mitigations: [OBO-NESTED-INTERSECTION, OBO-CHAIN-AUDIT]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-007
    asset: task_runtime_and_tenant_capacity
    trust_boundary: long_horizon_task_to_platform
    attack_class: CASCADING_FAILURE
    scenario: "A retry storm, loop, connector outage, or poisoned schedule consumes workers, budget, or downstream capacity across tasks or tenants."
    severity: HIGH
    detection: "step, wake, wall-clock, spend, retry, tenant ceiling, and kill-switch telemetry"
    recovery: "pause affected tasks, fence retries, isolate the tenant or connection, and resume from a verified checkpoint"
    owner: agent-operations-owner
    control_todos: [AGENT2-010, AGENT2-011, AGENT2-012, AGENT2-022, AGENT-039]
    red_team_case: AGENT2-023
    mitigations: [OBO-BOUNDS, OBO-KILL-SWITCH]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-008
    asset: user_approval_and_trust
    trust_boundary: agent_proposal_to_user_decision
    attack_class: HUMAN_AGENT_TRUST_EXPLOITATION
    scenario: "Approval fatigue, a misleading approval card, hidden batch items, or an agent-originated decision causes the user to approve an effect they did not understand."
    severity: HIGH
    detection: "exact digest, itemized batch capped at 25, material fields and sources, step-up, and product-surface-only approval"
    recovery: "expire the approval, cancel the task, notify the user, and route any submitted intent through its normal correction path"
    owner: agent-product-governance
    control_todos: [AGENT2-006, AGENT2-016, AGENT2-017, AGENT2-018, AGENT2-022, AGENT-003]
    red_team_case: AGENT2-023
    mitigations: [OBO-EXACT-APPROVAL, OBO-APPROVAL-SEPARATION]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: ATH-009
    asset: published_agent_version_and_manifest
    trust_boundary: agent_publication_to_runtime
    attack_class: ROGUE_AGENT_VERSION
    scenario: "A widened, unreviewed, stale, or compromised agent version changes instructions, skills, model policy, or autonomy after installation."
    severity: CRITICAL
    detection: "immutable version digest, evaluation gate, separation of duties, quarantine, rollback, and kill switch"
    recovery: "quarantine the version, stop new work, revoke its installations, roll back to the last eligible version, and audit the change"
    owner: agent-release-security
    control_todos: [AGENT2-004, AGENT2-019, AGENT2-020, AGENT-039]
    red_team_case: AGENT2-023
    mitigations: [OBO-IMMUTABLE-VERSION, OBO-QUARANTINE]
    tests: [{kind: SECURITY, name: TestTodo_AGENT2_023_Security}]
  - id: APTH-001
    asset: persona_goal_and_plan
    trust_boundary: peer_message_to_persona_planner
    attack_class: PEER_MESSAGE_INJECTION
    precedent: SERVICENOW_SECOND_ORDER_INJECTION
    scenario: "A low-privilege member plants instructions in a channel and a manager's persona later treats the peer text as an authorized goal, subject, recipient, or tool instruction."
    severity: HIGH
    detection: "invoker binding, UNTRUSTED_PEER taint, quarantined extraction, and plan-diff review"
    recovery: "discard peer-derived plan state and require a fresh invoker instruction"
    owner: agent-runtime-security
    control_todos: [AGENTP-008, AGENTP-010, AGENTP-011, AGENTP-012]
    red_team_case: AGENTP-022
    red_team_case_id: peer-injection
    mitigations: [PERSONA-PEER-QUARANTINE]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-002
    asset: persona_answer_and_citations
    trust_boundary: invoker_authority_to_shared_conversation
    attack_class: AUDIENCE_LEAKAGE
    precedent: SLACK_AI_SHARED_CHANNEL_LEAKAGE
    scenario: "A persona cites or summarizes a private record in a shared thread where one audience member cannot read the source or data class."
    severity: CRITICAL
    detection: "commit-time audience computation and source, field, citation, and data-class reauthorization"
    recovery: "replace the public answer with a neutral receipt and deliver the full result only to the invoker"
    owner: agent-product-governance
    control_todos: [AGENTP-007, AGENTP-011, AGENTP-012, AGENTP-013, AGENTP-017]
    red_team_case: AGENTP-022
    red_team_case_id: audience-leak
    mitigations: [PERSONA-AUDIENCE-FLOOR]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-003
    asset: persona_output_links_and_images
    trust_boundary: persona_renderer_to_conversation_client
    attack_class: OUTPUT_EXFILTRATION
    precedent: ECHOLEAK_REMOTE_CONTENT_EXFILTRATION
    scenario: "A crafted result, citation or tainted field causes a remote image, embed or URL to disclose a private value outside the tenant."
    severity: CRITICAL
    detection: "rendering allowlist rejects remote embeds, auto-loading images, and tainted URL construction"
    recovery: "drop the unsafe output, record the denial, and keep the result private"
    owner: agent-egress-security
    control_todos: [AGENTP-010, AGENTP-012, AGENTP-013, AGENTP-017]
    red_team_case: AGENTP-022
    red_team_case_id: audience-leak
    mitigations: [PERSONA-SAFE-OUTPUT]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-004
    asset: invoker_scoped_thread_context
    trust_boundary: one_thread_to_multiple_invocations
    attack_class: CROSS_INVOKER_CONTEXT_BLEED
    precedent: SHARED_THREAD_CONTEXT_CONFUSION
    scenario: "One invoker's readable posts, result, subject or approval become context for another invoker's run in the same thread."
    severity: HIGH
    detection: "invocation-scoped context, post digests, actor-chain binding, and per-invoker result partition"
    recovery: "discard crossed context and restart only from the affected invoker's verified scope"
    owner: agent-runtime-security
    control_todos: [AGENTP-008, AGENTP-009, AGENTP-010, AGENTP-011, AGENTP-017]
    red_team_case: AGENTP-022
    red_team_case_id: peer-injection
    mitigations: [PERSONA-INVOKER-ISOLATION]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-005
    asset: chat_confirmation_and_approval_cards
    trust_boundary: persona_proposal_to_chat_callback
    attack_class: APPROVAL_HIJACK_AND_FATIGUE
    precedent: BUSY_CHANNEL_APPROVAL_HIJACK
    scenario: "A colleague clicks another member's card, a reaction is treated as consent, or busy-channel repetition causes the invoker to approve an opaque batch."
    severity: HIGH
    detection: "invoker-only ephemeral card, exact digest, 15-minute expiry, itemized approval, and task-view step-up"
    recovery: "reject the callback, expire the card, and require a fresh invoker approval"
    owner: agent-product-governance
    control_todos: [AGENTP-006, AGENTP-014, AGENTP-015, AGENTP-016]
    red_team_case: AGENTP-022
    red_team_case_id: approval-hijack
    mitigations: [PERSONA-INVOKER-APPROVAL]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-006
    asset: persona_handle_and_badge
    trust_boundary: chat_identity_to_mention_resolver
    attack_class: HANDLE_IMPERSONATION
    precedent: DISPLAY_NAME_CONFUSION
    scenario: "A person or untrusted bot uses a look-alike handle or display name so a member invokes the wrong principal or mistakes a persona for a human."
    severity: HIGH
    detection: "reserved handle namespace, confusable checks, server resolution, and permanent agent badge"
    recovery: "refuse unresolved or look-alike handles and show the verified persona identity"
    owner: agent-identity-governance
    control_todos: [AGENTP-005, AGENTP-008, AGENTP-017]
    red_team_case: AGENTP-022
    red_team_case_id: handle-impersonation
    mitigations: [PERSONA-VERIFIED-HANDLE]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-007
    asset: persona_delegation_graph
    trust_boundary: persona_to_persona_invocation
    attack_class: PERSONA_RECRUITMENT_LOOP
    precedent: AGENT_TO_AGENT_RECRUITMENT
    scenario: "A persona recruits another persona, creates an invocation loop, or launders a wider skill ceiling through a peer agent."
    severity: HIGH
    detection: "persona-post invocation refusal, bounded actor chain, cycle detection, and ceiling intersection"
    recovery: "stop the child and parent invocation and retain the delegation evidence"
    owner: agent-runtime-security
    control_todos: [AGENTP-006, AGENTP-008, AGENTP-015, AGENTP-016]
    red_team_case: AGENTP-022
    red_team_case_id: recruitment
    mitigations: [PERSONA-NO-RECRUITMENT]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-008
    asset: conversation_audience_snapshot
    trust_boundary: membership_change_to_result_commit
    attack_class: STALE_MEMBERSHIP
    precedent: POST_TIME_AUDIENCE_DRIFT
    scenario: "A guest, external member or newly joined reader changes the audience after computation but before the public result or shared private answer is committed."
    severity: HIGH
    detection: "commit-time membership recheck including public eligibility, guests, and external members"
    recovery: "recompute the audience floor, drop failing items, and keep the remainder private"
    owner: agent-product-governance
    control_todos: [AGENTP-007, AGENTP-012, AGENTP-013, AGENTP-014, AGENTP-017]
    red_team_case: AGENTP-022
    red_team_case_id: audience-leak
    mitigations: [PERSONA-COMMIT-AUDIENCE-RECHECK]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
  - id: APTH-009
    asset: persona_run_and_waiting_task
    trust_boundary: lifecycle_control_to_next_persona_step
    attack_class: SUSPENDED_PERSONA_RUN
    precedent: REVOKED_AGENT_CONTINUATION
    scenario: "A suspended version, persona, installation or tenant kill switch stops new mentions but an already waiting run still takes its next step or presents an old approval."
    severity: CRITICAL
    detection: "revocation epoch recheck before every step and card callback"
    recovery: "pause the task, void unsubmitted approvals, expire cards, and render the persona unavailable"
    owner: agent-operations-owner
    control_todos: [AGENTP-006, AGENTP-014, AGENTP-016, AGENTP-017]
    red_team_case: AGENTP-022
    red_team_case_id: suspend-race
    mitigations: [PERSONA-REVOCATION-FENCE]
    tests: [{kind: SECURITY, name: TestTodo_AGENTP_022_Security}]
