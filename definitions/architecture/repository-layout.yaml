# Approved process set (companion to definitions/architecture/process-roles.yaml, SVC-001).
approved_commands:
  initial:
    - hcmnext
    - worker
    - projector
    - migrate
    - hcmctl
    - scheduler
    - frontenddev
  later: []

# The legacy Go module at src/blocks/go is a separate module (its own
# go.mod, module human-capital-management-suite-executor) and is out of scope of this root-module
# policy. It is historical implementation evidence per the Go technology
# constitution's "Legacy Repository Treatment" and is not extended with new
# behavior.
legacy_module_exemptions:
  - path: src/blocks/go
    module: human-capital-management-suite-executor
    reason: >-
      Separate Go module with its own go.mod/go.sum; not part of the root
      module's package graph and not governed by this layout policy.
    owner: platform-foundation
    expiry: P1B

# Time-boxed, reviewed exceptions to the rules above. Each waiver documents a
# real, currently-observed condition rather than hiding it: the layout
# checker still classifies these paths, and TestRepositoryLayoutRejectsUnownedOrMisplacedPackage
# reports every waived path via t.Logf so the exception stays visible. A
# waiver expiring without resolution is expected to be re-reviewed, not
# silently renewed.
waivers:
  - path_prefix: node_modules/
    kind: non_source_vendor_tree
    observed: "2026-09-02"
    owner: platform-foundation
    rationale: >-
      npm-managed vendor tree. "go list ./..." resolves a stray Go source
      file bundled inside the "flatted" npm package
      (node_modules/flatted/golang/pkg/flatted/flatted.go). It is vendored
      third-party npm package content, not Human Capital Management Suite production Go source,
      so it is out of scope of this policy rather than a real violation.
    expiry: P1B
