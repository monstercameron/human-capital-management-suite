# Dependency-role and ownership manifest (LIB-001).
#
# Consumed by tools/policy/depmanifest. Classifies every module declared in
# the root go.mod's require block (direct and the "notable indirect ones"
# per LIB-001's own phrasing) so nothing enters the build ungoverned.
#
# Governing rule (planning/todos.md, section 2B): Human Capital Management Suite owns HCM
# semantics; third-party libraries provide infrastructure mechanics. Per the
# LIB-001 RED clause, PROJECT_CORE is reserved for exactly the entries in
# project_core_reserved below (Go itself, GWC, grpcbridge, SchemaFlux) and
# for nothing else — every module row in this file MUST NOT be
# PROJECT_CORE.
#
# Roles: PROJECT_CORE | INFRASTRUCTURE_MECHANIC | DEV_TEST_ONLY | PROHIBITED.
#
# Scope note: this manifest classifies go.mod's own require list rather than
# the full "go list -m all" build list. Go's module graph pruning (module
# graph pruning, Go 1.17+) already keeps go.mod's indirect requires to the
# modules actually needed to build packages this module imports; "go list -m
# all" additionally enumerates modules that ship in a dependency's own
# go.mod but are never built into anything Human Capital Management Suite produces (for example
# unused cloud-provider SDKs pulled in only for MVS version bookkeeping by
# grpc-go's or testcontainers-go's own go.mod). Governing those would create
# manifest rows with no owner able to give a meaningful upgrade SLA or
# exposure statement. TOOL-019 (dependency-graph pruning/audit) is the place
# to decide whether any such module warrants an explicit PROHIBITED row.

version: 1
module: github.com/monstercameron/human-capital-management-suite
source: go.mod require block

project_core_reserved:
  - name: go (toolchain)
    note: The Go standard library and toolchain itself; not a go.mod module.
  - name: GWC / GoWebComponents
    note: Preferred UI library; not yet a go.mod dependency (qualification fixture runs before P1B).
  - name: grpcbridge
    note: Preferred transport edge; not yet a go.mod dependency (qualification fixture runs in M2).
  - name: SchemaFlux
    note: Preferred definition generator; not yet a go.mod dependency (qualification fixture runs in M2).

# Prefix-based defaults for maintainability (LIB-001 GREEN: "keep
# golang.org/x/* and google.golang.org/* families classifiable by prefix
# rule"). tools/policy/depmanifest applies a family rule only when no exact
# module row below matches; every module currently in go.mod already has an
# exact row, so these defaults only cover a *future* addition to go.mod
# within these families until someone gives it its own row.
family_rules:
  - prefix: golang.org/x/
    role: INFRASTRUCTURE_MECHANIC
    semantic_owner: platform-foundation
    license_owner: platform-foundation
    security_owner: platform-foundation
    upgrade_sla: Tracks the Go project's own release cadence; security patch within 14 days.
    exposure: >-
      Supporting Go-ecosystem mechanics. Exact exposure depends on which x/
      package; add an exact row once a package in this family is imported
      directly by production (non-tools/tests) code.
    replacement_strategy: >-
      No blanket replacement; each x/ package is evaluated against the Go
      standard-library-first selection order on first direct import.
    allowed_import_roots: []
  - prefix: google.golang.org/
    role: INFRASTRUCTURE_MECHANIC
    semantic_owner: experience-and-transport
    license_owner: platform-foundation
    security_owner: platform-foundation
    upgrade_sla: Tracks google.golang.org/grpc and google.golang.org/protobuf's own pins; security patch within 7 days.
    exposure: >-
      Protobuf/gRPC wire and transport mechanics. Exact exposure depends on
      the specific module; add an exact row once imported directly.
    replacement_strategy: Tracks the qualified gRPC/Protobuf toolchain decision (TOOL-002, TOOL-008).
    allowed_import_roots: []
  - prefix: go.opentelemetry.io/
    role: INFRASTRUCTURE_MECHANIC
    semantic_owner: platform-foundation
    license_owner: platform-foundation
    security_owner: platform-foundation
    upgrade_sla: Tracks google.golang.org/grpc's transitive pin; security patch within 14 days.
    exposure: >-
      OpenTelemetry API, SDK and OTLP/stdout exporters. Imported only by
      internal/platform/telemetry/otel (OBS-002); every other package reaches
      telemetry through that adapter.
    replacement_strategy: >-
      OBS-002 decides the OTel SDK adoption explicitly; until then these are
      transitive-only.
    allowed_import_roots:
      [
        internal/platform/telemetry/otel,
        internal/transport/otelmw,
        internal/connectivity/providertelemetry,
      ]

