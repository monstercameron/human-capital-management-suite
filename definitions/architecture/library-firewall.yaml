# Library-firewall qualification data (LIB-002/003/004/006/007/008).
#
# Consumed by tools/policy/libfirewall. This file does not replace or
# duplicate definitions/architecture/dependency-roles.yaml (LIB-001, edited
# by a different agent/lane): the generic LIB-002 firewall
# (libfirewall.CheckImport) reads allowed_import_roots directly from that
# manifest. This file adds module-specific qualification details for
# LIB-003/004/006/007/008: module-match paths for AST leak scanning, concrete
# types that must never leak past owning APIs, and reviewed markers for
# hand-authored Go migrations. LIB-003 scans its qualified wire/transport
# modules together, so its roots are their reviewed union; LIB-002 still
# enforces each dependency-roles.yaml row's exact, module-specific roots.
#
# See planning/specs/go-only-technology-constitution.md and the LIB-003/
# LIB-004/LIB-006/LIB-007/LIB-008 todo entries in planning/todos.md.

version: 1
module: github.com/monstercameron/human-capital-management-suite

# LIB-003: Protobuf/grpc-go qualified as wire and RPC mechanics only.
#
# These are explicit package roots for the combined LIB-003 integration scan,
# including cmd because the exact grpc/connect rows admit that composition
# root. The independent LIB-002 gate continues to deny cmd a direct protobuf
# import, per the protobuf row in dependency-roles.yaml. Neither gate grants
# domain or kernel packages a wire dependency.
protobuf_grpc:
  modules:
    - google.golang.org/protobuf
    - google.golang.org/grpc
    - connectrpc.com/connect
    - google.golang.org/genproto/googleapis/rpc
  allowed_import_roots:
    - gen
    - schema/proto/gen
    - internal/transport
    - internal/data/projection/wire
    - internal/data/provenance
    - internal/data/roleaccessstore
    - internal/data/siemstore
    - internal/application
    - internal/intent/app
    - internal/intent/protomap
    - internal/engines/wire
    - internal/timeclockapp
    - tools/gen
    - tools/uxqual/journeyclient
    - tools/uxqual/cmd/journeywasm
    - tools/uxqual/productclient
    - tools/clockpartner
    - tools/timeclockkit
    - tools/uxqual/projectclient
    - tools/quality/bufprotovalidatekit
    - cmd

# LIB-004: pgx/v5 confined behind the PostgreSQL adapter boundary. The
# leak-scan runs over dependency-roles.yaml's own pgx row
# (allowed_import_roots in dependency-roles.yaml) via depmanifest,
# not a separate list here, so this file only needs to name the concrete
# types that must never appear in an exported signature/alias anywhere in
# the graph, even inside those allowed roots.
pgx_leak_types:
  - github.com/jackc/pgx/v5.Tx
  - github.com/jackc/pgx/v5.Rows
  - github.com/jackc/pgx/v5.Conn

# LIB-006: apd/v3 confined behind the decimal kernel. Same pattern: the scan
# scope comes from dependency-roles.yaml's apd row
# (allowed_import_roots: [internal/kernel]); this only names the leaked type.
apd_leak_types:
  - github.com/cockroachdb/apd/v3.Decimal

# LIB-007: OpenTelemetry confined to the owned adapters admitted by OBS-002.
# dependency-roles.yaml's go.opentelemetry.io/ family_rule carries
# allowed_import_roots: [internal/platform/telemetry/otel,
# internal/transport/otelmw, internal/connectivity/providertelemetry], and
# exact rows pin the versions of the directly imported subpackages (otel,
# otel/trace, otel/metric, the SDK and the OTLP/stdout exporters), so the
# generic LIB-002 firewall enforces those roots on every direct import;
# this entry only pins the module prefix for the AST leak-scan / reporting
# so this file's tests read the family the same way dependency-roles.yaml
# names it.
otel_module_prefix: go.opentelemetry.io/

# LIB-008: goose confined to explicit SQL-first migration runners. Scan scope
# comes from dependency-roles.yaml's goose row
# (allowed_import_roots in dependency-roles.yaml). marker_comment is the required
# review marker on any hand-authored Go migration file (as opposed to a
# goose embed/registration boilerplate file); its absence is what RED means
# by "a Go migration lacking explicit need, idempotency and resumable
# failure contract" until a fuller review-evidence format exists.
goose_go_migration_marker: "GOOSE-GO-MIGRATION-REVIEWED:"
