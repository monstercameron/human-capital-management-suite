# The one Phase 1 vertical slice (definitions/planning/product-slices.yaml
# names exactly one live slice_id: "promotion") and its two compiled
# workflows, P1A's no-effect variant and P1B's bounded-write variant.
workflows:
  - id: promotion.preflight-simulate-observe/v1
    vertical_slice: promotion
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A's single compiled workflow; thin CAPABILITY/TRANSFORM/DECISION/OBSERVE/END steps only, ExecutionState never leaves NOT_PLANNED."
  - id: promotion.execute/v1
    vertical_slice: promotion
    gate: P1B
    disposition: INCLUDE
    rationale: "next-steps.md M5's P1B workflow, adding APPROVAL/TASK/WAIT/SIGNAL/COMPENSATE with compiler-placed safe points; gated behind a signed Gate A PROCEED."

# The twenty user flows in planning/user-flows/catalog.md. UF-001..UF-007
# are the generic and Promotion-specific flows the pilot workspace actually
# needs; UF-008 is explicitly a conformance-track-only flow
# (next-steps.md's Medical Leave conformance track); UF-009..UF-020 belong
# to other domains next-steps.md's "Explicitly deferred" list names
# (onboarding/ATS, cases, payroll, batch, analytics, operator intervention,
# headcount planning, interview scheduling, assisted channel).
user_flows:
  - id: UF-001
    archetype: "UF-A1/A2/A3/A5/A7/A8"
    gate: P1A
    disposition: INCLUDE
    rationale: "action discovery is required for any permitted principal to find the Promotion workspace (product-slices.yaml promotion exit_criteria)."
  - id: UF-002
    archetype: "UF-A1/A2/A3"
    gate: P1A
    disposition: INCLUDE
    rationale: "draft create/save/resume backs Promotion's proposal-drafting step."
  - id: UF-003
    archetype: "UF-A2/A6"
    gate: P1A
    disposition: INCLUDE
    rationale: "simulate/compare/submit is the core P1A Promotion preflight-simulate-observe path."
  - id: UF-004
    archetype: "UF-A4"
    gate: P1B
    disposition: INCLUDE
    rationale: "reviewer decision backs the one P1B approve_proposal/reject_proposal task the Implementation-Depth Matrix authorizes."
  - id: UF-005
    archetype: "all"
    gate: P1A
    disposition: INCLUDE
    rationale: "tracking a long-running intent backs the Promotion timeline/status surface named in product-slices.yaml exit_criteria."
  - id: UF-006
    archetype: "all"
    gate: P1A
    disposition: INCLUDE
    rationale: "cancel/correct/supersede backs IntentService.CancelIntent/SupersedeIntent, already in the generated endpoint manifest for the Promotion intent lifecycle."
  - id: UF-007
    archetype: "UF-A2/A4/A6"
    gate: P1A
    disposition: INCLUDE
    rationale: "the detailed reference flow for the Promotion + Compensation Change workflow itself (planning/user-flows/reference/promote-into-management.md)."
  - id: UF-008
    archetype: "UF-A3/A4/A6"
    gate: NONE
    disposition: DEFER
    rationale: "next-steps.md's Medical Leave conformance track keeps this contract/vector conformance only, explicitly outside Gate A/B production; stop after two unchanged clean gap passes."
  - id: UF-009
    archetype: "UF-A9/A4"
    gate: NONE
    disposition: DEFER
    rationale: "candidate onboarding flow; next-steps.md Explicitly deferred names ATS/onboarding scope out of P1A/P1B."
  - id: UF-010
    archetype: "UF-A5/A4"
    gate: NONE
    disposition: DEFER
    rationale: "confidential HR case flow; next-steps.md Explicitly deferred names general cases/forms out of P1A/P1B."
  - id: UF-011
    archetype: "UF-A5/A4"
    gate: NONE
    disposition: DEFER
    rationale: "HR case resolution flow; same general-cases deferral as UF-010."
  - id: UF-012
    archetype: "UF-A6"
    gate: NONE
    disposition: DEFER
    rationale: "HRIS DataOps operator flow; execution-plan.md's HRIS DataOps Operator-Surface Rule keeps this operator-only unless a design partner needs it independently, which is not yet selected."
  - id: UF-013
    archetype: "UF-A6/A4"
    gate: NONE
    disposition: DEFER
    rationale: "payroll exception flow; next-steps.md Explicitly deferred names native payroll out of P1A/P1B."
  - id: UF-014
    archetype: "UF-A7/A2"
    gate: NONE
    disposition: DEFER
    rationale: "population/batch action flow; next-steps.md Explicitly deferred names bulk/batch/event automation out of P1A/P1B."
  - id: UF-015
    archetype: "UF-A8/A2"
    gate: NONE
    disposition: DEFER
    rationale: "analytics/ask flow; next-steps.md Explicitly deferred names broad analytics/search/reports out of P1A/P1B."
  - id: UF-016
    archetype: "UF-A10/A6"
    gate: NONE
    disposition: DEFER
    rationale: "operator workflow-intervention flow beyond the Promotion workflow's own inspect/replay/recovery; the Implementation-Depth Matrix's Workflow kernel row bounds Gate B to Promotion nodes only."
  - id: UF-017
    archetype: "UF-A1"
    gate: NONE
    disposition: DEFER
    rationale: "self-service contact-change flow is not part of the Promotion + Compensation Change reference workflow plan.md defines as the only fully executable Phase 1 workflow."
  - id: UF-018
    archetype: "UF-A2/A4"
    gate: NONE
    disposition: DEFER
    rationale: "headcount/requisition flow; Position/headcount row of the Implementation-Depth Matrix bounds Phase 1 to read/simulate capacity, not headcount request creation."
  - id: UF-019
    archetype: "UF-A9/A4"
    gate: NONE
    disposition: DEFER
    rationale: "interview scheduling flow; recruiting/ATS is named in next-steps.md's Explicitly deferred list."
  - id: UF-020
    archetype: "composed source archetype"
    gate: NONE
    disposition: DEFER
    rationale: "assisted/manual-continuity channel for any enabled self-service intent; scoped only once a concrete Phase 1 self-service intent set is selected, which is CUSTOMER-001/SELECT-002 territory, not this ceiling."

