# The five effect classes Phase 1 build work may ever produce, plus the
# irreversible-external-mutation class it must never reach without a
# separate signed scope exchange.
effects:
  - class: READ_ONLY
    gate: P1A
    disposition: INCLUDE
    rationale: "the entire P1A capability surface; p1a-manifest.yaml's own effect_ceiling requires zero worker/employment/assignment/organization/position/compensation/budget mutations, zero reservations/WorkItems/timers, zero committed external effects."
  - class: INTERNAL_MUTATION
    gate: P1B
    disposition: INCLUDE
    rationale: "bounded to the job, manager, organization and compensation fields plan.md's Phase 1 primary scope names; carried by promote_worker/EXECUTE, change_base_pay, reserve/release_compensation_budget, approve/reject_proposal."
  - class: EXTERNAL_PROVIDER_WRITE
    gate: P1B
    disposition: INCLUDE
    provider_dependency: "UNBOUND_PENDING_SELECT-002"
    rationale: "plan.md Phase 1 primary scope: exactly one primary HCM connector gains narrowly scoped writeback only after the authority gate; which provider is SELECT-002's open selection, not this ceiling's."
  - class: IRREVERSIBLE_EXTERNAL_MUTATION
    gate: NONE
    disposition: REJECT
    rationale: "plan.md 3.12 Portfolio Discipline: native payroll, WFM, benefits or other suite-depth investment must pass the authority-absorption gate, which has not happened; next-steps.md's Explicitly deferred list names native payroll/benefits/time/ATS/IAM out of P1A/P1B."
  - class: OUTBOUND_MESSAGE_INTENT
    gate: P1B
    disposition: DEFER
    rationale: "execution-plan.md's Communications Plane Slice: P1A sends nothing, P1B sends one kind of message only if the selected customer path needs it - conditional on CUSTOMER-001/SELECT-002, which this ceiling does not resolve."

# Four selection slots, deliberately empty. NEXT-002's dependency chain
# fills them; a filled slot here is a PHASE-001 REFACTOR violation.
selection_slots:
  - name: provider
    filling_todo_id: "SELECT-002"
    filled: false
  - name: jurisdiction
    filling_todo_id: "SELECT-001"
    filled: false
  - name: topology
    filling_todo_id: "SELECT-002"
    filled: false
  - name: slo
    filling_todo_id: "SELECT-002, COMMERCIAL-001"
    filled: false

# Everything else in the wider catalog: named buckets, each visibly
# deferred, so "all other catalog items remain visibly deferred" is a
# checkable list rather than a sentence in a comment. No bucket here may
# ever be silently promoted into the intents/capabilities/workflows/
# user_flows/endpoints/models/effects sections above without a new signed
# scope exchange (next-steps.md's stop rules).
deferred_domains:
  - name: remaining_catalog_vocabulary
    source_ref: "specs/business-intent-catalog.md#vocabulary-list-non-normative"
    rationale: "the ~530-name intake vocabulary minus the fourteen source-bound intents above (516 unbound names); business-intent-catalog.md itself: 'no work item may depend on ingesting, partitioning, or attesting it.'"
  - name: native_payroll_benefits_time_ats_iam
    source_ref: "next-steps.md#explicitly-deferred"
    rationale: "must pass the authority-absorption gate (plan.md 3.12 Portfolio Discipline), which has not happened."
  - name: medical_leave_implementation
    source_ref: "next-steps.md#medical-leave-conformance-track"
    rationale: "contract/vector conformance only; a real jurisdiction, provider write or production leave endpoint requires a separately staffed and legally reviewed product gate."
  - name: general_cases_forms_dataops
    source_ref: "next-steps.md#explicitly-deferred"
    rationale: "HRIS DataOps productizes only the slices a design partner uses independently (execution-plan.md HRIS DataOps Operator-Surface Rule); none selected yet."
  - name: agents
    source_ref: "plan.md#phase-1-changeops-overlay"
    rationale: "Implementation-Depth Matrix: 'OUT unless scope-exchanged' at every gate; Phase 1 product core is Go only, agent code is not included."
  - name: broad_analytics_search_reports
    source_ref: "plan.md#phase-1-changeops-overlay"
    rationale: "Implementation-Depth Matrix Search/OLAP/vector/Kafka/full billing row: OUT at every Phase 1 gate."
  - name: bulk_batch_event_automation
    source_ref: "next-steps.md#explicitly-deferred"
    rationale: "no Phase 1 workflow requires population-scope batch operations."
  - name: advanced_workflow_steps
    source_ref: "next-steps.md#m5--p1b-bounded-write-path"
    rationale: "PARALLEL, JOIN, SUBWORKFLOW, live migration and shadow execution are explicitly not P1B prerequisites."
  - name: multiple_connectors
    source_ref: "execution-plan.md#integration-platform-slice"
    rationale: "Phase 1 does not promise other named connectors, bidirectional coverage for every vendor object, or marketplace certification."
  - name: webhooks_sync_mft
    source_ref: "next-steps.md#explicitly-deferred"
    rationale: "outside the one reusable external-system path Phase 1 builds."
  - name: omnichannel_messaging
    source_ref: "execution-plan.md#communications-plane-slice"
    rationale: "no omnichannel, preference, thread, bulk, or legal-notice work is in Phase 1; the secure inbox is a minimal contract only."
  - name: kafka_cache_search_vector_clickhouse
    source_ref: "plan.md#phase-1-changeops-overlay"
    rationale: "Implementation-Depth Matrix: OUT at every Phase 1 gate; adopt only after measured need (Phase 2 promotion evidence)."
  - name: multi_cell_relocation
    source_ref: "next-steps.md#explicitly-deferred"
    rationale: "Implementation-Depth Matrix Tenant placement row: logical tenant/cell identity and per-tenant limits only at Phase 1; multiple cells/live relocation is later phase scope."
  - name: legacy_node_typescript_production_paths
    source_ref: "execution-plan.md#legacy-baseline-rule"
    rationale: "the P1B release image contains no Node, TypeScript, React, or Vite runtime; legacy may only run beside the Go slice through P1A as a comparison baseline."
  - name: workforce_os_broader_platform_planes
    source_ref: "plan.md#3-portfolio-discipline"
    rationale: "the Workforce Operating System is a destination architecture, not a mandate to build the whole catalog at once; every proposed product family must separately pass the four investment tests before scope enters any ceiling."

