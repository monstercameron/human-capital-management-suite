# PHASE-001 Phase 1 scope-ceiling manifest.
#
# Schema: tools/planning/scopeceiling.ScopeCeilingManifest. Validated by
# tools/planning/scopeceiling.ScopeCeilingManifest.Validate, verified by
# tools/planning/scopeceiling.VerifyManifestSignature, and reported by
# `go run ./tools/planning/cmd/scopeceiling`.
#
# This is the maximum candidate Phase 1 scope ceiling: every intent,
# capability, workflow, user flow, endpoint, model and effect this document
# names INCLUDE is the outer bound Phase 1 build work may ever draw from
# across BOTH P1A and P1B; everything else in the wider catalog is named
# DEFER or REJECT below or bucketed under deferred_domains. It is NOT the
# selection-bound P1A release manifest - that sibling document is
# definitions/planning/gates/p1a-manifest.yaml (NEXT-002), which this
# manifest's own tests (tools/planning/scopeceiling's Conformance suite)
# check is a SUBSET of this ceiling, never an input to it. The four
# selection_slots below (provider, jurisdiction, topology, slo) are
# deliberately empty: filling them here would make this ceiling BE the
# NEXT-002 selection it is supposed to bound, defeating PHASE-001's REFACTOR
# clause ("selection cannot logically depend on a manifest that already
# requires the selection").
#
# Built independently from p1a-manifest.yaml, from:
#   - definitions/planning/capability-coverage.yaml (the fourteen
#     DRAFT_CONTRACT business intents and ten bootstrap capabilities;
#     cross-checked live by scopeceiling's Conformance/PRIMARY tests)
#   - definitions/planning/product-slices.yaml (the one live "promotion"
#     vertical slice; cross-checked live)
#   - definitions/api/endpoint-manifest.json (the fourteen generated
#     endpoint definitions; cross-checked live)
#   - planning/specs/business-intent-catalog.md (kernel family / side
#     effect / P1A-P1B-conformance release column for all fourteen intents)
#   - planning/specs/http-grpc-endpoint-contract.md (the nineteen additional
#     specified-but-not-yet-generated endpoints, and the endpoint
#     disposition enum)
#   - planning/user-flows/catalog.md (the twenty UF-001..UF-020 flows)
#   - planning/execution-plan.md (the Phase 1 Implementation-Depth Matrix
#     and the Plane Dependency Rule's named domain/kernel model specs)
#   - planning/next-steps.md (the P1A eight-intent / P1B six-contract lists,
#     and the "Explicitly deferred" bucket list)
#   - planning/plan.md (Phase 1: ChangeOps Overlay; 3.12 Portfolio
#     Discipline's native payroll/WFM/benefits authority-absorption gate)
#
# CanonicalDigest hashes every field below except `signature`; do not hand-
# edit any field above `signature` without re-signing (see ceiling_test.go's
# TestPhaseOneManifestContainsOnlyAuthorizedSourceBoundExecutableScope and
# security_test.go's TestTodo_PHASE_001_Security for what breaks).
schema_version: 1
todo_id: PHASE-001
signed_date: "2026-09-13"
freshness_window_days: 30

# The fourteen source-bound BusinessIntent definitions
# (planning/specs/business-intent-catalog.md's DRAFT_CONTRACT catalog,
# cross-checked live against definitions/planning/capability-coverage.yaml's
# `kind: intent` entries). This is the entire catalog: the ~530-name intake
# list is non-normative vocabulary and is bucketed under deferred_domains
# instead of enumerated here one by one.
intents:
  - id: hcmnext.people.explain_worker_state/v1
    owner_domain: PEOPLE
    kernel_family: ANALYTICAL_REQUEST
    side_effect: READ_ONLY
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #1; ANALYTICAL_REQUEST/READ_ONLY carries no mutation risk."
  - id: hcmnext.people.promote_worker/v1
    owner_domain: PEOPLE
    kernel_family: CHANGE_REQUEST
    side_effect: INTERNAL_MUTATION
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #2 in DRAFT/PREFLIGHT/SIMULATE modes only; EXECUTE mode is bounded to P1B (next-steps.md P1B contract #1) and requires a signed Gate A PROCEED that authority-gate-decision.yaml does not yet record."
  - id: hcmnext.rewards.simulate_compensation/v1
    owner_domain: REWARDS
    kernel_family: CALCULATION_REQUEST
    side_effect: PURE
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #3; CALCULATION_REQUEST/PURE, no domain mutation possible."
  - id: hcmnext.rewards.evaluate_pay_band_position/v1
    owner_domain: REWARDS
    kernel_family: CALCULATION_REQUEST
    side_effect: PURE
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #4; CALCULATION_REQUEST/PURE."
  - id: hcmnext.intelligence.explain_transaction/v1
    owner_domain: PROVENANCE
    kernel_family: ANALYTICAL_REQUEST
    side_effect: READ_ONLY
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #5."
  - id: hcmnext.operations.detect_drift/v1
    owner_domain: RECONCILIATION
    kernel_family: ANALYTICAL_REQUEST
    side_effect: READ_ONLY
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #6."
  - id: hcmnext.operations.create_repair_plan/v1
    owner_domain: REPAIR
    kernel_family: ANALYTICAL_REQUEST
    side_effect: READ_ONLY
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #7, recommendation-only; RepairPlan is never executable in P1A."
  - id: hcmnext.operations.simulate_repair/v1
    owner_domain: REPAIR
    kernel_family: CALCULATION_REQUEST
    side_effect: PURE
    gate: P1A
    disposition: INCLUDE
    rationale: "next-steps.md P1A executable intent #8; CALCULATION_REQUEST/PURE."
  - id: hcmnext.rewards.change_base_pay/v1
    owner_domain: REWARDS
    kernel_family: CHANGE_REQUEST
    side_effect: INTERNAL_MUTATION
    gate: P1B
    disposition: INCLUDE
    rationale: "next-steps.md P1B contract #2, bounded to the job/manager/organization/compensation field family plan.md's Phase 1 primary scope names; execution requires a signed Gate A PROCEED, which authority-gate-decision.yaml's empty decisions list confirms has not happened."
  - id: hcmnext.rewards.reserve_compensation_budget/v1
    owner_domain: WORKFORCE_BUDGET
    kernel_family: CHANGE_REQUEST
    side_effect: INTERNAL_MUTATION
    gate: P1B
    disposition: INCLUDE
    rationale: "next-steps.md P1B contract #3, one bounded scarce-resource reservation for the Promotion vertical slice only."
  - id: hcmnext.rewards.release_compensation_budget/v1
    owner_domain: WORKFORCE_BUDGET
    kernel_family: CHANGE_REQUEST
    side_effect: INTERNAL_MUTATION
    gate: P1B
    disposition: INCLUDE
    rationale: "next-steps.md P1B contract #4, the compensating release of the same bounded reservation."
  - id: hcmnext.work.approve_proposal/v1
    owner_domain: HUMAN_WORK
    kernel_family: CHANGE_REQUEST
    side_effect: INTERNAL_MUTATION
    gate: P1B
    disposition: INCLUDE
    rationale: "next-steps.md P1B contract #5, the one approval task the Workflow kernel row of the Phase 1 Implementation-Depth Matrix authorizes at Gate B."
  - id: hcmnext.work.reject_proposal/v1
    owner_domain: HUMAN_WORK
    kernel_family: CHANGE_REQUEST
    side_effect: INTERNAL_MUTATION
    gate: P1B
    disposition: INCLUDE
    rationale: "next-steps.md P1B contract #6, the same one approval task's rejection path."
  - id: hcmnext.people.change_manager/v1
    owner_domain: PEOPLE
    kernel_family: CHANGE_REQUEST
    side_effect: INTERNAL_MUTATION
    gate: NONE
    disposition: DEFER
    rationale: "business-intent-catalog.md's own draft-contract table marks this a conformance fixture only; no row of the Phase 1 Implementation-Depth Matrix assigns it IMPLEMENT or MINIMAL CONTRACT depth, so it stays a compilation/negative-test fixture and never gates Phase 1 build work."

