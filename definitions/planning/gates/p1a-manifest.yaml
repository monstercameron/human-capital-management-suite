    test_ref: "conformance:hcmnext.rewards.simulate_compensation/v1"
  - id: hcmnext.rewards.evaluate_pay_band_position
    version: 1
    owner_domain: rewards
    effect_class: READ_ONLY
    test_ref: "conformance:hcmnext.rewards.evaluate_pay_band_position/v1"
  - id: hcmnext.intelligence.explain_transaction
