# Known authority-gate decision gaps (GOV-010).
#
# definitions/planning/authority-gate-decision.yaml ships with zero signed
# decisions: no gate has actually been decided yet (next-steps.md's Gate A
# milestone "M4 - Gate A decision" states "P1B exists only after a signed
# Gate A `PROCEED`", which has not happened). As of 2026-09-03,
# planning/todos.md already has 121 completed GATE_A-phase todos and 3
# completed GATE_B-phase todos, so tools/planning/authoritygate.CheckUndecidedGates
# genuinely reports both gates undecided. This is a real, known
# work-in-progress state, not a tooling bug: completed substrate/evidence
# todos land ahead of the formal gate compiler and sign-off. Each entry is
# an exact (gate, kind) pair. The primary test fails on any undecided-gate
# violation not listed here, fails if a listed entry stops being a gap, and
# fails once an entry's expiry has passed.
known_authority_gate_gaps:
  - gate: GATE_A
    kind: undecided
    owner: governance-lead
    expiry: "2026-12-03"
    reason: >-
      121 GATE_A-phase todos are complete (2026-09-03 count) but no signed
      Gate A PROCEED/REMEDIATE/NARROW/RESELECT_WEDGE/STOP decision exists
      yet; the Gate A decision compiler (next-steps.md M4) has not run.
  - gate: GATE_B
    kind: undecided
    owner: governance-lead
    expiry: "2026-12-03"
    reason: >-
      3 GATE_B-phase todos are complete (2026-09-03 count) ahead of Gate A
      itself being decided; Gate B cannot be decided before Gate A per
      execution-plan.md ("Incremental work begins only after Gate A
      demonstrates repeated value").
  - gate: GATE_C
    kind: undecided
    owner: governance-lead
    expiry: "2026-12-03"
    reason: >-
      61 GATE_C-phase todos are complete (2026-09-06 count, closed by the
      Gate A, company-metadata and authorization waves) ahead of Gates A
      and B being decided; Gate C cannot be decided before them per
      execution-plan.md, so the gap is tracked here until the decision
      compiler runs.

